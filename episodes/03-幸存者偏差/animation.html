<!doctype html>
<html lang="zh">
<head>

<link rel="stylesheet" href="../../engine/node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="../../engine/node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="../../engine/node_modules/@fontsource/jetbrains-mono/400.css">
<style>

  canvas { display: block; }

<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// =============== Episode 03 · 幸存者偏差 ===============
// Timings follow 分镜稿.md. This file currently holds the 15 s sample (0–15 s).
const W = 1920, H = 1080;
const ctx = document.getElementById('c').getContext('2d');
const GOLD = '245,215,110', RED = '232,72,58', WHITE = '242,242,242';
const SERIF = '"Noto Serif SC"', SANS = '"Noto Sans SC"', MONO = '"JetBrains Mono", "Noto Sans SC"';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const env = (t, a, b, fi = .35, fo = .35) => Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b));
const rgba = (c, a) => `rgba(${c},${a})`;
function hash(i, j) { let h = (i * 374761393 + j * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
window.DURATION = 15.0;

// ---------- captions: per-character blur-in ----------
// [start, end, text, y, size]   {g:..} gold  {r:..} red
const CAPS = [
  [0.3, 5.9, '你有没有发现，成功故事里的人，', 492, 66],
  [0.3, 5.9, '好像都做过{g:同样的事}？', 588, 66],
  [6.1, 8.9, '他们说：只要敢赌、肯坚持，{g:你也可以}。', 540, 72],
  [9.2, 11.9, '可你听到的，只是{g:站上台}的那几个人。', 960, 52],
  [12.1, 15.6, '和他们做了同样选择的更多人，{r:没机会}上台说话。', 960, 52],
];
function parse(s) { const out = []; const re = /\{([gr]):([^}]*)\}|([^{]+)/g; let m; while ((m = re.exec(s))) { const c = m[1] || ''; for (const ch of (m[2] ?? m[3])) out.push([ch, c]); } return out; }
function caption(t, [a, b, s, y, size]) {
  const chars = parse(s), outK = seg(t, b - .3, b);
  if (t < a - .05 || outK >= 1) return;
  ctx.save(); ctx.font = `900 ${size}px ${SERIF}`; ctx.textBaseline = 'middle';
  const ws = chars.map(([ch]) => ctx.measureText(ch).width), total = ws.reduce((p, q) => p + q, 0);
  let x = W / 2 - total / 2;
  chars.forEach(([ch, c], i) => {
    const t0 = a + i * .045, k = easeOut(seg(t, t0, t0 + .4)), al = k * (1 - outK);
    if (al > 0) {
      const col = c === 'g' ? GOLD : c === 'r' ? RED : WHITE;
      ctx.save(); ctx.globalAlpha = al; ctx.filter = `blur(${(1 - k) * 14 + outK * 10}px)`; ctx.fillStyle = rgba(col, 1);
      ctx.shadowColor = rgba(col, c ? .55 : .28); ctx.shadowBlur = c ? 26 : 22; ctx.fillText(ch, x, y + (1 - k) * 10); ctx.restore();
    }
    x += ws[i];
  });
  ctx.restore();
}
function text(s, x, y, font, color, align = 'center', alpha = 1, glow = 0) {
  if (alpha <= 0) return; ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; } ctx.fillText(s, x, y); ctx.restore();
}
// top-left chapter label
const LABELS = [[0.2, 8.9, 'SUCCESS STORIES  ·  成功故事'], [9.1, 11.95, 'ON STAGE  ·  台上'], [12.05, 15.6, 'OFF STAGE  ·  台下']];
function label(t) {
  ctx.save(); ctx.letterSpacing = '6px'; for (const [a, b, s] of LABELS) if (t >= a && t <= b) text(s, 120, 102, `400 22px ${MONO}`, 'rgba(109,104,94,1)', 'left', env(t, a, b, .4, .3)); ctx.restore();
}
function vignette() { const g = ctx.createRadialGradient(W / 2, H / 2, 380, W / 2, H / 2, 1150); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.9)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }

// ---------- A · centre question, the usual "success recipes" drift in around it ----------
const RECIPES = [
  ['辍学创业', 420, 250, 40], ['裸辞做博主', 1500, 230, 36], ['借钱 All in', 330, 800, 38],
  ['熬了七年没放弃', 1480, 820, 40], ['拒绝了稳定工作', 960, 190, 32], ['一夜爆红', 1650, 520, 30], ['卖掉房子去创业', 270, 520, 30],
];
function recipes(t) {
  const out = 1 - seg(t, 5.6, 6.0); if (out <= 0) return;
  RECIPES.forEach(([s, x0, y0, size], i) => {
    const tIn = 1.7 + i * .38, k = easeOut(seg(t, tIn, tIn + .7)); if (k <= 0) return;
    const shade = .5 + .35 * hash(i, 3), x = x0 + Math.sin(t * .5 + i * 1.3) * 8, y = y0 + Math.cos(t * .4 + i) * 6;
    ctx.save(); ctx.globalAlpha = k * out; ctx.filter = `blur(${(1 - k) * 12 + (1 - out) * 8}px)`;
    text(s, x, y + (1 - k) * 12, `500 ${size}px ${SANS}`, `rgba(226,222,214,${shade})`); ctx.restore();
  });
}
// a faint warm glow behind the opening text
function openingGlow(t) {
  const a = env(t, 0, 9.1, .6, .5); if (a <= 0) return;
  const g = ctx.createRadialGradient(W / 2, 540, 20, W / 2, 540, 760); g.addColorStop(0, `rgba(255,214,150,${.06 * a})`); g.addColorStop(1, 'rgba(255,214,150,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- B · the stage: a spotlight, three people on it; the camera pulls back to the crowd in the dark ----------
// one standing silhouette, feet at (x, y), height h
function person(x, y, h, fill, rim, rimA = 0) {
  const hr = h * .092, headY = y - h + hr, neck = headY + hr * 1.32, sw = h * .17, wb = h * .13, r = h * .075;
  ctx.beginPath();
  ctx.arc(x, headY, hr, 0, 7);
  ctx.moveTo(x - wb, y);
  ctx.lineTo(x - sw, neck + r * 1.4);
  ctx.quadraticCurveTo(x - sw, neck, x - sw + r, neck);
  ctx.lineTo(x + sw - r, neck);
  ctx.quadraticCurveTo(x + sw, neck, x + sw, neck + r * 1.4);
  ctx.lineTo(x + wb, y); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if (rimA > 0) { ctx.save(); ctx.strokeStyle = rgba(rim, rimA); ctx.lineWidth = 3; ctx.shadowColor = rgba(rim, rimA); ctx.shadowBlur = 18; ctx.stroke(); ctx.restore(); }
}
const STAGE = { x: 960, y: 640, rx: 330, ry: 44, face: 70 };
// the crowd, in world coordinates: below the stage and to its sides
const CROWD = (() => {
  const out = [], step = 104, rowH = 86;
  for (let r = 0; r < 40; r++) {
    const y = 560 + r * rowH;
    for (let c = -24; c < 44; c++) {
      const x = c * step + (r % 2) * step / 2 + (hash(c, r) - .5) * 40, yy = y + (hash(r, c) - .5) * 26;
      if (Math.abs(x - STAGE.x) < STAGE.rx + 120 && yy < STAGE.y + STAGE.face + 150) continue; // keep the stage clear
      out.push([x, yy, 175 + hash(c * 3, r) * 30, hash(c, r * 5)]);
    }
  }
  return out.sort((a, b) => a[1] - b[1]);
})();
function stage(t) {
  const a = env(t, 9.05, 99, .5, .4); if (a <= 0) return;
  // camera: from a close look at the stage, pull back until the crowd fills the frame
  const z = easeInOut(seg(t, 12.1, 15.8)), s = lerp(1, .36, z), fx = 960, fy = lerp(540, 930, z);
  ctx.save(); ctx.globalAlpha = a;
  ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-fx, -fy);
  const sx = STAGE.x, sy = STAGE.y, on = easeOut(seg(t, 9.15, 9.8)), flick = .93 + .07 * Math.sin(t * 23) * Math.sin(t * 7);
  // crowd: appears out of the dark, nearest the stage first
  const ck = seg(t, 12.2, 15.6);
  if (ck > 0) for (const [x, y, h, r] of CROWD) {
    const d = Math.hypot(x - sx, (y - sy) * 1.3), k = clamp((ck * 3200 - d) / 500); if (k <= 0) continue;
    const fall = 1 - .65 * clamp(d / 3400), back = clamp((y - 560) / 420 + .25), g = Math.round(40 + 26 * r);
    if (y < 760 && hash(Math.round(x), 7) < .35) continue; // ragged back edge
    ctx.globalAlpha = a * k * (.45 + .4 * r) * fall * back;
    person(x, y, h, `rgb(${g},${g - 2},${g - 6})`, WHITE, 0);
  }
  ctx.globalAlpha = a;
  // spotlight cone
  if (on > 0) {
    const top = -900, g = ctx.createLinearGradient(0, top, 0, sy);
    g.addColorStop(0, rgba('255,236,190', 0)); g.addColorStop(1, rgba('255,236,190', .16 * on * flick));
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(sx - 40, top); ctx.lineTo(sx + 40, top); ctx.lineTo(sx + STAGE.rx * .95, sy); ctx.lineTo(sx - STAGE.rx * .95, sy); ctx.closePath(); ctx.fill();
  }
  // platform
  ctx.fillStyle = '#141311'; ctx.beginPath(); ctx.ellipse(sx, sy + STAGE.face, STAGE.rx, STAGE.ry, 0, 0, Math.PI); ctx.lineTo(sx - STAGE.rx, sy); ctx.ellipse(sx, sy, STAGE.rx, STAGE.ry, 0, Math.PI, 0, true); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1d1b18'; ctx.beginPath(); ctx.ellipse(sx, sy, STAGE.rx, STAGE.ry, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = rgba(GOLD, .35 * on); ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(sx, sy, STAGE.rx, STAGE.ry, 0, 0, 7); ctx.stroke();
  // light pool on the stage
  if (on > 0) {
    ctx.save(); ctx.translate(sx, sy); ctx.scale(1, STAGE.ry / STAGE.rx);
    const p = ctx.createRadialGradient(0, 0, 10, 0, 0, STAGE.rx); p.addColorStop(0, rgba('255,236,190', .45 * on * flick)); p.addColorStop(1, rgba('255,236,190', 0));
    ctx.fillStyle = p; ctx.beginPath(); ctx.arc(0, 0, STAGE.rx, 0, 7); ctx.fill(); ctx.restore();
  }
  // the three on stage: rim-lit in gold
  [[sx - 150, 230, 0], [sx, 250, 1], [sx + 150, 226, 2]].forEach(([x, h, i]) => {
    const k = easeOut(seg(t, 9.4 + i * .15, 9.9 + i * .15)); if (k <= 0) return;
    ctx.globalAlpha = a * k; person(x, sy + 6, h, '#17140d', GOLD, .9 * on);
  });
  ctx.globalAlpha = a;
  // microphone in front of the middle one
  const mk = seg(t, 9.6, 10.0);
  if (mk > 0) {
    ctx.save(); ctx.globalAlpha = a * mk; ctx.strokeStyle = rgba(GOLD, .8); ctx.lineWidth = 4; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(sx + 50, sy + 14); ctx.lineTo(sx + 50, sy - 150); ctx.lineTo(sx + 30, sy - 175); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx + 30, sy + 14); ctx.lineTo(sx + 70, sy + 14); ctx.stroke();
    ctx.fillStyle = rgba(GOLD, .9); ctx.beginPath(); ctx.ellipse(sx + 26, sy - 182, 9, 14, -.6, 0, 7); ctx.fill(); ctx.restore();
  }
  ctx.restore();
}

const renderAt = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0A0A0A'; ctx.fillRect(0, 0, W, H);
  openingGlow(t); recipes(t); stage(t);
  vignette();
  // keep the bottom caption readable over the crowd
  if (t > 9) { const g = ctx.createLinearGradient(0, 860, 0, 1040); g.addColorStop(0, 'rgba(10,10,10,0)'); g.addColorStop(.5, `rgba(10,10,10,${.75 * seg(t, 12.5, 13.5)})`); g.addColorStop(1, 'rgba(10,10,10,0)'); ctx.fillStyle = g; ctx.fillRect(0, 860, W, 180); }
  for (const c of CAPS) caption(t, c);
  label(t);
};
window.render = t => renderAt(t);
window.ready = (async () => {
  const all = CAPS.map(c => c[2]).join('') + RECIPES.map(r => r[0]).join('') + '成功故事台上下';
  await Promise.all([document.fonts.load(`900 64px ${SERIF}`, all), document.fonts.load(`500 22px ${SANS}`, all),
    document.fonts.load(`400 24px ${MONO}`, 'SUCCESSTORIEONAGFT·成功故事台上下')]);
  await document.fonts.ready; window.render(0); return true;
})();
</script>
