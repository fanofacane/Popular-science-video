<script>
// =============== Episode 03 · 为自己而活 ===============
// Timings follow 分镜稿.md (full film, 76 s).
// One "life film strip" (0–80 years) runs through the whole film; each relationship lights only part of it.
const W = 1920, H = 1080;
const ctx = document.getElementById('c').getContext('2d');
const GOLD = '245,215,110', RED = '232,72,58', WHITE = '242,242,242';
const SERIF = '"Noto Serif SC"', SANS = '"Noto Sans SC"', MONO = '"JetBrains Mono", "Noto Sans SC"';

window.DURATION = 76.0;

// ---------- captions: per-character blur-in ----------
// [start, end, text, y, size]   {g:..} gold  {r:..} red
const CAPS = [
  [0.3, 6.6, '你有没有发现，这世上{g:最爱你}的人，', 460, 76],
  [3.4, 6.6, '其实都只见过你的{g:一部分}？', 574, 76],
  [7.1, 9.95, '父母，终究看不见你的{r:暮年}；', 960, 52],
  [10.1, 12.95, '伴侣，未曾参与你的{r:童年}；', 960, 52],
  [13.1, 16.6, '儿女，没见过你{g:风华正茂}的模样；', 960, 52],
  [16.75, 20.95, '而身边的友人，也无法拼凑出你{r:全部的过往}。', 960, 52],
  [21.1, 25.3, '在别人的眼里，你永远只是几个{r:零碎的片段}。', 960, 52],

  [32.1, 34.95, '从头到尾，阅尽了你{g:完整的人生}。', 960, 52],
  [35.1, 37.95, '见过你深夜崩溃时的{r:眼泪}，', 960, 52],
  [38.1, 40.95, '也见过你咬牙撑过去时的{g:倔强}；', 960, 52],
  [41.1, 44.4, '清楚你走过多少{r:弯路}，', 960, 52],
  [44.6, 48.95, '更明白你为了走到今天，付出了多少{g:不为人知}的代价。', 960, 52],
  [49.1, 52.95, '所以，别再把喜怒哀乐，寄托在{r:别人的评价}里；', 960, 52],
  [53.1, 56.4, '也别总期待有人能对你{g:感同身受}。', 960, 52],

  [60.1, 63.95, '那就请把{g:时间和精力}，都花在自己身上。', 960, 52],
  [64.1, 67.45, '好好爱惜自己的{g:身体}，耐心打磨自己的本事，', 960, 52],
  [67.6, 70.45, '对自己的{g:每一天}负责。', 960, 52],
  [70.6, 77, '往后余生，把日子过好，把自己活成{g:最喜欢的模样}。', 960, 52],
];
function parse(s) { const out = []; const re = /\{([gr]):([^}]*)\}|([^{]+)/g; let m; while ((m = re.exec(s))) { const c = m[1] || ''; for (const ch of (m[2] ?? m[3])) out.push([ch, c]); } return out; }
function caption(t, [a, b, s, y, size]) {

  const ws = chars.map(([ch]) => ctx.measureText(ch).width), total = ws.reduce((p, q) => p + q, 0);

const LABELS = [[0.2, 6.65, 'ONLY A PART  ·  一部分'], [7.05, 9.95, 'PARENTS  ·  父母'], [10.05, 12.95, 'PARTNER  ·  伴侣'], [13.05, 16.6, 'CHILDREN  ·  儿女'],
  [16.65, 21.0, 'FRIENDS  ·  友人'], [21.05, 25.35, 'FRAGMENTS  ·  碎片'], [29.1, 35.0, 'THE WHOLE STORY  ·  全程'], [35.05, 41.0, 'ONLY YOU SAW  ·  只有你见过'],
  [41.05, 49.0, 'DETOURS  ·  弯路'], [49.05, 53.0, 'OTHER PEOPLE  ·  评价'], [53.05, 56.5, 'EMPATHY  ·  感同身受'], [56.55, 64.0, 'THE ONLY WITNESS  ·  全程观众'],
  [64.05, 70.5, 'FOR YOURSELF  ·  花在自己身上'], [70.55, 76.0, 'FROM TODAY  ·  往后余生']];
function label(t) {
  ctx.save(); ctx.letterSpacing = '6px'; for (const [a, b, s] of LABELS) if (t >= a && t <= b) text(s, 120, 102, `400 22px ${MONO}`, 'rgba(109,104,94,1)', 'left', env(t, a, b, .4, .3)); ctx.restore();
}
function vignette() { const g = ctx.createRadialGradient(W / 2, H / 2, 380, W / 2, H / 2, 1150); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.9)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }

// ---------- the life film strip ----------
const N = 16, FW = 100, FX0 = 160, FY = 470, FH = 120, BAND = 176;   // 16 frames × 5 years = 0–80
const ageX = a => FX0 + a / 80 * N * FW;
const frameCX = i => FX0 + i * FW + FW / 2;

// little line drawings of a life, one per frame (frame-local: origin = frame centre, ground at y = +44)
function stick(x, gy, h, col, o = {}) {
  const hr = h * .13, top = gy - h, neck = top + hr * 2, hip = gy - h * .42, st = o.stoop || 0;
  ctx.beginPath(); ctx.arc(x + st, top + hr, hr, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + st, neck); ctx.lineTo(x, hip);                           // body
  ctx.moveTo(x, hip); ctx.lineTo(x - h * .14, gy); ctx.moveTo(x, hip); ctx.lineTo(x + h * .14, gy); // legs
  const ay = neck + h * .1;
  if (o.armUp) { ctx.moveTo(x + st, ay); ctx.lineTo(x + h * .22, top - h * .05); } else { ctx.moveTo(x + st, ay); ctx.lineTo(x + h * .2, ay + h * .2); }
  ctx.moveTo(x + st, ay); ctx.lineTo(x - h * .2, ay + h * .2);
  ctx.stroke();
}
function lifeIcon(i, col) {
  const gy = 44; ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const line = (pts) => { ctx.beginPath(); pts.forEach(([x, y], k) => k ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); };
  switch (i) {
    case 0: // baby in a cradle
      ctx.beginPath(); ctx.arc(0, 18, 26, 0, Math.PI); ctx.stroke(); line([[-26, 18], [26, 18]]);
      ctx.beginPath(); ctx.arc(-10, 10, 7, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.ellipse(8, 12, 12, 6, 0, 0, 7); ctx.stroke(); break;
    case 1: stick(-6, gy, 40, col); ctx.beginPath(); ctx.arc(18, gy - 6, 6, 0, 7); ctx.stroke(); break;                // kid with a ball
    case 2: stick(0, gy, 50, col); ctx.strokeRect(-17, gy - 40, 10, 16); break;                                         // school bag
    case 3: stick(-4, gy, 60, col); ctx.strokeRect(10, gy - 46, 14, 10); break;                                         // book
    case 4: stick(0, gy, 66, col, { armUp: true }); line([[-12, gy - 62], [0, gy - 68], [12, gy - 62], [0, gy - 57], [-12, gy - 62]]); break; // graduation cap
    case 5: line([[-40, gy], [-18, gy - 40], [2, gy]]); stick(14, gy, 64, col); ctx.strokeRect(-1, gy - 52, 11, 22); break; // backpack + mountain
    case 6: stick(-14, gy, 64, col); stick(14, gy, 60, col);                                                            // wedding + heart
      ctx.beginPath(); ctx.moveTo(0, -26); ctx.bezierCurveTo(-8, -34, -2, -42, 0, -36); ctx.bezierCurveTo(2, -42, 8, -34, 0, -26); ctx.stroke(); break;

    case 8: stick(-16, gy, 64, col); ctx.strokeRect(4, gy - 30, 30, 4); line([[8, gy - 30], [8, gy]]); line([[30, gy - 30], [30, gy]]); ctx.strokeRect(10, gy - 50, 18, 14); break; // desk + screen

// ---------- relationships: who sees which part ----------
// [name, from age, to age, light on, light off, figures [[age, height]], unseen [a0, a1, label]]
const REL = [
  ['父母', 0, 55, 7.25, 9.95, [[3, 84], [9, 78]], [55, 80, '看不见']],
  ['伴侣', 25, 80, 10.25, 12.95, [[27, 80]], [0, 25, '未曾参与']],
  ['儿女', 30, 80, 13.25, 16.6, [[37, 56]], [0, 30, '没见过']],
];
const SWEEP = 1.7;
function relLit(t, i) {   // brightness of frame i from the relationship on screen now
  let best = 0;
  for (const [, a0, a1, on, off] of REL) {
    const e = env(t, on, off, .2, .35); if (e <= 0) continue;
    const reach = lerp(a0, a1, easeInOut(seg(t, on + .1, on + .1 + SWEEP)));

    const e = env(t, on - .1, off, .4, .35); if (e <= 0) continue;
    ctx.save(); ctx.globalAlpha *= e;

// ---------- opening: the tilted pixel wall used by every episode (same as 01 / 02) ----------
function pixelWall(t) {
  const alpha = env(t, 0, 6.8, .6, .5) * .85; if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(W / 2, H / 2); ctx.rotate(-0.17); ctx.translate(-W / 2, -H / 2);
  const cell = 22, gap = 7, step = cell + gap, scroll = t * 18;
  for (let r = -14; r < 52; r++) {
    if (((r % 4) + 4) % 4 === 3) continue;
    const band = Math.floor(r / 4), y = r * step - 200, off = (((band % 2) + 2) % 2 ? -scroll : scroll), c0 = Math.floor((-400 - off) / step) - 1;
    for (let c = c0; c < c0 + 100; c++) {
      const x = c * step + off; if (x < -400 || x > W + 400) continue;
      const h = hash(c, r), b = 0.55 + 0.45 * hash(r, c * 7);
      ctx.fillStyle = h < 0.025 ? `rgba(245,215,110,${0.85 * b})` : h < 0.13 ? `rgba(150,128,58,${0.75 * b})` : `rgba(${Math.round(120 * b)},${Math.round(30 * b)},${Math.round(26 * b)},0.9)`;
      ctx.fillRect(x, y, cell, cell);
    }
  }
  ctx.restore();
  const g = ctx.createRadialGradient(W / 2, 500, 50, W / 2, 500, 900);
  g.addColorStop(0, `rgba(7,7,7,${0.72 * alpha})`); g.addColorStop(0.6, `rgba(7,7,7,${0.35 * alpha})`); g.addColorStop(1, 'rgba(7,7,7,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // counter above the caption: one cell = one day of a life
  const n = Math.floor(lerp(1, 29200, easeInOut(seg(t, .2, 6.2))));
  ctx.save(); ctx.letterSpacing = '6px'; text('你的一生  ·  ' + n.toLocaleString('en-US') + ' 天', W / 2, 395, `400 20px ${MONO}`, 'rgba(184,72,60,1)', 'center', env(t, .3, 6.6, .4, .3)); ctx.restore();
}

// ---------- friends: each one lights only a few scattered frames ----------
const FRIENDS = [['同学', 12, [2, 3], 16.9], ['室友', 27, [5], 17.35], ['同事', 45, [8, 9], 17.8], ['旧友', 66, [13], 18.25]];
const FR_OFF = 21.35;
function friendsLit(t, i) {
  let best = 0;
  for (const [, , fr, on] of FRIENDS) if (fr.includes(i)) best = Math.max(best, env(t, on + .15, FR_OFF, .45, .3));
  return best;
}
function friends(t) {
  const top = FY - BAND / 2;
  FRIENDS.forEach(([name, age, , on], k) => {
    const e = env(t, on, FR_OFF, .45, .3); if (e <= 0) return;
    ctx.save(); ctx.globalAlpha *= e; person(ageX(age), top - 18, 74, GOLD, .75); ctx.restore();
    text(name, ageX(age), top - 18 - 74 - 30, `700 26px ${SANS}`, rgba(GOLD, .9), 'center', e, 10);
  });
}

// ---------- you: one light runs the whole strip, nothing is missed ----------
const SELF_ON = 32.2, SELF_SWEEP = 2.4;
function selfLit(t, i) {

// ---------- other people's words: your moods hang from their comments, until the strings are cut ----------
const MOODS = [['喜', 780, '不错', 330, 260], ['哀', 900, '一般吧', 270, 610], ['怒', 1020, '就这？', 1590, 260], ['乐', 1140, '666', 1650, 610]];

  rr(x - w / 2, y - h / 2, w, h, 18); ctx.fillStyle = '#171614'; ctx.fill(); ctx.strokeStyle = 'rgba(200,190,170,.45)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 10, y + h / 2 - 1); ctx.lineTo(x, y + h / 2 + 14); ctx.lineTo(x + 10, y + h / 2 - 1); ctx.fillStyle = '#171614'; ctx.fill();

function judged(t) {
  const a = env(t, 49.05, 53.25, .45, .35); if (a <= 0) return;

  const g = ctx.createRadialGradient(fx, fy - 140, 10, fx, fy - 140, 260); g.addColorStop(0, rgba(GOLD, .08 + .22 * absorbed)); g.addColorStop(1, rgba(GOLD, 0)); ctx.fillStyle = g; ctx.fillRect(fx - 280, fy - 420, 560, 560);
  person(fx, fy, fh, GOLD, .55 + .4 * absorbed);

    const ap = easeOut(seg(t, 49.3 + k * .15, 49.8 + k * .15)), cut = 51.4 + k * .28, fall = seg(t, cut, cut + .5);

// ---------- empathy: two circles that never fully overlap ----------

// ---------- the only witness: an empty cinema, one lit seat; then time and energy flow back to it ----------
const SEAT = { row: 2, x: W / 2 };
const ROWS = Array.from({ length: 5 }, (_, r) => ({ y: 560 + r * 76, sc: .78 + r * .14 }));
const DOTS = Array.from({ length: 150 }, (_, i) => ({ x: 80 + hash(i, 31) * 1760, y: 90 + hash(i, 37) * 760, d: hash(i, 41) }));
function cinema(t) {
  const a = env(t, 56.55, 64.25, .5, .4); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  const dim = 1 - .85 * seg(t, 60.15, 61.0);
  // the screen, showing the whole lit strip
  ctx.save(); ctx.globalAlpha *= .4 + .6 * dim;
  rr(540, 100, 840, 300, 6); ctx.fillStyle = '#16140f'; ctx.fill(); ctx.strokeStyle = 'rgba(220,210,190,.25)'; ctx.lineWidth = 2; ctx.stroke();
  const sg = ctx.createLinearGradient(0, 400, 0, 900); sg.addColorStop(0, rgba('255,236,190', .07 * dim)); sg.addColorStop(1, rgba('255,236,190', 0)); ctx.fillStyle = sg; ctx.beginPath(); ctx.moveTo(540, 400); ctx.lineTo(1380, 400); ctx.lineTo(1800, 900); ctx.lineTo(120, 900); ctx.closePath(); ctx.fill();
  for (let i = 0; i < N; i++) frameAt(i, 960 - 368 + 23 + i * 46, 250, .46, dim * easeOut(seg(t, 56.8 + i * .04, 57.1 + i * .04)), 1);
  ctx.restore();

  ROWS.forEach(({ y, sc }, r) => {

    for (let c = 0; c < n; c++) {

        ctx.fillStyle = cone; ctx.beginPath(); ctx.moveTo(x - 30, -50); ctx.lineTo(x + 30, -50); ctx.lineTo(x + 110 * sc, y + 10); ctx.lineTo(x - 110 * sc, y + 10); ctx.closePath(); ctx.fill();
        const gg = ctx.createRadialGradient(x, y - 40 * sc, 5, x, y - 40 * sc, (90 + 140 * glow) * sc); gg.addColorStop(0, rgba(GOLD, .25 * lit + .35 * glow)); gg.addColorStop(1, rgba(GOLD, 0));
        ctx.fillStyle = gg; ctx.fillRect(x - 300, y - 300, 600, 600);
        ctx.save(); ctx.globalAlpha *= lit; person(x, y + 30 * sc, 150 * sc, GOLD, .6 + .4 * Math.max(lit * .6, glow)); ctx.restore();
      }
      rr(x - sw / 2, y - 26 * sc, sw, 58 * sc, 10 * sc); ctx.fillStyle = me ? `rgb(${mix('22,20,17', '60,50,26', lit)})` : '#141311'; ctx.fill();

      const X = lerp(px, tx, back), Y = lerp(py, ty, back) - Math.sin(Math.PI * back) * 60 * (d - .5);

// ---------- three small scenes: your body, your skills, your every day ----------
function threePanels(t) {
  const a = env(t, 64.05, 70.65, .4, .35); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;

  const P = [['身体', 64.3], ['本事', 65.7], ['每一天', 67.75]];
  P.forEach(([name, t0], i) => {
    const x = x0 + i * (PW + GAP), cx = x + PW / 2, cy = py + 210, ap = seg(t, 64.1 + i * .08, 64.45 + i * .08), on = seg(t, t0, t0 + .35), u = Math.max(0, t - t0);

      walker(cx, cy + 60, 220, on > 0 ? u * 11 : 0, cs, 5, 1); ctx.shadowBlur = 0;
      ctx.strokeStyle = cs; ctx.lineWidth = 3; ctx.beginPath();
      for (let k = 0; k <= 80; k++) { const xx = x + 40 + k * (PW - 80) / 80, ph = ((k / 80) * 3 - u * 1.4) % 1, pp = ph < 0 ? ph + 1 : ph;
        const yy = cy + 140 - (pp > .45 && pp < .5 ? (pp - .45) * 20 * 60 : pp >= .5 && pp < .55 ? (.55 - pp) * 20 * 60 - 30 : 0) * (on > 0 ? 1 : 0);
        k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
      ctx.stroke();
    } else if (i === 1) { // a rough stone being polished until it glows
      const pol = on > 0 ? easeOut(clamp(u / 2.6)) : 0, V = 7, rr0 = 110;
      const pts = Array.from({ length: V }, (_, k) => { const ang = k / V * Math.PI * 2 - Math.PI / 2, rad = rr0 * (lerp(.72 + .4 * hash(k, 3), 1, pol)); return [cx + Math.cos(ang) * rad, cy - 10 + Math.sin(ang) * rad]; });
      const g = ctx.createRadialGradient(cx, cy - 10, 5, cx, cy - 10, 150); g.addColorStop(0, rgba(GOLD, .55 * pol)); g.addColorStop(1, rgba(GOLD, 0)); ctx.fillStyle = g; ctx.fillRect(cx - 160, cy - 170, 320, 320);
      ctx.beginPath(); pts.forEach(([px, ppy], k) => k ? ctx.lineTo(px, ppy) : ctx.moveTo(px, ppy)); ctx.closePath(); ctx.fillStyle = `rgba(${mix('40,38,34', '120,96,40', pol)},1)`; ctx.fill();
      ctx.strokeStyle = cs; ctx.lineWidth = 3; ctx.stroke();
      ctx.save(); ctx.globalAlpha *= pol; ctx.strokeStyle = rgba(GOLD, .8); ctx.lineWidth = 1.5; ctx.beginPath(); pts.forEach(([px, ppy]) => { ctx.moveTo(cx, cy - 10); ctx.lineTo(px, ppy); }); ctx.stroke(); ctx.restore();
      // the tool working the right side
      const tx = cx + 150, ty = cy - 10 + Math.sin(u * 10) * 50 * (on > 0 ? 1 : 0);
      ctx.save(); ctx.translate(tx, ty); ctx.rotate(-.5); rr(-10, -60, 20, 120, 6); ctx.strokeStyle = cs; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
      if (on > 0) for (let k = 0; k < 6; k++) { const q = (u * 2 + k / 6) % 1; ctx.save(); ctx.globalAlpha *= (1 - q) * .8; ctx.fillStyle = `rgb(${GOLD})`; ctx.fillRect(cx + 115 + q * 50 * Math.cos(k), ty + q * 40 * Math.sin(k * 2), 3, 3); ctx.restore(); }
    } else { // calendar pages, each one ticked
      const per = .48, n = on > 0 ? Math.floor(u / per) : 0, f = on > 0 ? (u / per) % 1 : 0, pw = 220, ph = 240, px = cx - pw / 2, ppy = cy - ph / 2 - 10;
      const page = (day, lift, tick) => {
        ctx.save(); ctx.translate(0, -lift * 60); ctx.globalAlpha *= 1 - lift;
        rr(px, ppy, pw, ph, 12); ctx.fillStyle = '#1a1813'; ctx.fill(); ctx.strokeStyle = cs; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = cs; ctx.fillRect(px, ppy, pw, 46); [px + 60, px + pw - 60].forEach(rx => { ctx.beginPath(); ctx.arc(rx, ppy, 9, 0, 7); ctx.strokeStyle = cs; ctx.stroke(); });
        text('第 ' + day + ' 天', cx, ppy + 23, `700 24px ${SANS}`, '#1a1408');
        if (tick > 0) { ctx.save(); ctx.strokeStyle = rgba(GOLD, 1); ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 18;
          const A = [cx - 52, ppy + 145], B = [cx - 12, ppy + 185], Cc = [cx + 60, ppy + 95], k1 = clamp(tick * 2.2), k2 = clamp(tick * 2.2 - 1);
          ctx.beginPath(); ctx.moveTo(...A); ctx.lineTo(lerp(A[0], B[0], k1), lerp(A[1], B[1], k1)); if (k2 > 0) ctx.lineTo(lerp(B[0], Cc[0], k2), lerp(B[1], Cc[1], k2)); ctx.stroke(); ctx.restore(); }
        ctx.restore();

    }

    ctx.restore();

  });
  ctx.restore();
}

// keep bottom captions readable over busy scenes
function captionShade(t) {
  const k = Math.max(env(t, 56.6, 64.2, .4, .4), env(t, 29.3, 35.2, .4, .4));
  if (k <= 0) return; const g = ctx.createLinearGradient(0, 870, 0, 1050); g.addColorStop(0, 'rgba(10,10,10,0)'); g.addColorStop(.5, `rgba(10,10,10,${.8 * k})`); g.addColorStop(1, 'rgba(10,10,10,0)'); ctx.fillStyle = g; ctx.fillRect(0, 870, W, 180);
}

const renderAt = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#0A0A0A'; ctx.fillRect(0, 0, W, H);
  pixelWall(t); strip(t); relations(t); friends(t); shards(t); titleCard(t); selfScene(t);
  closeUps(t); detours(t); judged(t); empathy(t); cinema(t); threePanels(t); ending(t);
  vignette(); captionShade(t);
  for (const c of CAPS) caption(t, c);
  label(t);
  const fo = seg(t, 75.2, 76.0); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
};
window.render = t => renderAt(t);
window.ready = (async () => {
  const all = CAPS.map(c => c[2]).join('') + REL.map(r => r[0] + r[6][2]).join('') + FRIENDS.map(f => f[0]).join('') + MOODS.map(m => m[0] + m[2]).join('') + COSTS.map(c => c[1]).join('')
    + '风华正茂年龄为示意岁你的一生天为自己而活全程观众第期起点今天他能懂的只有这一小块身体本事每一天凌晨清晨';
  await Promise.all([document.fonts.load(`900 64px ${SERIF}`, all), document.fonts.load(`700 30px ${SANS}`, all), document.fonts.load(`500 30px ${SANS}`, all),
    document.fonts.load(`400 24px ${MONO}`, LABELS.map(l => l[2]).join('') + 'THEONLYWITNESSLIVEFORYU0123456789:·岁年龄为示意看不见未曾参与没见过全程起点能懂的只有这一小块凌晨清晨')]);
  await document.fonts.ready; window.render(0); return true;
})();
