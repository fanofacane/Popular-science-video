<script>
// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

const cv = document.getElementById('bg'); const ctx = cv.getContext('2d');

}

cue(68.7, 71.7, 470, 76, [{ text: '你没有坏掉。' }, { text: '你只是，{g:学会了保护自己}。', delay: .9 }], { lineHeight: 1.5 });

const PILL_TEXT = ['不恋家', '不思念', '不想倾诉', '抗拒亲密'];
const pillsEl = document.getElementById('pills');
const pills = PILL_TEXT.map(s => { const p = document.createElement('div'); p.className = 'pill'; p.textContent = s; pillsEl.appendChild(p); return p; });

// ---------- canvas: backgrounds ----------
function pixelWall(t, alpha) {

    for (let c = c0; c < c0 + 100; c++) {

  g.addColorStop(0, `rgba(7,7,7,${0.72 * alpha})`); g.addColorStop(0.6, `rgba(7,7,7,${0.35 * alpha})`); g.addColorStop(1, 'rgba(7,7,7,0)');

}
function floor(alpha, horizon = 640) {

  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = 'rgba(255,214,150,0.10)'; ctx.lineWidth = 1.2;
  const vx = W / 2;
  for (let i = -24; i <= 24; i++) { const x = vx + i * 160; ctx.beginPath(); ctx.moveTo(vx + (x - vx) * 0.12, horizon); ctx.lineTo(x + (x - vx) * 2.2, H + 300); ctx.stroke(); }

  g.addColorStop(0, `rgba(255,200,120,${0.10 * alpha})`); g.addColorStop(1, 'rgba(255,200,120,0)');

// ---------- chart 1: ACE household categories (horizontal bars) ----------
const ACE = [ // Felitti 1998, prevalence %
  ['家人酗酒 / 吸毒', 26, true], ['家人有精神疾病', 19], ['母亲遭受暴力', 13, true], ['父母言语 / 情感虐待', 11], ['父母躯体虐待', 11], ['家人入狱', 3],
];

  });

// ---------- chart 2: ACE score distribution (100% stacked bar) ----------
const ACEN = [['0 项', 48, '70,67,60'], ['1 项', 25, '245,215,110'], ['2 项', 13, '242,170,90'], ['3 项', 7, '238,120,70'], ['4+ 项', 7, '232,72,58']];
function aceStack(t) {
  const a = env(t, 26.8, 31.0, .5, .5); if (a <= 0) return;

  ACEN.forEach(([name, v, col], i) => {

    text(name, x + sw / 2, y + h + 92, `500 24px ${SANS}`, '#8a857a', 'center', k);
    x += sw;

  const k = easeOut(seg(t, 28.9, 29.5)), bx0 = x0 + w * .48 + 4, bx1 = x0 + w - 2, by = y - 34;
  ctx.save(); ctx.globalAlpha *= k; ctx.strokeStyle = `rgb(${GOLD})`; ctx.lineWidth = 3; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 12;

}

// ---------- chart 3: left-behind children by year (line) ----------
const LB = [[2000, 2699], [2005, 5861], [2010, 6103], [2015, 5493], [2020, 4177]];
function lbLine(t) {
  const a = env(t, 31.0, 39.0, .5, .5); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;

  const X = yr => lerp(px0, px1, (yr - 2000) / 20), Y = v => lerp(py0, py1, v / ymax);
  const gk = seg(t, 31.3, 31.9);

    ctx.strokeStyle = `rgba(255,240,210,${v ? .07 : .25})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(px0 - 20, Y(v)); ctx.lineTo(lerp(px0 - 20, px1 + 40, gk), Y(v)); ctx.stroke();

  }
  LB.forEach(([yr]) => text(String(yr), X(yr), py0 + 36, `400 22px ${MONO}`, '#8a857a', 'center', gk));
  const p = easeInOut(seg(t, 31.8, 34.2)) * (LB.length - 1);
  const pts = LB.map(([yr, v]) => [X(yr), Y(v)]);
  const i0 = Math.min(Math.floor(p), LB.length - 2), f = p - i0, tip = [lerp(pts[i0][0], pts[i0 + 1][0], f), lerp(pts[i0][1], pts[i0 + 1][1], f)];

  ctx.save(); ctx.beginPath(); ctx.moveTo(pts[0][0], py0);
  for (let i = 0; i <= i0; i++) ctx.lineTo(...pts[i]);
  ctx.lineTo(...tip); ctx.lineTo(tip[0], py0); ctx.closePath();
  const ag = ctx.createLinearGradient(0, py1, 0, py0); ag.addColorStop(0, `rgba(${GOLD},.22)`); ag.addColorStop(1, `rgba(${GOLD},0)`); ctx.fillStyle = ag; ctx.fill(); ctx.restore();
  // line (last segment dashed: different definition)
  ctx.save(); ctx.strokeStyle = `rgb(${GOLD})`; ctx.lineWidth = 4; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 16; ctx.lineJoin = 'round';
  for (let i = 0; i < LB.length - 1; i++) {
    const k = clamp(p - i); if (k <= 0) break;
    if (i === LB.length - 2) ctx.setLineDash([12, 10]);
    ctx.beginPath(); ctx.moveTo(...pts[i]); ctx.lineTo(lerp(pts[i][0], pts[i + 1][0], k), lerp(pts[i][1], pts[i + 1][1], k)); ctx.stroke();
  }
  ctx.restore();
  const hi = easeInOut(seg(t, 35.1, 35.6));
  LB.forEach(([yr, v], i) => {
    const at = 31.8 + (i / (LB.length - 1)) * 2.4, k = easeOut(seg(t, at, at + .4));
    if (k <= 0) return;
    const [x, y] = pts[i], peak = i === 2, last = i === LB.length - 1;
    ctx.save(); ctx.globalAlpha *= k;
    if (peak && hi > 0) { const ph = (t * 1.2) % 1; ctx.strokeStyle = `rgba(${GOLD},${.6 * (1 - ph) * hi})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 14 + 26 * ph, 0, 7); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(x, y, peak ? 9 + 3 * hi : 8, 0, 7);
    if (last) { ctx.fillStyle = '#070707'; ctx.fill(); ctx.strokeStyle = `rgb(${GOLD})`; ctx.lineWidth = 3; ctx.stroke(); }
    else { ctx.fillStyle = `rgb(${GOLD})`; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 18; ctx.fill(); }
    ctx.restore();
    const lbl = v.toLocaleString('en-US') + ' 万' + (last ? '*' : '');
    text(lbl, i === 0 ? x - 18 : x, i === 0 ? y - 30 : y - 42, peak ? `900 ${Math.round(34 + 12 * hi)}px ${SERIF}` : `900 30px ${SERIF}`, peak ? `rgb(${GOLD})` : '#d9d2c2', i === 0 ? 'right' : 'center', k * (peak ? 1 : 1 - .45 * hi), peak ? 20 * hi : 0);
  });
  text('* 2020 年为第七次人口普查官方口径，与此前研究口径不同', px1 + 40, py0 + 84, `400 18px ${SANS}`, '#6d685e', 'right', seg(t, 34.2, 34.8));
  ctx.restore();
}

// ---------- chart 4: China maltreatment prevalence (waffles) ----------
const CN = [['躯体虐待', 26.6], ['忽视', 26.0], ['情感虐待', 19.6], ['性虐待', 8.7]];
CN.forEach(r => ALLTEXT.push(r[0]));
function waffles(t) {
  const a = env(t, 39.0, 46.0, .5, .5); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const cell = 18, gap = 6, step = cell + gap, gw = 10 * step - gap, sp = 130, total = 4 * gw + 3 * sp, x0 = (W - total) / 2, y0 = 400;
  const focus = t < 42.9 ? (t > 40.0 ? 1 : -1) : 2; // waffle the caption talks about
  const fk = t < 42.9 ? easeInOut(seg(t, 40.0, 40.5)) : 1;
  CN.forEach(([name, v], gi) => {
    const gx = x0 + gi * (gw + sp), lit = Math.round(v), fillK = seg(t, 39.6 + gi * .15, 41.0 + gi * .15);
    const isF = gi === focus, dim = focus < 0 ? 1 : (isF ? 1 : 1 - .5 * fk);
    for (let n = 0; n < 100; n++) {
      const c = n % 10, r = 9 - Math.floor(n / 10), x = gx + c * step, y = y0 + r * step;
      const on = n < lit * fillK;
      ctx.save(); ctx.globalAlpha *= dim * seg(t, 39.2 + n * .004, 39.6 + n * .004);
      if (on) { const col = isF ? RED : GOLD; ctx.fillStyle = `rgb(${col})`; ctx.shadowColor = `rgb(${col})`; ctx.shadowBlur = isF ? 14 : 8; }
      else ctx.fillStyle = '#222120';
      ctx.fillRect(x, y, cell, cell); ctx.restore();
    }
    const k = seg(t, 40.4 + gi * .15, 40.9 + gi * .15);
    text(v.toFixed(1) + '%', gx + gw / 2, y0 + 10 * step + 50, `900 46px ${SERIF}`, isF ? `rgb(${RED})` : `rgb(${GOLD})`, 'center', k * dim, isF ? 18 : 0);
    text(name, gx + gw / 2, y0 + 10 * step + 106, `700 30px ${SANS}`, '#d9d2c2', 'center', k * dim);
  });
  text('每格 = 1% 的儿童', W / 2, y0 - 40, `400 20px ${MONO}`, '#6d685e', 'center', seg(t, 39.4, 39.9));
  ctx.restore();
}

// ---------- chart 5: depression odds ratio by trauma type (radar) ----------
const RAD = [['情感虐待', 2.78, true], ['忽视', 2.75, true], ['性侵害', 2.42], ['家庭暴力', 2.06], ['躯体虐待', 1.98]];
RAD.forEach(r => ALLTEXT.push(r[0]));
function radar(t) {
  const a = env(t, 46.0, 54.0, .5, .5); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const cx = W / 2, cy = 465, R = 290, n = RAD.length, vmax = 3;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const gk = easeOut(seg(t, 46.2, 47.0));
  for (let ring = 1; ring <= 3; ring++) {
    const r = R * ring / vmax * gk; ctx.beginPath();
    for (let i = 0; i <= n; i++) { const q = ang(i % n); i ? ctx.lineTo(cx + r * Math.cos(q), cy + r * Math.sin(q)) : ctx.moveTo(cx + r * Math.cos(q), cy + r * Math.sin(q)); }
    ctx.strokeStyle = `rgba(255,240,210,${ring === 3 ? .16 : .08})`; ctx.lineWidth = 1.5; ctx.stroke();
    text('OR ' + ring, cx + 8, cy - R * ring / vmax * gk - 2, `400 16px ${MONO}`, '#5f5a51', 'left', gk);
  }
  for (let i = 0; i < n; i++) { const q = ang(i); ctx.strokeStyle = 'rgba(255,240,210,.08)'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + R * gk * Math.cos(q), cy + R * gk * Math.sin(q)); ctx.stroke(); }
  const pk = easeInOut(seg(t, 46.8, 48.2)), hi = easeInOut(seg(t, 49.9, 50.5));
  const P = RAD.map(([, v], i) => [cx + R * v / vmax * pk * Math.cos(ang(i)), cy + R * v / vmax * pk * Math.sin(ang(i))]);
  ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.closePath();
  ctx.fillStyle = `rgba(${GOLD},${.14 * pk})`; ctx.fill();
  ctx.save(); ctx.strokeStyle = `rgba(${GOLD},${pk})`; ctx.lineWidth = 3; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 16; ctx.stroke(); ctx.restore();
  if (hi > 0) { ctx.save(); ctx.strokeStyle = `rgba(${RED},${hi})`; ctx.lineWidth = 5; ctx.shadowColor = `rgb(${RED})`; ctx.shadowBlur = 22; ctx.beginPath(); ctx.moveTo(...P[0]); ctx.lineTo(...P[1]); ctx.stroke(); ctx.restore(); }
  RAD.forEach(([name, v, top], i) => {
    const q = ang(i), k = seg(t, 47.6 + i * .12, 48.1 + i * .12), red = top ? hi : 0;
    const col = red > .5 ? `rgb(${RED})` : `rgb(${GOLD})`;
    ctx.save(); ctx.globalAlpha *= k; ctx.beginPath(); ctx.arc(...P[i], 8 + 4 * red, 0, 7); ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 16 + 16 * red; ctx.fill(); ctx.restore();
    const lx = cx + (R + 70) * Math.cos(q), ly = cy + (R + 56) * Math.sin(q), al = Math.abs(Math.cos(q)) < .2 ? 'center' : Math.cos(q) > 0 ? 'left' : 'right';
    const dimO = top ? 1 : 1 - .5 * hi;
    text(name, lx, ly - 18, `700 ${top ? 34 : 30}px ${SANS}`, red > .5 ? '#f6cfc8' : '#d9d2c2', al, k * dimO);
    text(v.toFixed(2), lx, ly + 22, `900 32px ${SERIF}`, col, al, k * dimO, red > .5 ? 18 : 0);
  });
  ctx.restore();
}

// ---------- DOM blocks ----------
const titleEl = document.getElementById('title');
const titleChars = [...titleEl.querySelectorAll('.main span')];
const kicker = titleEl.querySelector('.kicker'), sub = titleEl.querySelector('.sub'), dot = titleEl.querySelector('.dot');
const toggleEl = document.getElementById('toggle'), knob = toggleEl.querySelector('.knob'), track = toggleEl.querySelector('.track'), stateEl = toggleEl.querySelector('.state');
const disclaimer = document.getElementById('disclaimer');

function renderDOM(t) {
  let lt = '', la = 0;
  for (const [a, b, s] of LABELS) if (t >= a && t <= b) { lt = s; la = env(t, a, b, .5, .4); }
  labelEl.textContent = lt; labelEl.style.opacity = la;
  for (const m of METAS) m.el.style.opacity = env(t, m.start, m.end, .5, .4);

  // title at 10–14, replayed at 71.8–75
  const end = t >= 71.5, tt = end ? t - 61.8 : t;
  const ta = env(tt, 10.0, end ? 13.2 : 14.0, .3, end ? 1.0 : .45);
  titleEl.style.display = ta > 0 ? 'block' : 'none';
  if (ta > 0) {
    titleEl.style.opacity = ta; titleEl.style.transform = `scale(${1 + 0.035 * seg(tt, 10, 14)})`;
    kicker.style.opacity = seg(tt, 10.2, 10.8);
    titleChars.forEach((c, i) => { const k = easeOut(seg(tt, 10.35 + i * 0.09, 10.95 + i * 0.09)); c.style.opacity = k; c.style.filter = `blur(${(1 - k) * 18}px)`; });
    dot.style.opacity = seg(tt, 11.2, 11.5) * (0.75 + 0.25 * Math.sin(t * 6));
    const sk = easeOut(seg(tt, 11.3, 12.1)); sub.style.opacity = sk; sub.style.letterSpacing = `${0.5 + 0.4 * sk}em`;
  }

  // symptom pills (14–19)
  const pa = env(t, 14.0, 19.0, .2, .45);
  pillsEl.style.display = pa > 0 ? 'flex' : 'none';
  if (pa > 0) {
    pillsEl.style.opacity = pa;
    pills.forEach((p, i) => {
      const k = easeOut(seg(t, 14.3 + i * 0.45, 14.75 + i * 0.45)), off = easeInOut(seg(t, 16.1 + i * 0.18, 16.6 + i * 0.18));
      p.style.opacity = k; p.style.transform = `translateY(${(1 - k) * 14}px) scale(${0.92 + 0.08 * k})`; p.style.filter = `blur(${(1 - k) * 10}px)`;
      p.style.background = `rgba(${Math.round(lerp(245, 38, off))},${Math.round(lerp(215, 14, off))},${Math.round(lerp(110, 12, off))},1)`;
      p.style.color = off < .5 ? '#2a2108' : '#b9473a'; p.style.borderColor = `rgba(150,45,35,${off})`;
      p.style.boxShadow = `0 0 ${36 * (1 - off)}px rgba(245,215,110,${0.6 * (1 - off)})`;
    });
  }

  // toggle (57.8–62)
  const ta2 = env(t, 57.8, 62.0, .4, .45); toggleEl.style.display = ta2 > 0 ? 'flex' : 'none';
  if (ta2 > 0) {
    toggleEl.style.opacity = ta2; const k = easeInOut(seg(t, 58.7, 59.3));
    knob.style.left = lerp(126, 10, k) + 'px';
    knob.style.background = k < .5 ? '#F5D76E' : '#4a4740'; knob.style.boxShadow = `0 0 ${30 * (1 - k)}px rgba(245,215,110,.9)`;
    track.style.borderColor = `rgba(${Math.round(lerp(245, 90, k))},${Math.round(lerp(215, 86, k))},${Math.round(lerp(110, 78, k))},.7)`;
    stateEl.textContent = k < .5 ? 'ON' : 'OFF'; stateEl.style.color = k < .5 ? '#F5D76E' : '#6d685e';
  }
  disclaimer.style.opacity = env(t, 62.6, 75, .8, .6);
}

// ---------- frame ----------
window.render = function (t) {
  ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#070707'; ctx.fillRect(0, 0, W, H);
  pixelWall(t, env(t, 0, 10.0, .6, .5) * 0.85);
  floor(env(t, 9.9, 14.1, .5, .4), 700);
  aceBars(t); aceStack(t); lbLine(t); waffles(t); radar(t);
  floor(env(t, 53.9, 62.1, .5, .5) * 0.6, 760);
  const ea = env(t, 62.0, 75.0, 1.0, 1.2);
  if (ea > 0) { ctx.save(); const s = 1.12 - 0.12 * seg(t, 62, 75); ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2); pixelWall(t, ea * 0.55); ctx.restore(); }
  renderDOM(t); renderCues(t);
};
window.DURATION = 75;

window.ready = (async () => {
  const txt = [...document.querySelectorAll('#ui *')].map(e => e.textContent).join('') + ALLTEXT.join('') +
    '0123456789%万千项至少一*年为第七次人口普查官方口径与此前研究不同每格的儿童分数分布经历过几类不良OR.,/·+ ';
  await Promise.all([
    document.fonts.load(`900 64px ${SERIF}`, txt), document.fonts.load(`500 22px ${SANS}`, txt),
    document.fonts.load(`700 44px ${SANS}`, txt), document.fonts.load(`400 20px ${MONO}`, 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789·/–.%'),
  ]);
  await document.fonts.ready; window.render(0); return true;
})();
</script>
