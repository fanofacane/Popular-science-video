<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../engine/node_modules/@fontsource/noto-serif-sc/900.css">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; background: #0A0A0A; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// =============== Episode 03 · 全程观众 ===============
// Centre question → four lines from the corners → an eye among light shards → (later) road, walker, rain, stairs, sunrise.
const W = 1920, H = 1080;
const ctx = document.getElementById('c').getContext('2d');
const GOLD = '245,215,110', RED = '232,72,58', WHITE = '242,242,242';
const SERIF = '"Noto Serif SC"';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const rgba = (c, a) => `rgba(${c},${a})`;
function hash(i, j = 0) { let h = (i * 374761393 + j * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
window.DURATION = 21.5; // sample range for now; full film ~62 s

// ---------- captions: per-character blur → sharp ----------
// { a, b, s, x, y, size, align, dim:[t0,t1,alpha] (fade to a lower alpha), out:'dust' (dissolve at b) }
function parse(s) { const out = []; const re = /\{([gr]):([^}]*)\}|([^{]+)/g; let m; while ((m = re.exec(s))) { const c = m[1] || ''; for (const ch of (m[2] ?? m[3])) out.push([ch, c]); } return out; }
function caption(t, C) {
  const { a, b, s, x: X = W / 2, y, size, align = 'center', dim } = C;
  const chars = parse(s), outK = seg(t, b - .7, b);
  if (t < a - .05 || outK >= 1) return;
  ctx.save(); ctx.font = `900 ${size}px ${SERIF}`; ctx.textBaseline = 'middle';
  const ws = chars.map(([ch]) => ctx.measureText(ch).width), total = ws.reduce((p, q) => p + q, 0);
  let x = align === 'left' ? X : align === 'right' ? X - total : X - total / 2;
  const dimK = dim ? lerp(1, dim[2], easeInOut(seg(t, dim[0], dim[1]))) : 1;
  chars.forEach(([ch, c], i) => {
    const t0 = a + i * .05, k = easeOut(seg(t, t0, t0 + .45));
    // dissolve: characters drift up and blur out one after another
    const ok = easeInOut(seg(t, b - .7 + (i / chars.length) * .25, b - .2 + (i / chars.length) * .2));
    const al = k * (1 - ok) * dimK;
    if (al > 0.003) {
      const col = c === 'g' ? GOLD : c === 'r' ? RED : WHITE;
      ctx.save(); ctx.globalAlpha = al; ctx.filter = `blur(${(1 - k) * 14 + ok * 16 + (1 - dimK) * 2.5}px)`; ctx.fillStyle = rgba(col, 1);
      ctx.shadowColor = rgba(col, c ? .55 : .25); ctx.shadowBlur = c ? 26 : 18;
      ctx.fillText(ch, x, y + (1 - k) * 10 - ok * 26); ctx.restore();
    }
    x += ws[i];
  });
  ctx.restore();
  // light dust rising from the dissolving line
  if (C.dust && outK > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const x0 = align === 'left' ? X : align === 'right' ? X - total : X - total / 2;
    for (let n = 0; n < 60; n++) {
      const px = x0 + hash(n, C.seed) * total, k = seg(t, b - .7 + hash(n, C.seed + 1) * .3, b + .6);
      if (k <= 0 || k >= 1) continue;
      const py = y + (hash(n, C.seed + 2) - .5) * size - k * (60 + 80 * hash(n, C.seed + 3));
      const al = Math.sin(k * Math.PI) * .8, r = 1 + 2 * hash(n, C.seed + 4);
      ctx.fillStyle = rgba(hash(n, C.seed + 5) < .3 ? GOLD : WHITE, al);
      ctx.beginPath(); ctx.arc(px + (hash(n, C.seed + 6) - .5) * 40 * k, py, r, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
}

const DISSOLVE = 17.6; // all opening text dissolves here
const CAPS = [
  { a: 0.3, b: DISSOLVE, s: '你有没有发现，这世上最爱你的人，', y: 490, size: 68, dim: [4.4, 5.2, .22], dust: 1, seed: 11 },
  { a: 1.8, b: DISSOLVE, s: '其实都只见过你的{g:一部分}？', y: 600, size: 68, dim: [4.4, 5.2, .22], dust: 1, seed: 12 },
  // four corners, two rows each so the bottom pair never collide
  { a: 4.8, b: DISSOLVE, s: '父母，', x: 150, y: 150, size: 48, align: 'left', dust: 1, seed: 13 },
  { a: 5.0, b: DISSOLVE, s: '终究看不见你的{g:暮年}；', x: 150, y: 218, size: 48, align: 'left', dust: 1, seed: 23 },
  { a: 7.8, b: DISSOLVE, s: '伴侣，', x: 1770, y: 150, size: 48, align: 'right', dust: 1, seed: 14 },
  { a: 8.0, b: DISSOLVE, s: '未曾参与你的{g:童年}；', x: 1770, y: 218, size: 48, align: 'right', dust: 1, seed: 24 },
  { a: 10.8, b: DISSOLVE, s: '儿女，没见过你', x: 150, y: 862, size: 48, align: 'left', dust: 1, seed: 15 },
  { a: 11.2, b: DISSOLVE, s: '{g:风华正茂}的模样；', x: 150, y: 930, size: 48, align: 'left', dust: 1, seed: 25 },
  { a: 13.8, b: DISSOLVE, s: '而身边的友人，', x: 1770, y: 862, size: 48, align: 'right', dust: 1, seed: 16 },
  { a: 14.2, b: DISSOLVE, s: '也无法拼凑出你{g:全部的过往}。', x: 1770, y: 930, size: 48, align: 'right', dust: 1, seed: 26 },
  { a: 17.9, b: 21.6, s: '在别人的眼里，你永远只是几个{r:零碎的片段}。', y: 985, size: 50 },
];

// ---------- light shards ----------
const SHARDS = [];
for (let i = 0, n = 0; SHARDS.length < 46 && n < 600; n++) {
  const x = 80 + hash(n, 1) * (W - 160), y = 60 + hash(n, 2) * (H - 260);
  const ex = (x - W / 2) / 640, ey = (y - 470) / 230;
  if (ex * ex + ey * ey < 1) continue; // keep the eye clear
  const big = hash(n, 3);
  const size = big < .15 ? 70 + 50 * hash(n, 4) : big < .5 ? 34 + 26 * hash(n, 4) : 12 + 18 * hash(n, 4);
  const k = 3 + Math.floor(hash(n, 5) * 3), verts = [];
  for (let v = 0; v < k; v++) { const ang = (v / k) * Math.PI * 2 + (hash(n, 10 + v) - .5) * 1.1; verts.push([Math.cos(ang) * size * (.55 + .5 * hash(n, 20 + v)), Math.sin(ang) * size * (.55 + .5 * hash(n, 30 + v))]); }
  const c = hash(n, 6);
  SHARDS.push({ x, y, size, verts, col: c < .5 ? GOLD : c < .82 ? '236,232,222' : '176,204,255', rot: hash(n, 7) * 6.28, spin: (hash(n, 8) - .5) * .5, ph: hash(n, 9) * 6.28, t0: hash(n, 40) });
  i++;
}
function shard(S, t, alpha) {
  if (alpha <= 0) return;
  const fy = Math.sin(t * .6 + S.ph) * 14, fx = Math.cos(t * .45 + S.ph) * 8;
  ctx.save(); ctx.translate(S.x + fx, S.y + fy); ctx.rotate(S.rot + S.spin * t); ctx.globalAlpha = alpha;
  const p = new Path2D(); S.verts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); p.closePath();
  // glass body with a sheen band sliding across it ("流光")
  const s = S.size, sweep = ((t * .35 + S.ph) % 1.6) - .3;
  const g = ctx.createLinearGradient(-s, -s, s, s);
  g.addColorStop(0, rgba(S.col, .06)); g.addColorStop(clamp(sweep - .12), rgba(S.col, .1));
  g.addColorStop(clamp(sweep), rgba(S.col, .55)); g.addColorStop(clamp(sweep + .12), rgba(S.col, .1)); g.addColorStop(1, rgba(S.col, .05));
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g; ctx.fill(p);
  ctx.shadowColor = rgba(S.col, .9); ctx.shadowBlur = 16; ctx.strokeStyle = rgba(S.col, .75); ctx.lineWidth = 1.4; ctx.stroke(p);
  ctx.restore();
}

// ---------- the eye ----------
function eye(t, cx, cy, open, alpha) {
  if (alpha <= 0) return;
  const w = 220, up = 110 * open, dn = 74 * open;
  ctx.save(); ctx.globalAlpha = alpha;
  // soft halo
  const halo = ctx.createRadialGradient(cx, cy, 20, cx, cy, 380);
  halo.addColorStop(0, rgba(GOLD, .16 * (.3 + .7 * open))); halo.addColorStop(1, rgba(GOLD, 0));
  ctx.fillStyle = halo; ctx.fillRect(cx - 400, cy - 400, 800, 800);
  const lid = new Path2D();
  lid.moveTo(cx - w, cy); lid.bezierCurveTo(cx - w * .45, cy - up * 1.35, cx + w * .45, cy - up * 1.35, cx + w, cy);
  lid.bezierCurveTo(cx + w * .45, cy + dn * 1.35, cx - w * .45, cy + dn * 1.35, cx - w, cy); lid.closePath();
  // inside
  ctx.save(); ctx.clip(lid);
  ctx.fillStyle = '#0d0b08'; ctx.fillRect(cx - w, cy - 220, w * 2, 440);
  const look = Math.sin(t * .7) * 10, ix = cx + look, iy = cy + 3, R = 84;
  const ir = ctx.createRadialGradient(ix, iy, 30, ix, iy, R);
  ir.addColorStop(0, '#3a2810'); ir.addColorStop(.32, '#c58a32'); ir.addColorStop(.7, '#f5d76e'); ir.addColorStop(.93, '#8a5a1e'); ir.addColorStop(1, '#2a1b08');
  ctx.fillStyle = ir; ctx.beginPath(); ctx.arc(ix, iy, R, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,240,200,.18)'; ctx.lineWidth = 1.5;
  for (let k = 0; k < 64; k++) { const a = k / 64 * 6.283 + hash(k, 3) * .05, r0 = 32 + 5 * hash(k, 4), r1 = R * (.78 + .18 * hash(k, 5)); ctx.beginPath(); ctx.moveTo(ix + Math.cos(a) * r0, iy + Math.sin(a) * r0); ctx.lineTo(ix + Math.cos(a) * r1, iy + Math.sin(a) * r1); ctx.stroke(); }
  ctx.fillStyle = '#050403'; ctx.beginPath(); ctx.arc(ix, iy, 29 + 2 * Math.sin(t * 1.3), 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.ellipse(ix - 26, iy - 27, 12, 8, -.5, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.arc(ix + 23, iy + 24, 4.5, 0, 7); ctx.fill();
  // lid shadow on the eyeball
  const sh = ctx.createLinearGradient(0, cy - up * 1.1, 0, cy - up * .2); sh.addColorStop(0, 'rgba(0,0,0,.75)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sh; ctx.fillRect(cx - w, cy - 220, w * 2, 220);
  ctx.restore();
  // glowing outline + lashes
  ctx.globalCompositeOperation = 'lighter';
  ctx.shadowColor = rgba(GOLD, .9); ctx.shadowBlur = 26; ctx.strokeStyle = rgba(GOLD, .9); ctx.lineWidth = 3.5; ctx.stroke(lid);
  ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  for (let k = 1; k < 10; k++) {
    const u = k / 10, bx = (1 - u) ** 3 * (cx - w) + 3 * (1 - u) ** 2 * u * (cx - w * .45) + 3 * (1 - u) * u * u * (cx + w * .45) + u ** 3 * (cx + w);
    const by = 3 * (1 - u) ** 2 * u * (cy - up * 1.35) + 3 * (1 - u) * u * u * (cy - up * 1.35) + cy * ((1 - u) ** 3 + u ** 3);
    const ang = -Math.PI / 2 + (u - .5) * 1.5, L = (13 + 11 * Math.sin(u * Math.PI)) * open;
    ctx.strokeStyle = rgba(GOLD, .7 * open); ctx.beginPath(); ctx.moveTo(bx, by - 4); ctx.lineTo(bx + Math.cos(ang) * L, by - 4 + Math.sin(ang) * L); ctx.stroke();
  }
  ctx.restore();
}

// ---------- background ----------
function background(t) {
  ctx.fillStyle = '#0A0A0A'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * .45, 60, W / 2, H * .45, W * .62);
  g.addColorStop(0, 'rgba(40,36,30,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // faint drifting dust
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let n = 0; n < 70; n++) {
    const x = (hash(n, 71) * W + t * 6 * (hash(n, 72) - .5)) % W, y = (hash(n, 73) * H - t * 8 * hash(n, 74) + H) % H;
    ctx.fillStyle = `rgba(255,240,210,${.05 + .1 * hash(n, 75) * (.5 + .5 * Math.sin(t * 1.5 + n))})`;
    ctx.beginPath(); ctx.arc(x, y, .8 + 1.4 * hash(n, 76), 0, 7); ctx.fill();
  }
  ctx.restore();
}

function renderAt(t) {
  background(t);
  // eye + shards (17.6 →)
  const ea = easeOut(seg(t, 17.7, 18.3)), open = easeInOut(seg(t, 18.0, 19.8));
  const blink = open * (1 - .06 * Math.max(0, Math.sin((t - 20.6) * 9)) * (t > 20.6 && t < 20.95));
  eye(t, W / 2 - 290, 470, blink, ea); eye(t, W / 2 + 290, 470, blink, ea);
  SHARDS.forEach(S => shard(S, t, easeOut(seg(t, 18.3 + S.t0 * 1.6, 18.9 + S.t0 * 1.6))));
  CAPS.forEach(c => caption(t, c));
}

window.render = t => renderAt(t);
window.ready = (async () => {
  const all = CAPS.map(c => c.s).join('');
  await document.fonts.load(`900 64px ${SERIF}`, all);
  await document.fonts.ready; window.render(0); return true;
})();
</script>
</body>
</html>
