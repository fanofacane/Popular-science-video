<canvas id="c" width="1920" height="1080"></canvas>
<script>
// =============== Episode 02 · 不认命 — style of episode 01 ===============
// Black stage, tilted pixel wall, gold / red / white, blur-in serif captions, mono labels.
// Glowing "reference" line treatment is used only for real line charts.
// Line timings come from the voiceover (assets/ep02-不认命-配音.mp3), see scripts/02-不认命.md.
const W = 1920, H = 1080;
const ctx = document.getElementById('c').getContext('2d');
const GOLD = '245,215,110', RED = '232,72,58', WHITE = '242,239,232';
const SERIF = '"Noto Serif SC"', SANS = '"Noto Sans SC"', MONO = '"JetBrains Mono", "Noto Sans SC"';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const env = (t, a, b, fi = .35, fo = .35) => Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b));
const rgba = (c, a) => `rgba(${c},${a})`;
function hash(i, j) { let h = (i * 374761393 + j * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
window.DURATION = 49.6; // voice ends at 46.5, then the title card

// ---------- captions (episode 01 style: per-character blur-in) ----------
// [start, end, text, y, size]
const CAPS = [
  [0.17, 4.3, '还有多少个{g:明天}可以浪费？', 460, 76],
  [2.29, 4.3, '还有多少个{g:深夜}可以忏悔？', 574, 76],
  [4.71, 8.7, '你总说明天开始，总幻想着未来会{g:成功}。', 900, 52],
  [8.92, 12.3, '可你明明知道，现在的生活就是困住你的{r:枷锁}，', 900, 52],
  [12.47, 13.7, '你还要{r:等}到什么时候？', 900, 52],
  [13.87, 14.6, '我告诉你，', 470, 76],
  [14.93, 16.8, '贱卖{g:时间}换不来{g:财富}，', 900, 52],
  [16.95, 19.3, '{g:按部就班}走不出新路。', 900, 52],
  [19.42, 23.15, '每当你躺在床上，想到这辈子可能就{r:这样}了，', 900, 52],
  [23.45, 24.65, '你真的{g:甘心}吗？', 470, 76],
  [24.93, 28.0, '从这一刻起，{g:不认命}，只认{g:自己}。', 900, 52],
  [28.22, 29.65, '发了疯地去{g:健身}，', 900, 52],
  [29.8, 31.4, '发了疯地{g:提升自己}，', 900, 52],
  [31.56, 33.95, '去做{g:自媒体}，去学{g:AI}。', 900, 52],
  [34.14, 36.95, '无论如何，都要{g:跳出}现有的规则，', 900, 52],
  [37.19, 39.2, '因为那就是你的{r:枷锁}。', 900, 52],
  [39.49, 42.05, 'Lose {s:yourself} to find {g:yourself}.', 470, 92],
  [42.38, 44.35, '现在，写下你的{g:目标}，', 900, 52],
  [44.58, 46.75, '让命运看看你的{g:决心}。', 900, 52],
];
function parse(s) { const out = []; const re = /\{([grs]):([^}]*)\}|([^{]+)/g; let m; while ((m = re.exec(s))) { const c = m[1] || ''; for (const ch of (m[2] ?? m[3])) out.push([ch, c]); } return out; }
function caption(t, [a, b, s, y, size]) {
  const chars = parse(s), outK = seg(t, b - .3, b);
  if (t < a - .05 || outK >= 1) return;
  ctx.save(); ctx.font = `900 ${size}px ${SERIF}`; ctx.textBaseline = 'middle';
  const ws = chars.map(([ch]) => ctx.measureText(ch).width), total = ws.reduce((p, q) => p + q, 0);
  let x = W / 2 - total / 2, sx0 = 1e9, sx1 = -1e9;
  chars.forEach(([ch, c], i) => {
    const t0 = a + i * .045, k = easeOut(seg(t, t0, t0 + .4)), al = k * (1 - outK);
    if (al > 0) {
      const col = c === 'g' ? GOLD : c === 'r' ? RED : c === 's' ? lerp3(WHITE, '150,140,128', seg(t, a + 1.0, a + 1.3)) : WHITE;
      ctx.save(); ctx.globalAlpha = al; ctx.filter = `blur(${(1 - k) * 14 + outK * 10}px)`; ctx.fillStyle = rgba(col, 1);
      ctx.shadowColor = rgba(col, c ? .55 : .28); ctx.shadowBlur = c ? 26 : 22; ctx.fillText(ch, x, y + (1 - k) * 10); ctx.restore();
    }
    if (c === 's') { sx0 = Math.min(sx0, x); sx1 = Math.max(sx1, x + ws[i]); }
    x += ws[i];
  });
  const sk = easeOut(seg(t, a + 1.0, a + 1.3)) * (1 - outK);
  if (sx1 > sx0 && sk > 0) { ctx.strokeStyle = `rgb(${RED})`; ctx.lineWidth = size * .07; ctx.shadowColor = `rgb(${RED})`; ctx.shadowBlur = 18; ctx.beginPath(); ctx.moveTo(sx0 - 6, y + 4); ctx.lineTo(sx0 - 6 + (sx1 - sx0 + 12) * sk, y + 4); ctx.stroke(); }
  ctx.restore();
}
const lerp3 = (c1, c2, k) => { const p = c1.split(',').map(Number), q = c2.split(',').map(Number); return p.map((v, i) => Math.round(lerp(v, q[i], k))).join(','); };
function text(s, x, y, font, color, align = 'center', alpha = 1, glow = 0) {
  if (alpha <= 0) return; ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; } ctx.fillText(s, x, y); ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
// top-left label, as in episode 01
const LABELS = [[0.1, 4.4, 'DAYS  ·  日子'], [4.6, 8.8, 'SOMEDAY  ·  明天开始'], [8.9, 13.7, 'SAME DAY  ·  每一天'], [14.8, 16.85, 'SELLING TIME  ·  出卖时间'], [16.9, 19.3, 'ROUTINE  ·  按部就班'], [19.4, 24.75, 'LIFE  ·  一辈子'], [24.85, 28.1, 'FROM NOW ON  ·  从这一刻起'], [28.15, 34.0, 'ALL IN  ·  发了疯'], [34.05, 39.3, 'BREAK OUT  ·  跳出规则'], [39.4, 42.15, 'LOSE YOURSELF  ·  放下'], [42.25, 46.8, 'YOUR GOAL  ·  目标']];
function label(t) {
  ctx.save(); ctx.letterSpacing = '6px'; for (const [a, b, s] of LABELS) if (t >= a && t <= b) text(s, 120, 102, `400 22px ${MONO}`, 'rgba(109,104,94,1)', 'left', env(t, a, b, .4, .3)); ctx.restore();
}

// ---------- backgrounds ----------
function vignette() { const g = ctx.createRadialGradient(W / 2, H / 2, 380, W / 2, H / 2, 1150); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.9)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
// A · the pixel wall — identical to episode 01
function pixelWall(t) {
  const alpha = env(t, 0, 4.5, .6, .4) * .85; if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(W / 2, H / 2); ctx.rotate(-0.17); ctx.translate(-W / 2, -H / 2);
  const cell = 22, gap = 7, step = cell + gap, scroll = t * 18;
  for (let r = -14; r < 52; r++) {
    if (((r % 4) + 4) % 4 === 3) continue;
    const y = r * step - 200, off = (r % 2 ? scroll : -scroll * .7), c0 = Math.floor((-400 - off) / step) - 1;
    for (let c = c0; c < c0 + 100; c++) {
      const x = c * step + off; if (x < -400 || x > W + 400) continue;
      const h = hash(c, r), b = 0.55 + 0.45 * hash(r, c * 7);
      ctx.fillStyle = h < 0.025 ? `rgba(245,215,110,${0.85 * b})` : h < 0.13 ? `rgba(150,128,58,${0.75 * b})` : `rgba(${Math.round(120 * b)},${Math.round(30 * b)},${Math.round(26 * b)},0.9)`;
      ctx.fillRect(x, y, cell, cell);
    }
  }
  ctx.restore();
  const g = ctx.createRadialGradient(W / 2, 500, 50, W / 2, 500, 900);
  g.addColorStop(0, `rgba(7,7,7,${0.72 * alpha})`); g.addColorStop(0.6, `rgba(7,7,7,${0.35 * alpha})`); g.addColorStop(1, 'rgba(7,7,7,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const a = alpha;
  // counter above the caption
  const n = Math.floor(lerp(1, 7300, easeInOut(seg(t, .2, 4.2))));
  ctx.save(); ctx.letterSpacing = '6px'; text((t < 2.2 ? '已浪费的明天  ·  ' : '睡不着的深夜  ·  ') + n.toLocaleString('en-US'), W / 2, 405, `400 20px ${MONO}`, 'rgba(184,72,60,1)', 'center', env(t, .3, 4.4, .4, .4)); ctx.restore();
}
// floor grid used behind charts
function floorGrid(alpha, horizon = 700) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = 'rgba(255,214,150,0.10)'; ctx.lineWidth = 1.2;
  const vx = W / 2;
  for (let i = -24; i <= 24; i++) { const x = vx + i * 160; ctx.beginPath(); ctx.moveTo(vx + (x - vx) * .12, horizon); ctx.lineTo(x + (x - vx) * 2.2, H + 300); ctx.stroke(); }
  for (let k = 1; k < 16; k++) { const y = horizon + Math.pow(k / 15, 2.1) * (H - horizon + 80); ctx.globalAlpha = alpha * (.3 + .7 * k / 15); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
}

// ---------- B · "tomorrow I'll start": today walks forward, the START flag always hops one day ahead ----------
function someday(t) {
  const a = env(t, 4.5, 8.85, .35, .35); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const u = Math.max(0, t - 5.0), phase = u * (.9 + u * .38), n = Math.floor(phase), f = phase - n;
  const hop = easeInOut(clamp(f / .45)), pos = n + hop;                 // today's position (in days)
  const S = 118, G = 22, step = S + G, cy = 470, cam = pos * step * .55, X0 = 300;
  const sx = i => X0 + i * step - cam;
  const WEEK = ['一', '二', '三', '四', '五', '六', '日'];
  for (let i = 0; i < 26; i++) {
    const x = sx(i); if (x < -S || x > 1600) continue;
    const fade = clamp((1560 - x) / 260) * clamp((x + S) / 200), appear = easeOut(seg(t, 4.6 + i * .04, 5.0 + i * .04));
    ctx.save(); ctx.globalAlpha *= fade * appear;
    const past = i < pos - .5;
    rr(x - S / 2, cy - S / 2, S, S, 10);
    if (past) { ctx.fillStyle = 'rgba(120,32,28,.85)'; ctx.fill(); }
    else { ctx.fillStyle = '#1b1a17'; ctx.fill(); ctx.strokeStyle = 'rgba(200,190,170,.18)'; ctx.lineWidth = 2; ctx.stroke(); }
    text('周' + WEEK[(i + 2) % 7], x, cy + S / 2 + 34, `400 22px ${MONO}`, past ? 'rgba(150,70,60,1)' : '#6d685e');
    ctx.restore();
  }
  // today: white frame
  const tx = sx(pos);
  ctx.save(); ctx.strokeStyle = `rgb(${WHITE})`; ctx.lineWidth = 5; ctx.shadowColor = rgba(WHITE, .8); ctx.shadowBlur = 20;
  rr(tx - S / 2 - 8, cy - S / 2 - 8, S + 16, S + 16, 14); ctx.stroke(); ctx.restore();
  text('今天', tx, cy, `900 40px ${SERIF}`, `rgb(${WHITE})`, 'center', 1, 12);
  // START flag: sits on tomorrow, jumps ahead just before today arrives
  const fpos = n + 1 + easeInOut(clamp((f - .05) / .35)), fx = sx(fpos), jump = Math.sin(Math.PI * clamp((f - .05) / .35)) * 70;
  const fy = cy - S / 2 - 70 - jump;
  ctx.save(); ctx.strokeStyle = rgba(GOLD, .9); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(fx, fy + 28); ctx.lineTo(fx, cy - S / 2 - 6); ctx.stroke();
  rr(fx - 62, fy - 28, 124, 56, 28); ctx.fillStyle = `rgb(${GOLD})`; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 30; ctx.fill(); ctx.restore();
  text('开始', fx, fy + 1, `900 32px ${SERIF}`, '#1a1408');
  ctx.save(); rr(sx(Math.round(fpos)) - S / 2, cy - S / 2, S, S, 10); ctx.strokeStyle = rgba(GOLD, .5 * (1 - jump / 70)); ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
  // postponed counter
  text('已推迟', W / 2 - 40, 230, `500 32px ${SANS}`, 'rgba(160,152,138,1)', 'right');
  text(String(n), W / 2 + 10, 222, `900 110px ${SERIF}`, `rgb(${RED})`, 'left', 1, 24);
  text('次', W / 2 + 10 + (n >= 10 ? 130 : 70), 236, `500 32px ${SANS}`, 'rgba(160,152,138,1)', 'left');
  // success: glowing far away, never gets closer
  const sk = seg(t, 6.6, 7.1);
  if (sk > 0) {
    ctx.save(); ctx.globalAlpha *= sk; const px = 1700, pulse = .75 + .25 * Math.sin(t * 4);
    const g = ctx.createRadialGradient(px, cy, 10, px, cy, 220); g.addColorStop(0, rgba(GOLD, .35 * pulse)); g.addColorStop(1, rgba(GOLD, 0)); ctx.fillStyle = g; ctx.fillRect(px - 220, cy - 220, 440, 440);
    ctx.setLineDash([10, 8]); ctx.strokeStyle = rgba(GOLD, .9); ctx.lineWidth = 3; rr(px - 80, cy - 80, 160, 160, 14); ctx.stroke(); ctx.setLineDash([]);
    text('成功', px, cy, `900 48px ${SERIF}`, `rgb(${GOLD})`, 'center', 1, 26);
    text('永远在下一个明天', px, cy + 128, `400 22px ${MONO}`, rgba(GOLD, .6));
    ctx.restore();
  }
  ctx.restore();
}

// ---------- C · the same loop every day; on "枷锁" the loop becomes a chain with a lock ----------
function sameDays(t) {
  const a = env(t, 8.8, 13.75, .35, .35); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const cx = W / 2, cy = 430, R = 280, draw = easeInOut(seg(t, 8.95, 9.7)), chain = easeInOut(seg(t, 11.15, 11.9));
  const u = Math.max(0, t - 9.5), laps = u * (.55 + u * .32), ang = -Math.PI / 2 - 2 * Math.PI / 6 + laps * 2 * Math.PI; // starts at 起床
  // ring: grey line → red chain
  const A0 = -Math.PI / 2;
  ctx.save(); ctx.strokeStyle = `rgba(200,190,170,${.35 * (1 - chain)})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R, A0, A0 + draw * 2 * Math.PI); ctx.stroke(); ctx.restore();
  if (chain > 0) {
    const N = 56;
    ctx.save(); ctx.strokeStyle = `rgb(${RED})`; ctx.shadowColor = `rgb(${RED})`; ctx.shadowBlur = 14;
    for (let i = 0; i < N; i++) {
      const th = A0 + (i / N) * 2 * Math.PI, k = clamp(chain * 1.6 - i / N * .6); if (k <= 0) continue;
      ctx.save(); ctx.globalAlpha *= k; ctx.translate(cx + R * Math.cos(th), cy + R * Math.sin(th)); ctx.rotate(th + Math.PI / 2);
      ctx.lineWidth = 5; ctx.beginPath();
      if (i % 2) ctx.ellipse(0, 0, 19, 8, 0, 0, 7); else { ctx.moveTo(-14, 0); ctx.lineTo(14, 0); }
      ctx.stroke(); ctx.restore();
    }
    ctx.restore();
  }
  // runner with a comet tail
  if (t > 9.5) {
    for (let k = 0; k < 24; k++) {
      const th = ang - k * .035, al = (1 - k / 24) * .8;
      ctx.fillStyle = rgba(chain > .5 ? RED : GOLD, al * .6); ctx.beginPath(); ctx.arc(cx + R * Math.cos(th), cy + R * Math.sin(th), 7 - k * .2, 0, 7); ctx.fill();
    }
    ctx.save(); ctx.fillStyle = '#fff6dc'; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 30; ctx.beginPath(); ctx.arc(cx + R * Math.cos(ang), cy + R * Math.sin(ang), 10, 0, 7); ctx.fill(); ctx.restore();
  }
  // the six stops of the day
  const STOPS = ['起床', '通勤', '上班', '下班', '刷手机', '睡觉'];
  STOPS.forEach((s, i) => {
    const th = -2 * Math.PI / 3 + i * Math.PI / 3, x = cx + R * Math.cos(th), y = cy + R * Math.sin(th);
    const ap = easeOut(seg(t, 9.0 + i * .1, 9.4 + i * .1)); if (ap <= 0) return;
    let d = Math.abs(((ang - th) % (2 * Math.PI) + 3 * Math.PI) % (2 * Math.PI) - Math.PI); const lit = t > 9.5 ? Math.exp(-d * d * 30) : 0;
    ctx.save(); ctx.globalAlpha *= ap; ctx.font = `700 28px ${SANS}`; const w = ctx.measureText(s).width + 52;
    rr(x - w / 2, y - 28, w, 56, 28); ctx.fillStyle = `rgb(${Math.round(lerp(28, 245, lit))},${Math.round(lerp(26, 215, lit))},${Math.round(lerp(23, 110, lit))})`;
    if (lit > .3) { ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 24 * lit; } ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(200,190,170,.3)'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
    text(s, x, y + 1, `700 28px ${SANS}`, lit > .5 ? '#1a1408' : 'rgba(210,202,188,1)', 'center', ap);
  });
  // day counter in the middle
  const day = Math.floor(1 + 1824 * Math.pow(seg(t, 9.6, 13.5), 2.6)), waiting = seg(t, 12.4, 12.8);
  ctx.save(); ctx.font = `900 96px ${SERIF}`; const dw = ctx.measureText(day.toLocaleString('en-US')).width; ctx.restore();
  text('第', cx - dw / 2 - 16, cy - 4, `500 34px ${SANS}`, 'rgba(160,152,138,1)', 'right', seg(t, 9.4, 9.8));
  text(day.toLocaleString('en-US'), cx, cy - 10, `900 96px ${SERIF}`, waiting > .5 ? `rgb(${RED})` : `rgb(${WHITE})`, 'center', seg(t, 9.4, 9.8), waiting > .5 ? 24 : 12);
  text('天', cx + dw / 2 + 16, cy - 4, `500 34px ${SANS}`, 'rgba(160,152,138,1)', 'left', seg(t, 9.4, 9.8));
  text(waiting > .5 ? '还在等' : '同样的一天', cx, cy + 74, `400 24px ${MONO}`, waiting > .5 ? rgba(RED, .9) : '#6d685e', 'center', seg(t, 9.6, 10));
  // the lock drops onto the chain
  const lk = seg(t, 11.7, 12.15);
  if (lk > 0) {
    const bounce = 1 - Math.pow(1 - lk, 3) * Math.cos(lk * 9), ly = cy + R + 18 - (1 - bounce) * 120;
    ctx.save(); ctx.globalAlpha *= clamp(lk * 3); ctx.translate(cx, ly);
    ctx.strokeStyle = `rgb(${RED})`; ctx.lineWidth = 10; ctx.shadowColor = `rgb(${RED})`; ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.arc(0, -30, 26, Math.PI, 0); ctx.lineTo(26, -10); ctx.moveTo(-26, -30); ctx.lineTo(-26, -10); ctx.stroke();
    rr(-46, -14, 92, 72, 12); ctx.fillStyle = `rgb(${RED})`; ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#2a0c0a'; ctx.beginPath(); ctx.arc(0, 14, 9, 0, 7); ctx.fill(); ctx.fillRect(-4, 16, 8, 22);
    ctx.restore();
  }
  ctx.restore();
}

// ---------- D · selling time: 24 big gold hours fly into the jar and shrink into small coins ----------
function sellingTime(t) {
  const a = env(t, 14.6, 16.95, .3, .3); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const B = 64, G = 10, cols = 3, tx0 = 470 - (cols * B + (cols - 1) * G) / 2, ty0 = 200;
  const jx = 1330, jy = 500, jw = 300, jh = 380, jTop = jy - jh / 2, jBot = jy + jh / 2;
  const blockPos = i => [tx0 + (i % cols) * (B + G) + B / 2, ty0 + Math.floor(i / cols) * (B + G) + B / 2];
  const rest = i => [jx - 112 + (i % 9) * 28 + (hash(i, 4) - .5) * 10, jBot - 14 - Math.floor(i / 9) * 9];
  const T0 = i => 14.95 + i * .045, FL = .45;
  text('你的 24 小时', 470, ty0 - 50, `400 24px ${MONO}`, 'rgba(160,152,138,1)');
  text('收入', jx, jTop - 50, `400 24px ${MONO}`, 'rgba(160,152,138,1)');
  // tower slots
  for (let i = 0; i < 24; i++) {
    const [x, y] = blockPos(i), k = seg(t, T0(i), T0(i) + FL);
    if (k > 0) { ctx.save(); ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(200,190,170,.18)'; ctx.lineWidth = 1.5; rr(x - B / 2, y - B / 2, B, B, 8); ctx.stroke(); ctx.restore(); }
    if (k <= 0) { ctx.save(); rr(x - B / 2, y - B / 2, B, B, 8); ctx.fillStyle = rgba(GOLD, .9); ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 16; ctx.fill(); ctx.restore();
      text('1h', x, y, `400 18px ${MONO}`, 'rgba(40,30,10,.7)'); }
  }
  // the jar
  ctx.save(); ctx.strokeStyle = 'rgba(220,214,200,.55)'; ctx.lineWidth = 3; const L = jx - jw / 2, Rr = jx + jw / 2;

  text('今天', x0, y0 + 50, `500 26px ${SANS}`, 'rgba(200,192,178,1)', 'center', seg(t, 42.7, 43.0));
  ctx.restore();
}

  ctx.restore();
}
