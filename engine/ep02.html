<canvas id="c" width="1920" height="1080"></canvas>
<script>
// =============== Episode 02 · 不认命（48 秒） ===============
// Illustrated 2D style: each line of the voiceover gets one hand-drawn object.
// Line timings: MiniMax voice (Chinese_patitent_teacher, 1.1x), aligned with silence detection + whisper.
const W = 1920, H = 1080;
const ctx = document.getElementById('c').getContext('2d');
const IVORY = '239,230,210', GOLD = '214,178,104', GOLDHI = '238,206,138', RED = '178,52,42', REDHI = '220,88,72';
const SERIF = '"Noto Serif SC"', SANS = '"Noto Sans SC"', MONO = '"JetBrains Mono", "Noto Sans SC"';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeBack = k => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const env = (t, a, b, fi = .35, fo = .35) => Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b));
const rgba = (c, a) => `rgba(${c},${a})`;
window.DURATION = 48;

// ---------- voiceover lines: [start, end, text, hideSubtitle] ----------
const LINES = [
  [0.17, 1.79, '还有多少个{g:明天}可以浪费？'],
  [2.29, 3.97, '还有多少个{g:深夜}可以忏悔？'],
  [4.71, 8.55, '你总说明天开始，总幻想着未来会{g:成功}。'],
  [8.92, 12.15, '可你明明知道，现在的生活就是困住你的{r:枷锁}，'],
  [12.47, 13.51, '你还要{r:等}到什么时候？'],
  [13.87, 14.43, '我告诉你，'],
  [14.93, 16.55, '贱卖{g:时间}换不来财富，'],
  [16.95, 18.69, '{g:按部就班}走不出新路。'],
  [19.42, 22.93, '每当你躺在床上，想到这辈子可能就这样了，'],
  [23.45, 24.33, '你真的{r:甘心}吗？'],
  [24.93, 27.69, '从这一刻起，不认命，只认自己。', true],
  [28.22, 29.48, '发了疯地去{g:健身}，'],
  [29.80, 31.18, '发了疯地{g:提升自己}，'],
  [31.56, 33.62, '去做{g:自媒体}，去学{g:AI}。'],
  [34.14, 36.73, '无论如何，都要{g:跳出}现有的规则，'],
  [37.19, 38.91, '因为那就是你的{r:枷锁}。'],
  [39.49, 41.76, 'Lose yourself to find yourself.', true],
  [42.38, 44.15, '现在，写下你的{g:目标}，'],
  [44.58, 46.49, '让命运看看你的{g:决心}。'],
];

// ---------- text helpers ----------
function parse(s) { const out = []; const re = /\{([gr]):([^}]*)\}|([^{]+)/g; let m; while ((m = re.exec(s))) { const c = m[1] || ''; for (const ch of (m[2] ?? m[3])) out.push([ch, c]); } return out; }
function typeLine(t, a, b, s, x, y, size, opts = {}) {
  const chars = parse(s), dur = Math.max(.35, (b - a) * .7), outK = opts.hold ? 0 : seg(t, b + .15, b + .45);
  if (t < a - .05 || outK >= 1) return;
  const font = opts.font || `900 ${size}px ${SERIF}`;
  ctx.save(); ctx.font = font; ctx.textBaseline = 'middle';
  const widths = chars.map(([ch]) => ctx.measureText(ch).width), total = widths.reduce((p, q) => p + q, 0);
  let cx = opts.align === 'left' ? x : x - total / 2;
  chars.forEach(([ch, c], i) => {
    const t0 = a + dur * i / chars.length, k = easeOut(seg(t, t0, t0 + .28)), al = k * (1 - outK) * (opts.alpha ?? 1);
    if (al > 0) {
      const col = c === 'g' ? GOLDHI : c === 'r' ? REDHI : (opts.color || IVORY);
      ctx.save(); ctx.globalAlpha = al; ctx.filter = `blur(${(1 - k) * 6 + outK * 6}px)`; ctx.fillStyle = rgba(col, 1);
      ctx.shadowColor = rgba(col, c ? .55 : .22); ctx.shadowBlur = c ? 20 : 10; ctx.fillText(ch, cx, y + (1 - k) * 6); ctx.restore();
    }
    cx += widths[i];
  });
  ctx.restore();
}
function txt(s, x, y, font, color, align = 'center', glow = 0, alpha = 1) {
  if (alpha <= 0) return; ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; } ctx.fillText(s, x, y); ctx.restore();
}
function ringText(s, cx, cy, r, rot, font, color, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const chars = [...s], step = Math.PI * 2 / chars.length;
  chars.forEach((ch, i) => { const q = rot + i * step; ctx.save(); ctx.translate(cx + r * Math.cos(q), cy + r * Math.sin(q)); ctx.rotate(q + Math.PI / 2); ctx.fillText(ch, 0, 0); ctx.restore(); });
  ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
const paper = (y0, y1) => { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, '#efe6d2'); g.addColorStop(1, '#d6c8a8'); return g; };
const metal = (y0, y1) => { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, '#f0d79a'); g.addColorStop(.45, '#c9a45c'); g.addColorStop(1, '#7d6232'); return g; };
const INK = 'rgba(40,34,28,.9)';

// ---------- shared texture ----------
const grain = document.createElement('canvas'); grain.width = grain.height = 512;
{ const g = grain.getContext('2d'), im = g.createImageData(512, 512); for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); }
function background(t) {
  const warm = easeInOut(seg(t, 26.0, 27.4));
  const g = ctx.createRadialGradient(W / 2, H * .45, 60, W / 2, H * .5, 1150);
  g.addColorStop(0, `rgb(${Math.round(lerp(24, 46, warm))},${Math.round(lerp(30, 32, warm))},${Math.round(lerp(44, 22, warm))})`);
  g.addColorStop(.55, `rgb(${Math.round(lerp(12, 22, warm))},${Math.round(lerp(15, 15, warm))},${Math.round(lerp(23, 11, warm))})`);
  g.addColorStop(1, '#050608'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 60; i++) {
    const sx = (Math.sin(i * 91.7) * .5 + .5) * W, sy = (Math.sin(i * 47.3) * .5 + .5) * H, dx = Math.sin(t * .12 + i) * 30, y = (sy - (t * (8 + i % 7) + i * 37) % H + H) % H;
    ctx.fillStyle = rgba(warm > .5 ? GOLDHI : IVORY, .05 + .1 * (Math.sin(t * .8 + i * 3) * .5 + .5)); ctx.beginPath(); ctx.arc(sx + dx, y, 1 + (i % 3) * .6, 0, 7); ctx.fill();
  }
}
function frame() {
  ctx.save(); ctx.strokeStyle = rgba(GOLD, .3); ctx.lineWidth = 1.2; ctx.strokeRect(40, 40, W - 80, H - 80); ctx.strokeRect(48, 48, W - 96, H - 96);
  for (const [x, y] of [[40, 40], [W - 40, 40], [40, H - 40], [W - 40, H - 40]]) { ctx.fillStyle = rgba(GOLD, .6); ctx.fillRect(x - 5, y - 5, 10, 10); }
  ctx.restore();
  txt('N° 02  ·  不认命', 84, 86, `400 20px ${MONO}`, rgba(GOLD, .7), 'left');
  txt('LOSE YOURSELF TO FIND YOURSELF', W - 84, 86, `400 18px ${MONO}`, rgba(GOLD, .5), 'right');
}
function grainOverlay(t) {
  ctx.save(); ctx.globalAlpha = .07; ctx.globalCompositeOperation = 'overlay';
  const ox = (t * 1371) % 512, oy = (t * 911) % 512;
  for (let x = -ox; x < W; x += 512) for (let y = -oy; y < H; y += 512) ctx.drawImage(grain, x, y);
  ctx.restore();
  const v = ctx.createRadialGradient(W / 2, H / 2, 420, W / 2, H / 2, 1150); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.7)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
// a simple person: head + shoulders
function person(x, y, s, col, alpha = 1, glow = 0) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = col; if (glow) { ctx.shadowColor = col; ctx.shadowBlur = glow; }
  ctx.beginPath(); ctx.arc(x, y - s * .62, s * .2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - s * .34, y + s * .2); ctx.quadraticCurveTo(x - s * .34, y - s * .36, x, y - s * .36); ctx.quadraticCurveTo(x + s * .34, y - s * .36, x + s * .34, y + s * .2); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function padlock(x, y, s, open = 0, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y);
  ctx.strokeStyle = metal(-s, 0); ctx.lineWidth = s * .16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-s * .32, 0); ctx.lineTo(-s * .32, -s * .38 - open * s * .25); ctx.arc(0, -s * .38 - open * s * .25, s * .32, Math.PI, 0); ctx.lineTo(s * .32, -s * .1 - open * s * .25); ctx.stroke();
  rr(-s * .5, -s * .08, s, s * .78, s * .12); ctx.fillStyle = metal(-s * .08, s * .7); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 20; ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(80,60,30,.6)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#2a2014'; ctx.beginPath(); ctx.arc(0, s * .25, s * .08, 0, 7); ctx.fill(); ctx.fillRect(-s * .03, s * .25, s * .06, s * .2);
  ctx.restore();
}
function chainLink(x, y, ang, w, h, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.strokeStyle = col; ctx.lineWidth = h * .32; rr(-w / 2, -h / 2, w, h, h / 2); ctx.stroke(); ctx.restore();
}
function cardFrame(x, y, w, h, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha;
  rr(x - w / 2, y - h / 2, w, h, 14); ctx.fillStyle = '#16130f'; ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 30; ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = rgba(GOLD, .85); ctx.lineWidth = 2; ctx.stroke(); rr(x - w / 2 + 12, y - h / 2 + 12, w - 24, h - 24, 8); ctx.strokeStyle = rgba(GOLD, .4); ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}

// ================= scenes =================
// A · tear-off calendar of "tomorrow" (0–2.2)
function sceneCalendar(t) {
  const a = env(t, 0, 2.3, .3, .3); if (a <= 0) return;
  const cx = W / 2, top = 170, cw = 460, ch = 560;
  ctx.save(); ctx.globalAlpha = a;
  const hg = ctx.createLinearGradient(0, top, 0, top + 110); hg.addColorStop(0, '#8e2f27'); hg.addColorStop(1, '#6a211b');
  rr(cx - cw / 2, top, cw, 110, 14); ctx.fillStyle = hg; ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 30; ctx.fill(); ctx.shadowBlur = 0;
  for (let i = 0; i < 6; i++) { ctx.fillStyle = '#141414'; ctx.beginPath(); ctx.arc(cx - 160 + i * 64, top + 18, 7, 0, 7); ctx.fill(); }
  const tears = Math.floor(clamp((t - .3) / .25, 0, 6));
  txt('第 ' + (1 + tears * 365) + ' 个明天', cx, top + 66, `700 34px ${SERIF}`, rgba(GOLDHI, 1), 'center', 12);
  for (let s = 3; s >= 1; s--) { ctx.fillStyle = `rgba(200,188,160,${.6 - s * .12})`; ctx.fillRect(cx - cw / 2 + s * 3, top + 110 + s * 4, cw, ch); }
  const page = (dx, dy, rot, al) => { ctx.save(); ctx.globalAlpha *= al; ctx.translate(cx + dx, top + 110 + dy); ctx.rotate(rot); ctx.fillStyle = paper(0, ch); ctx.fillRect(-cw / 2, 0, cw, ch);
    txt('TOMORROW', 0, 70, `400 22px ${MONO}`, 'rgba(120,40,32,.75)'); txt('明天', 0, 280, `900 190px ${SERIF}`, INK); ctx.restore(); };
  page(0, 0, 0, 1);
  for (let i = 0; i <= tears; i++) { const t0 = .3 + i * .25, k = seg(t, t0, t0 + 1.0); if (k <= 0 || k >= 1) continue; page(Math.sin(i * 2.3) * 300 * k, 760 * k * k, (i % 2 ? 1 : -1) * .9 * k, 1 - k); }
  ctx.restore();
}
// B · clock at night (2.2–4.6)
const ROMAN = ['XII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
function sceneClock(t) {
  const a = env(t, 2.1, 4.7, .3, .3); if (a <= 0) return;
  const cx = W / 2, cy = 470, R = 330;
  ctx.save(); ctx.globalAlpha = a;
  const face = ctx.createRadialGradient(cx - 60, cy - 80, 20, cx, cy, R); face.addColorStop(0, '#1a2034'); face.addColorStop(1, '#0a0c14');
  ctx.fillStyle = face; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = rgba(GOLD, .9); ctx.shadowColor = rgba(GOLD, .5); ctx.shadowBlur = 18; ctx.stroke(); ctx.shadowBlur = 0;
  ctx.lineWidth = 1.2; ctx.strokeStyle = rgba(GOLD, .45); ctx.beginPath(); ctx.arc(cx, cy, R - 16, 0, 7); ctx.stroke();
  for (let i = 0; i < 60; i++) { const q = i / 60 * Math.PI * 2, l = i % 5 ? 10 : 22; ctx.strokeStyle = rgba(GOLD, i % 5 ? .45 : .9); ctx.lineWidth = i % 5 ? 1.2 : 2.4;
    ctx.beginPath(); ctx.moveTo(cx + (R - 18) * Math.sin(q), cy - (R - 18) * Math.cos(q)); ctx.lineTo(cx + (R - 18 - l) * Math.sin(q), cy - (R - 18 - l) * Math.cos(q)); ctx.stroke(); }
  ROMAN.forEach((n, i) => { const q = i / 12 * Math.PI * 2; txt(n, cx + (R - 64) * Math.sin(q), cy - (R - 64) * Math.cos(q), `700 32px ${SERIF}`, rgba(IVORY, .85)); });
  // moon window
  const wy = cy - 120; ctx.save(); ctx.beginPath(); ctx.arc(cx, wy, 50, 0, 7); ctx.clip(); ctx.fillStyle = '#0e1428'; ctx.fillRect(cx - 55, wy - 55, 110, 110);
  ctx.fillStyle = rgba(IVORY, 1); ctx.shadowColor = rgba(IVORY, 1); ctx.shadowBlur = 18; ctx.beginPath(); ctx.arc(cx, wy + 4, 22, 0, 7); ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = '#0e1428'; ctx.beginPath(); ctx.arc(cx + 11, wy - 3, 19, 0, 7); ctx.fill(); ctx.restore();
  ctx.strokeStyle = rgba(GOLD, .7); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, wy, 50, 0, 7); ctx.stroke();
  const spin = (t - 2) * 6 + (t - 2) * (t - 2) * 3;
  const hand = (ang, len, w, col) => { ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.shadowColor = col; ctx.shadowBlur = 10; ctx.beginPath(); ctx.moveTo(0, 18); ctx.lineTo(0, -len); ctx.stroke(); ctx.restore(); };
  hand(Math.PI * 1.5 + spin / 12, R - 160, 9, rgba(GOLDHI, 1)); hand(spin, R - 74, 5, rgba(IVORY, .95));
  ctx.fillStyle = rgba(GOLDHI, 1); ctx.beginPath(); ctx.arc(cx, cy, 11, 0, 7); ctx.fill();
  ctx.restore();
}
// C · the dream bubble: "tomorrow I'll start", "I'll succeed" (4.6–8.8)
function sceneDream(t) {
  const a = env(t, 4.5, 8.9, .35, .35); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const px = 640, py = 760;
  // the person sits small at the bottom-left; a thought bubble rises
  person(px, py, 220, rgba(IVORY, .85));
  [[730, 560, 14], [790, 500, 22]].forEach(([x, y, r], i) => { const k = easeOut(seg(t, 4.9 + i * .15, 5.3 + i * .15)); ctx.fillStyle = rgba(IVORY, .35 * k); ctx.beginPath(); ctx.arc(x, y, r * k, 0, 7); ctx.fill(); });
  const bk = easeBack(seg(t, 5.2, 5.9)), bx = 1180, by = 360, wob = Math.sin(t * 2.2) * 6;
  if (bk > 0) {
    ctx.save(); ctx.translate(bx, by); ctx.scale(bk, bk);
    // cloud made of overlapping circles, glowing faintly — a dream
    ctx.fillStyle = 'rgba(239,230,210,.1)'; ctx.strokeStyle = rgba(IVORY, .55); ctx.lineWidth = 2; ctx.shadowColor = rgba(GOLDHI, .5); ctx.shadowBlur = 30;
    ctx.beginPath(); [[-240, 20, 120], [-110, -70, 140], [60, -90, 150], [210, -10, 130], [120, 90, 120], [-80, 100, 120]].forEach(([x, y, r]) => { ctx.moveTo(x + r, y + wob); ctx.arc(x, y + wob, r, 0, 7); }); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
    // inside: "明天开始" first, then the trophy of "success"
    const swap = easeInOut(seg(t, 6.5, 7.1));
    txt('明天开始', 0, 0 + wob, `900 92px ${SERIF}`, rgba(IVORY, .95), 'center', 16, 1 - swap);
    if (swap > 0) {
      ctx.save(); ctx.globalAlpha *= swap; ctx.filter = `blur(${1.5 + Math.sin(t * 3) * 1.2}px)`; ctx.translate(0, wob);
      // trophy
      ctx.fillStyle = metal(-120, 120); ctx.shadowColor = rgba(GOLDHI, .9); ctx.shadowBlur = 30;
      ctx.beginPath(); ctx.moveTo(-90, -110); ctx.lineTo(90, -110); ctx.quadraticCurveTo(90, 20, 0, 40); ctx.quadraticCurveTo(-90, 20, -90, -110); ctx.fill();
      ctx.lineWidth = 12; ctx.strokeStyle = metal(-100, 0); ctx.beginPath(); ctx.arc(-95, -60, 38, Math.PI * .5, Math.PI * 1.5); ctx.stroke(); ctx.beginPath(); ctx.arc(95, -60, 38, -Math.PI * .5, Math.PI * .5); ctx.stroke();
      ctx.fillRect(-14, 38, 28, 50); rr(-70, 86, 140, 34, 6); ctx.fill(); ctx.shadowBlur = 0;
      txt('成功', 0, -50, `900 44px ${SERIF}`, 'rgba(90,60,20,.85)');
      ctx.restore();
    }
    ctx.restore();
  }
  txt('FUTURE · 幻想', bx, by + 300, `400 20px ${MONO}`, rgba(GOLD, .6), 'center', 0, bk);
  ctx.restore();
}
// D · chains wrap around you, a padlock snaps shut; then an hourglass: how long will you wait? (8.8–13.7)
function sceneChains(t) {
  const a = env(t, 8.8, 13.75, .35, .35); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const cx = 860, cy = 560;
  person(cx, cy + 120, 380, rgba(IVORY, .75));
  // two rings of chain, drawn link by link
  const rings = [[cy - 20, 9.3], [cy + 120, 10.2]];
  rings.forEach(([ry, at]) => {
    const n = 26, shown = Math.floor(n * easeInOut(seg(t, at, at + 1.4)));
    for (let i = 0; i < shown; i++) {
      const q = i / n * Math.PI * 2, x = cx + 230 * Math.cos(q), y = ry + 56 * Math.sin(q), front = Math.sin(q) > 0;
      chainLink(x, y, q + Math.PI / 2 + (i % 2 ? Math.PI / 2 : 0), i % 2 ? 22 : 54, i % 2 ? 22 : 30, front ? '#c9a45c' : 'rgba(150,120,70,.5)');
    }
  });
  const lk = easeBack(seg(t, 11.5, 11.85));
  if (lk > 0) { padlock(cx, cy + 160, 150 * lk, 0, clamp(lk)); if (t < 12.1) { ctx.fillStyle = rgba(GOLDHI, .5 * (1 - seg(t, 11.8, 12.1))); ctx.beginPath(); ctx.arc(cx, cy + 190, 160, 0, 7); ctx.fill(); } }
  // hourglass on the right
  const hk = seg(t, 12.4, 12.8);
  if (hk > 0) {
    const hx = 1400, hy = 520, hh = 380, flip = 0, sand = seg(t, 12.6, 14);
    ctx.save(); ctx.globalAlpha *= hk; ctx.translate(hx, hy);
    ctx.fillStyle = metal(-hh / 2 - 20, -hh / 2); ctx.fillRect(-130, -hh / 2 - 26, 260, 26); ctx.fillRect(-130, hh / 2, 260, 26);
    ctx.strokeStyle = rgba(IVORY, .7); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-100, -hh / 2); ctx.quadraticCurveTo(-100, -20, -8, 0); ctx.quadraticCurveTo(-100, 20, -100, hh / 2); ctx.moveTo(100, -hh / 2); ctx.quadraticCurveTo(100, -20, 8, 0); ctx.quadraticCurveTo(100, 20, 100, hh / 2); ctx.stroke();
    ctx.fillStyle = rgba(GOLDHI, .9);
    const topH = lerp(130, 40, sand); ctx.beginPath(); ctx.moveTo(-80 + (130 - topH) * .3, -topH); ctx.lineTo(80 - (130 - topH) * .3, -topH); ctx.lineTo(4, -6); ctx.lineTo(-4, -6); ctx.fill();
    ctx.fillRect(-2, 0, 4, hh / 2 - 10);
    const botH = lerp(20, 110, sand); ctx.beginPath(); ctx.moveTo(-95, hh / 2); ctx.lineTo(95, hh / 2); ctx.lineTo(0, hh / 2 - botH); ctx.fill();
    ctx.restore();
    txt('还要等多久', hx, hy + hh / 2 + 70, `700 30px ${SERIF}`, rgba(IVORY, .7), 'center', 0, hk);
  }
  ctx.restore();
}
// E · the scale: a pile of your hours against a few coins (13.8–16.8)
function sceneScale(t) {
  const a = env(t, 13.75, 16.85, .3, .3); if (a <= 0) return;
