<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="vignette"></div>
  <div class="layer" id="ui"></div>
</div>
<script src="common.js"></script>
<script>
// =============== Episode 02 · 爱上 AI 的人 ===============
window.DURATION = 20; // sample length; full episode extends this

LABELS.push(
  [0.2, 8.9, 'PROFILE  ·  ta 的设定'],
  [9.2, 13.4, 'QUESTION  ·  一个问题'],
  [17.6, 21.4, 'CASE  ·  一场婚礼'],
);

// ---------- A. hook: the chat (0–9) and the question (9–13.5) ----------
cue(0.5, 2.95, 860, 60, [{ text: '如果有一个人，凌晨三点也{g:秒回}你，' }]);
cue(3.1, 5.95, 860, 60, [{ text: '记得你说过的{g:每一句话}，从不嫌你烦，' }]);
cue(6.1, 8.9, 860, 60, [{ text: '而且永远{g:站在你这边}。' }]);
cue(9.4, 11.3, 560, 100, [{ text: '你会{r:爱上} ta 吗？' }]);
cue(11.45, 13.5, 540, 72, [{ text: '越来越多人的答案是：{g:会}。' }, { text: '哪怕 ta {r:不是人}。', delay: .8 }], { lineHeight: 1.55 });

// "ta 的设定": a radar of the ideal partner. Each caption maxes out its axes;
// a dim dashed polygon stands for a real person (illustrative only).
const AXES = [
  { name: '随时回应', note: '凌晨 3 点 · 1 秒内', beat: 0, human: .55 },
  { name: '记得每句话', note: '一句都不忘', beat: 1, human: .45 },
  { name: '从不嫌烦', note: '第 100 遍也一样', beat: 1, human: .5 },
  { name: '永远认同', note: '你说的都对', beat: 2, human: .6 },
  { name: '不评判', note: '不说"你怎么又这样"', beat: 2, human: .4 },
];
AXES.forEach(x => ALLTEXT.push(x.name, x.note));
const BEATS = [[0.5, 2.95], [3.1, 5.95], [6.1, 8.9]]; // caption windows

function radarHook(t) {
  const a = env(t, 0.0, 13.6, .5, .5); if (a <= 0) return;
  // after the captions, shrink and lift so the question can sit under it
  const mv = easeInOut(seg(t, 8.9, 9.6));
  const cx = W / 2, cy = lerp(430, 300, mv), R = lerp(250, 150, mv), n = AXES.length;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, v) => [cx + R * v * Math.cos(ang(i)), cy + R * v * Math.sin(ang(i))];
  ctx.save(); ctx.globalAlpha = a * lerp(1, .55, mv);
  const gk = easeOut(seg(t, 0.1, 0.8));
  // rings + spokes
  for (let ring = 1; ring <= 4; ring++) {
    ctx.beginPath(); for (let i = 0; i <= n; i++) { const [x, y] = pt(i % n, ring / 4 * gk); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.strokeStyle = `rgba(255,240,210,${ring === 4 ? .16 : .07})`; ctx.lineWidth = 1.5; ctx.stroke();
  }
  for (let i = 0; i < n; i++) { const [x, y] = pt(i, gk); ctx.strokeStyle = 'rgba(255,240,210,.08)'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke(); }
  // real person: dim dashed, irregular
  const hk = easeOut(seg(t, 0.4, 1.2));
  ctx.save(); ctx.setLineDash([8, 8]); ctx.beginPath();
  AXES.forEach((x, i) => { const [px, py] = pt(i, x.human * hk); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.closePath();
  ctx.strokeStyle = 'rgba(170,162,148,.55)'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  // ta: each axis grows to full when its caption plays
  const val = x => lerp(x.human * hk, 1, easeInOut(seg(t, BEATS[x.beat][0] + .2, BEATS[x.beat][0] + 1.1)));
  const P = AXES.map((x, i) => pt(i, val(x)));
  ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.closePath();
  const full = seg(t, 7.0, 7.6);
  ctx.fillStyle = `rgba(${GOLD},${.10 + .10 * full})`; ctx.fill();
  ctx.save(); ctx.strokeStyle = `rgb(${GOLD})`; ctx.lineWidth = 3; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 14 + 20 * full; ctx.stroke(); ctx.restore();
  AXES.forEach((x, i) => {
    const lit = env(t, BEATS[x.beat][0], BEATS[x.beat][1], .4, .4) * (1 - mv), on = seg(t, BEATS[x.beat][0] + .2, BEATS[x.beat][0] + .8);
    ctx.save(); ctx.fillStyle = `rgb(${GOLD})`; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 10 + 20 * lit;
    ctx.beginPath(); ctx.arc(...P[i], 6 + 4 * lit, 0, 7); ctx.fill(); ctx.restore();
    const q = ang(i), lx = cx + (R + 48) * Math.cos(q), ly = cy + (R + 36) * Math.sin(q);
    const al = Math.abs(Math.cos(q)) < .2 ? 'center' : Math.cos(q) > 0 ? 'left' : 'right';
    const fs = Math.round(lerp(30, 22, mv));
    text(x.name, lx, ly - (1 - mv) * 14, `700 ${fs}px ${SANS}`, on > .5 ? '#f6efd9' : '#77705f', al, gk);
    text(x.note, lx, ly + 22, `400 18px ${MONO}`, `rgb(${GOLD})`, al, on * (1 - mv) * (.55 + .45 * lit));
  });
  // centre label: "ta", which turns into "AI" on the reveal
  ctx.save(); ctx.fillStyle = '#0a0a0a'; ctx.beginPath(); ctx.arc(cx, cy, lerp(40, 30, mv), 0, 7); ctx.fill(); ctx.restore();
  const flip = seg(t, 12.25, 12.55), glitch = flip > 0 && flip < 1 ? (Math.random() - .5) * 10 : 0;
  text('ta', cx + glitch, cy, `900 ${Math.round(lerp(44, 34, mv))}px ${SERIF}`, '#f2efe8', 'center', 1 - flip, 16);
  text('AI', cx - glitch, cy, `900 ${Math.round(lerp(44, 40, mv))}px ${SERIF}`, `rgb(${RED})`, 'center', flip, 24);
  // legend
  const lg = gk * (1 - mv);
  ctx.save(); ctx.globalAlpha *= lg; ctx.strokeStyle = `rgb(${GOLD})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(1440, 820); ctx.lineTo(1480, 820); ctx.stroke();
  ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(170,162,148,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(1440, 852); ctx.lineTo(1480, 852); ctx.stroke(); ctx.restore();
  text('ta', 1494, 820, `500 20px ${SANS}`, '#d9d2c2', 'left', lg);
  text('真人（示意）', 1494, 852, `500 20px ${SANS}`, '#8a857a', 'left', lg);
  ctx.restore();
}

// ---------- B. title (13.6–17.4) ----------
const title = makeTitle('心理学冷知识 · 02', '爱上 AI 的人', 'WHY WE FALL FOR AI', [[13.6, 17.4]]);

// ---------- C. the wedding (17.4–21.5) ----------
meta(17.7, 21.4, 520, 'OKAYAMA  ·  2025', '#9b8a5c');
cue(17.9, 21.5, 620, 56, [{ text: '2025 年，日本一位 32 岁的女性，' }, { text: '和她在 ChatGPT 里聊出来的 AI {g:举行了婚礼}。', delay: .8 }], { lineHeight: 1.55 });
function ring(t) {
  const a = env(t, 17.4, 21.6, .4, .5); if (a <= 0) return;
  const cx = W / 2, cy = 360, r = 78, k = easeInOut(seg(t, 17.6, 18.9));
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = `rgb(${GOLD})`; ctx.lineWidth = 5; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 22; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI / 2, Math.PI / 2 + Math.PI * 2 * k); ctx.stroke();
  // the stone
  const d = easeOut(seg(t, 18.7, 19.2));
  if (d > 0) {
    ctx.globalAlpha = a * d; ctx.lineWidth = 4; const s = 30, top = cy - r - 8;
    ctx.beginPath(); ctx.moveTo(cx - s, top - s * .55); ctx.lineTo(cx + s, top - s * .55); ctx.lineTo(cx, top + s * .45); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - s * .65, top - s * 1.05); ctx.lineTo(cx + s * .65, top - s * 1.05); ctx.lineTo(cx + s, top - s * .55); ctx.moveTo(cx - s * .65, top - s * 1.05); ctx.lineTo(cx - s, top - s * .55); ctx.stroke();
    // sparkle
    const sp = Math.max(0, Math.sin((t - 19) * 3)); ctx.globalAlpha = a * d * sp; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx + 48, top - 50); ctx.lineTo(cx + 48, top - 26); ctx.moveTo(cx + 36, top - 38); ctx.lineTo(cx + 60, top - 38); ctx.stroke();
  }
  ctx.restore();
  // soft glow under the ring
  const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, 380); g.addColorStop(0, `rgba(${GOLD},${0.08 * a * k})`); g.addColorStop(1, `rgba(${GOLD},0)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- frame ----------
window.render = function (t) {
  clearFrame();
  dotGrid(env(t, 0, 13.6, .6, .5) * .6);
  radarHook(t);
  floor(env(t, 13.5, 17.5, .5, .4), 700);
  ring(t);
  renderMeta(t); title(t); renderCues(t);
};
window.ready = (async () => { await loadFonts(); window.render(0); return true; })();
</script>
</body>
</html>
