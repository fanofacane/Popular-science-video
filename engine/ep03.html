// =============== Episode 03 · 复利（投资复利，3 分钟版） ===============
window.DURATION = 180; // 3 minutes

LABELS.push([3.4, 19.8, 'BACKTEST  ·  20 年回测']);

// ---------- A. 20 years of 100 a day: Nasdaq-100 vs a 1.6% bank deposit (0–26) ----------
// Real data: NDX_DCA rows = [date, principal, value] (see data/ep03_sim.py)
cue(0.3, 3.3, 420, 76, [{ text: '如果 {g:20} 年前，你每天定投纳指 {g:100} 块，' }, { text: '现在会有多少钱？', delay: .8 }], { lineHeight: 1.5 });
cue(3.5, 6.6, 900, 50, [{ text: '两个人，每天各拿出 100 块：一个定投{g:纳指}，一个存{g:银行}（年化 1.6%）。' }]);
cue(13.6, 16.4, 900, 56, [{ text: '同样投进去 {g:73 万}，20 年后——' }]);
cue(16.6, 19.8, 900, 56, [{ text: '差距：{g:471 万}。' }]);
ALLTEXT.push('定投纳指', '存银行', '本金 73 万', '差距', '557 万', '86 万', '471 万');

const DAY = 86400000, D0 = Date.parse(NDX_DCA[0][0]);
const ROWDAY = NDX_DCA.map(r => (Date.parse(r[0]) - D0) / DAY);
const END_DAY = ROWDAY[ROWDAY.length - 1];
const BR = Math.pow(1.016, 1 / 365) - 1;
const bankAt = day => 100 * (Math.pow(1 + BR, day + 1) - 1) / BR;
const RUNMAX = []; NDX_DCA.reduce((m, r, i) => (RUNMAX[i] = Math.max(m, r[2]), RUNMAX[i]), 0);
function rowIndex(day) { let lo = 0, hi = ROWDAY.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; ROWDAY[m] <= day ? lo = m : hi = m - 1; } return lo; }
function ndxAt(day) { const i = rowIndex(day), j = Math.min(i + 1, NDX_DCA.length - 1); const f = j > i ? clamp((day - ROWDAY[i]) / (ROWDAY[j] - ROWDAY[i])) : 0; return lerp(NDX_DCA[i][2], NDX_DCA[j][2], f); }

const RUN0 = 4.6, RUN1 = 19.0;
// time starts slow and keeps accelerating
// two camera moves: '#pull' = close-up that keeps pulling back; '#track' = follow the heads, then reveal at the end
const CAM = (location.hash.slice(1) || 'pull');
const clockDay = t => CAM === 'track' ? END_DAY * Math.pow(seg(t, RUN0, 17.8), 1.6) : END_DAY * Math.pow(seg(t, RUN0, RUN1), 2.0);
// smoothed Nasdaq value, used only to frame the camera (so daily noise doesn't shake it)
const EMA = []; NDX_DCA.reduce((e, r, i) => (EMA[i] = i ? e + (r[2] - e) * 0.04 : r[2], EMA[i]), 0);
function race(t) {
  const a = env(t, 4.0, 26.3, .6, .6); if (a <= 0) return;
  const p = seg(t, RUN0, RUN1), day = clockDay(t), i = rowIndex(day), vN = ndxAt(day), vB = bankAt(day);
  const z = (k => k * k * (3 - 2 * k))(seg(p, 0.04, 1.0));        // camera pull-back: 0 = close-up, 1 = full view
  const px0 = 200, px1 = 1500, py0 = 800, py1 = 140;
  // camera window in data space
  const eN = EMA[i], m = 0.28, full = Math.max(RUNMAX[i], vN, vB) * 1.18;
  let xl, xr, lo, hi, zz = z;
  if (CAM === 'track') {
    // a fixed 3-year window that slides with the heads; the y range hugs both lines
    zz = (k => k * k * (3 - 2 * k))(seg(t, 17.6, 19.2));
    const Wd = Math.min(1100, Math.max(230, day / 0.65)), txr = Math.max(day + Wd * 0.35, Wd), txl = txr - Wd;
    const tlo = Math.min(vB, eN) * 0.72 * seg(day, 300, 1400), thi = Math.max(3000, Math.max(vB, eN) * 1.22);
    xl = lerp(txl, 0, zz); xr = lerp(txr, (day + 1) * 1.03, zz); lo = lerp(tlo, 0, zz); hi = lerp(thi, full, zz);
  } else {
    const padR = lerp(18, (day + 1) * 0.03, z); xr = Math.max(day + padR, 170); xl = Math.max(0, xr - lerp(150, xr, z));
    lo = 0; hi = Math.max(3000, lerp(Math.max(vB, eN) * (1 + m), full, z), xr * 100 * 0.35);
  }
  const X = d => lerp(px0, px1, (d - xl) / (xr - xl)), Y = v => lerp(py0, py1, (v - lo) / (hi - lo));
  ctx.save(); ctx.globalAlpha = a;
  // axes and grid fade in as the camera pulls back
  const ax = CAM === 'track' ? Math.max(zz, .45 * seg(t, 7.5, 9.5)) : seg(z, 0.18, 0.6);
  const la = CAM === 'track' ? seg(t, 8.5, 10) : 1; // grid labels
  if (ax > 0) {
    for (let e = 2; e <= 7; e++) for (const mm of [1, 2, 5]) {
      const step = mm * Math.pow(10, e), spacing = (py0 - py1) * step / (hi - lo), al = ax * clamp((spacing - 60) / 80) * clamp((260 - spacing) / 80);
      if (al <= 0.01) continue;
      for (let v = Math.ceil(lo / step) * step; v < hi; v += step) {
        if (v <= 0) continue;
        ctx.strokeStyle = `rgba(255,240,210,${.07 * al})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(px0, Y(v)); ctx.lineTo(px1, Y(v)); ctx.stroke();
        text((v >= 1e4 ? Math.round(v / 1e4) : (v / 1e4).toFixed(1)) + ' 万', px0 - 18, Y(v), `400 18px ${MONO}`, `rgba(140,133,122,${al * la})`, 'right');
      }
    }
    for (const ys of [1, 2, 5, 10]) {
      const spacing = (px1 - px0) * 365.25 * ys / (xr - xl), al = ax * clamp((spacing - 120) / 30) * clamp((300 - spacing) / 40);
      if (al <= 0.01) continue;
      for (let y = 2007; y <= 2026; y++) if ((y - 2006) % ys === 0) {
        const x = X((Date.parse(y + '-01-01') - D0) / DAY); if (x < px0 + 10 || x > px1 + 5) continue;
        ctx.strokeStyle = `rgba(255,240,210,${.05 * al})`; ctx.beginPath(); ctx.moveTo(x, py1); ctx.lineTo(x, py0); ctx.stroke();
        text(String(y), x, py0 + 30, `400 20px ${MONO}`, `rgba(120,114,104,${al * la})`, 'center');
      }
    }
    ctx.save(); ctx.globalAlpha *= ax; ctx.strokeStyle = 'rgba(255,240,210,.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px0, py1); ctx.lineTo(px0, py0); ctx.lineTo(px1, py0); ctx.stroke(); ctx.restore();
  }
  // lines, clipped to the plot (soft-edged at the left while zoomed in)
  ctx.save(); ctx.beginPath(); ctx.rect(px0 - (1 - ax) * 400, 0, px1 - px0 + 420 + (1 - ax) * 400, py0 + 2); ctx.clip();
  const first = Math.max(0, rowIndex(Math.max(0, xl - 10))), stepK = (i - first) > 1800 ? 2 : 1;
  const nPts = [], bPts = [];
  for (let k = first; k <= i; k += stepK) nPts.push([X(ROWDAY[k]), Y(NDX_DCA[k][2])]);
  nPts.push([X(day), Y(vN)]);
  const b0 = Math.max(0, xl - 10);
  for (let k = 0; k <= 160; k++) { const d = lerp(b0, day, k / 160); bPts.push([X(d), Y(bankAt(d))]); }
  ctx.beginPath(); nPts.forEach((q, k) => k ? ctx.lineTo(...q) : ctx.moveTo(...q)); for (let k = bPts.length - 1; k >= 0; k--) ctx.lineTo(...bPts[k]); ctx.closePath();
  const gg = ctx.createLinearGradient(0, py1, 0, py0); gg.addColorStop(0, `rgba(${GOLD},.28)`); gg.addColorStop(1, `rgba(${GOLD},.05)`); ctx.fillStyle = gg; ctx.fill();
  ctx.save(); ctx.strokeStyle = '#e4dccb'; ctx.lineWidth = 3.5; ctx.shadowColor = 'rgba(255,255,255,.5)'; ctx.shadowBlur = 8; ctx.beginPath();
  bPts.forEach((q, k) => k ? ctx.lineTo(...q) : ctx.moveTo(...q)); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.strokeStyle = `rgb(${GOLD})`; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 16; ctx.beginPath();
  nPts.forEach((q, k) => k ? ctx.lineTo(...q) : ctx.moveTo(...q)); ctx.stroke(); ctx.restore();
  ctx.restore();
  // left edge fade while zoomed in, so the lines seem to come from nowhere
  if ((CAM === 'track' ? zz < 1 : ax < 1) && xl > 0) { const fg = ctx.createLinearGradient(px0 - 400, 0, px0 + 260, 0); fg.addColorStop(0, `rgba(7,7,7,${(CAM === 'track' ? 1 - zz : 1 - ax) * clamp(xl / 60)})`); fg.addColorStop(1, 'rgba(7,7,7,0)'); ctx.fillStyle = fg; ctx.fillRect(0, 0, px0 + 260, H); }
  // glowing heads + names
  const heads = [[X(day), Y(vB), '#e4dccb', '存银行'], [X(day), Y(vN), vN < vB ? `rgb(${RED})` : `rgb(${GOLD})`, '定投纳指']];
  const sep = Math.max(0, 40 - Math.abs(heads[0][1] - heads[1][1])) / 2 + 2;
  const nameA = seg(t, 4.6, 5.2) * (1 - seg(t, 19.0, 19.4));
  heads.forEach(([x, y, c, name], k) => {
    ctx.save(); ctx.globalAlpha *= seg(t, 4.0, 4.6); ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 24; ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fill(); ctx.restore();
    const below = (k === 0) === (heads[0][1] >= heads[1][1]);
    text(name, x + 18, y + (below ? sep : -sep), `700 24px ${SANS}`, c, 'left', nameA);
  });
  text(String(new Date(D0 + day * DAY).getUTCFullYear()), X(day), Math.min(py0 - 24, Math.max(Y(vN), Y(vB)) + 60), `400 22px ${MONO}`, '#cfc5a6', 'center', seg(t, RUN0, RUN0 + .4) * (1 - seg(t, RUN1, RUN1 + .4)));
  // the end: values, principal, and the gap
  const ek = easeOut(seg(t, 19.3, 20.0));
  if (ek > 0) {
    const yP = Y(730500);
    ctx.save(); ctx.globalAlpha *= ek; ctx.setLineDash([10, 10]); ctx.strokeStyle = 'rgba(170,162,148,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px0, yP); ctx.lineTo(px1, yP); ctx.stroke(); ctx.restore();
    text('本金 73 万', px0 + 16, yP - 20, `500 24px ${SANS}`, '#a8a08e', 'left', ek);
    text('557 万', X(day) - 20, Y(vN) - 6, `900 64px ${SERIF}`, `rgb(${GOLD})`, 'right', ek, 22);
    text('86 万', X(day) - 20, Y(vB) - 40, `900 48px ${SERIF}`, '#efe9da', 'right', ek, 8);
  }
  const gk = easeInOut(seg(t, 22.6, 23.4));
  if (gk > 0) {
    const bx = X(day) + 44, yb = Y(vB), yt = lerp(yb, Y(vN), gk);
    ctx.save(); ctx.strokeStyle = `rgb(${RED})`; ctx.lineWidth = 5; ctx.shadowColor = `rgb(${RED})`; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.moveTo(bx - 14, yb); ctx.lineTo(bx, yb); ctx.lineTo(bx, yt); ctx.lineTo(bx - 14, yt); ctx.stroke(); ctx.restore();
    text('差距', bx + 24, (yb + Y(vN)) / 2 - 34, `700 28px ${SANS}`, '#e8b0a6', 'left', seg(t, 23.2, 23.6));
    text('471 万', bx + 24, (yb + Y(vN)) / 2 + 14, `900 64px ${SERIF}`, `rgb(${RED})`, 'left', seg(t, 23.2, 23.6), 22);
  }
  ctx.restore();
}


// ======================= after the race: three lessons, under a minute =======================
// The race above is authored on a 0–26s clock; RACE_T squeezes it into 0–20s.
const RACE_KEYS = [[0, 0], [3.4, 4.0], [3.6, 4.6], [13.4, 19.0], [20.0, 26.3]];
function RACE_T(t) {
  for (let i = 1; i < RACE_KEYS.length; i++) if (t <= RACE_KEYS[i][0]) return lerp(RACE_KEYS[i - 1][1], RACE_KEYS[i][1], seg(t, RACE_KEYS[i - 1][0], RACE_KEYS[i][0]));
  return 99;
}
const title = makeTitle('冷知识 · 03', '复利', 'COMPOUND INTEREST', [[20.0, 23.0], [170.0, 176.0]]);
const FULL = { px0: 200, px1: 1560, py0: 790, py1: 150, xr: END_DAY * 1.03, hi: 6.5e6 };
const FX = d => lerp(FULL.px0, FULL.px1, d / FULL.xr), FY = v => lerp(FULL.py0, FULL.py1, v / FULL.hi);
const dayOf = s => (Date.parse(s) - D0) / DAY;
function axesFull(alpha) {
  ctx.save(); ctx.globalAlpha *= alpha;
  const stp = FULL.hi > 3e6 ? 1e6 : 2e5;
  for (let v = stp; v < FULL.hi; v += stp) { ctx.strokeStyle = 'rgba(255,240,210,.06)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(FULL.px0, FY(v)); ctx.lineTo(FULL.px1, FY(v)); ctx.stroke(); text(v / 1e4 + ' 万', FULL.px0 - 18, FY(v), `400 18px ${MONO}`, '#6d685e', 'right'); }
  ctx.strokeStyle = 'rgba(255,240,210,.3)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(FULL.px0, FULL.py1); ctx.lineTo(FULL.px0, FULL.py0); ctx.lineTo(FULL.px1, FULL.py0); ctx.stroke();
  for (let y = 2007; y <= 2026; y += 3) text(String(y), FX(dayOf(y + '-01-01')), FULL.py0 + 30, `400 20px ${MONO}`, '#6d685e', 'center');
  ctx.restore();
}
function ndxPath(fromDay = 0, toDay = END_DAY) {
  ctx.beginPath(); let started = false;
  for (let k = 0; k < NDX_DCA.length; k += 2) { const d = ROWDAY[k]; if (d < fromDay || d > toDay) continue; const x = FX(d), y = FY(NDX_DCA[k][2]); started ? ctx.lineTo(x, y) : (ctx.moveTo(x, y), started = true); }
}
function strokeGold(w = 4, al = 1) { ctx.save(); ctx.globalAlpha *= al; ctx.strokeStyle = `rgb(${GOLD})`; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 14; ctx.stroke(); ctx.restore(); }

// ---------- B. where the money comes from (22.6–31) ----------
LABELS.push([23.2, 31.2, 'WHERE IT COMES FROM  ·  钱从哪来']);
cue(23.3, 26.8, 880, 56, [{ text: '557 万里，你自己投进去的，只有 {g:73 万}。' }]);
cue(27.0, 31.2, 880, 56, [{ text: '剩下的 {g:87%}，都是收益又生出来的收益。' }]);
ALLTEXT.push('本金', '收益', '15%', '52%', '79%', '87%', '收益占比');
const SHARES = [['2011-10-20', '15%'], ['2016-10-20', '52%'], ['2021-10-20', '79%'], ['2026-10-19', '87%']];
function whereFrom(t) {
  const a = env(t, 22.6, 31.2, .5, .5); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; axesFull(1);
  const pk = easeInOut(seg(t, 23.0, 24.2));
  // principal layer (grey) and gains layer (gold)
  ctx.beginPath(); ctx.moveTo(FX(0), FY(0));
  for (let k = 0; k <= 120; k++) { const d = END_DAY * k / 120; ctx.lineTo(FX(d), FY(100 * (d + 1) * pk)); }
  ctx.lineTo(FX(END_DAY), FY(0)); ctx.closePath(); ctx.fillStyle = 'rgba(150,144,132,.45)'; ctx.fill();
  const gk = seg(t, 24.0, 24.8);
  ctx.save(); ctx.globalAlpha *= gk; ndxPath(); for (let k = 120; k >= 0; k--) { const d = END_DAY * k / 120; ctx.lineTo(FX(d), FY(100 * (d + 1))); } ctx.closePath();
  const gg = ctx.createLinearGradient(0, FULL.py1, 0, FULL.py0); gg.addColorStop(0, `rgba(${GOLD},.5)`); gg.addColorStop(1, `rgba(${GOLD},.12)`); ctx.fillStyle = gg; ctx.fill(); ctx.restore();
  ndxPath(); strokeGold(4);
  text('本金', FX(END_DAY) + 18, FY(730500 / 2), `700 28px ${SANS}`, '#b9b2a2', 'left', pk);
  text('收益', FX(END_DAY) + 18, FY(3.2e6), `700 28px ${SANS}`, `rgb(${GOLD})`, 'left', gk);
  // share of the total that is gains, year by year
  SHARES.forEach(([ds, lbl], i) => {
    const k = easeOut(seg(t, 26.8 + i * .7, 27.3 + i * .7)); if (k <= 0) return;
    const d = dayOf(ds), v = ndxAt(d), x = FX(d), y = FY(v), last = i === 3;
    ctx.save(); ctx.globalAlpha *= k; ctx.setLineDash([5, 6]); ctx.strokeStyle = 'rgba(255,240,210,.35)'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, FULL.py0); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.globalAlpha *= k; ctx.fillStyle = `rgb(${GOLD})`; ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill(); ctx.restore();
    text(lbl, last ? x - 16 : x, last ? y + 6 : y - 40, `900 ${last ? 64 : 40}px ${SERIF}`, `rgb(${GOLD})`, last ? 'right' : 'center', k, last ? 22 : 10);
  });
  text('收益占比', FX(dayOf('2011-10-20')) - 20, FY(ndxAt(dayOf('2011-10-20'))) - 90, `400 20px ${MONO}`, '#9b8a5c', 'left', seg(t, 26.8, 27.3));
  ctx.restore();
}

// ---------- C. getting off in 2008 (31–41) ----------
LABELS.push([45.2, 54.8, 'STAY IN  ·  坚持持有']);
cue(45.2, 49.6, 880, 54, [{ text: '2008 年，纳指{r:腰斩}。如果你在最低点卖掉，从此只存银行——' }]);
cue(49.8, 54.8, 880, 56, [{ text: '20 年后只有 {r:81 万}，比一直存银行还少。' }]);
ALLTEXT.push('坚持：557 万', '中途卖出：81 万', '存银行：86 万', '−54%', '卖出');
const SELL = dayOf('2008-11-20'), SELLV = ndxAt(SELL);
const quitAt = d => d <= SELL ? ndxAt(d) : SELLV * Math.pow(1 + BR, d - SELL) + 100 * (Math.pow(1 + BR, d - SELL) - 1) / BR;
function quitter(t) {
  const a = env(t, 31.0, 41.2, .5, .5); if (a <= 0) return;
  // zoomed in on the bottom first (so 81 vs 86 is readable), then zoom out to reveal the one who stayed
  const zo = easeInOut(seg(t, 37.4, 38.8)), keepHi = FULL.hi; FULL.hi = lerp(1.25e6, 6.5e6, zo);
  ctx.save(); ctx.globalAlpha = a; axesFull(1);
  ctx.save(); ctx.beginPath(); ctx.rect(FULL.px0, FULL.py1 - 30, W, FULL.py0 - FULL.py1 + 32); ctx.clip();
  const stay = seg(t, 37.2, 37.6);
  // the path up to the sale
  ndxPath(0, SELL); strokeGold(4);
  // the quitter's branch: sells, then a near-flat bank line
  const qk = easeInOut(seg(t, 33.4, 35.8)), qEnd = lerp(SELL, END_DAY, qk);
  if (qk > 0) { ctx.save(); ctx.strokeStyle = `rgb(${RED})`; ctx.lineWidth = 4; ctx.shadowColor = `rgb(${RED})`; ctx.shadowBlur = 12; ctx.beginPath();
    for (let k = 0; k <= 100; k++) { const d = lerp(SELL, qEnd, k / 100); k ? ctx.lineTo(FX(d), FY(quitAt(d))) : ctx.moveTo(FX(d), FY(quitAt(d))); } ctx.stroke(); ctx.restore(); }
  // the one who stayed (revealed after the verdict)
  if (stay > 0) { ndxPath(SELL, END_DAY); strokeGold(4, stay); }
  // bank line, faint
  ctx.save(); ctx.globalAlpha *= .6; ctx.strokeStyle = '#d8d0bf'; ctx.lineWidth = 2; ctx.setLineDash([8, 8]); ctx.beginPath();
  for (let k = 0; k <= 100; k++) { const d = END_DAY * k / 100; k ? ctx.lineTo(FX(d), FY(bankAt(d))) : ctx.moveTo(FX(d), FY(bankAt(d))); } ctx.stroke(); ctx.restore();
  // markers
  const mk = seg(t, 31.6, 32.2);
  ctx.save(); ctx.globalAlpha *= mk; ctx.fillStyle = `rgb(${RED})`; ctx.shadowColor = `rgb(${RED})`; ctx.shadowBlur = 18; ctx.beginPath(); ctx.arc(FX(SELL), FY(SELLV), 9, 0, 7); ctx.fill(); ctx.restore();
  ctx.restore();
  text('2008 · 指数 −54% · 卖出', FX(SELL) + 18, FY(SELLV) - 34, `700 26px ${SANS}`, `rgb(${RED})`, 'left', mk);
  text('中途卖出：81 万', FX(END_DAY) + 16, FY(quitAt(END_DAY)) + 22, `900 34px ${SERIF}`, `rgb(${RED})`, 'left', seg(t, 35.9, 36.4), 12);
  text('存银行：86 万', FX(END_DAY) + 16, FY(bankAt(END_DAY)) - 22, `700 24px ${SANS}`, '#d8d0bf', 'left', seg(t, 36.4, 36.9));
  text('坚持：557 万', FX(END_DAY) + 16, FY(ndxAt(END_DAY)), `900 40px ${SERIF}`, `rgb(${GOLD})`, 'left', zo, 18);
  ctx.restore(); FULL.hi = keepHi;
}

// ---------- D. missing the best 10 days (41–50) ----------
LABELS.push([67.2, 75.8, 'BEST DAYS  ·  最好的日子']);
cue(67.2, 71.6, 880, 54, [{ text: '5000 多个交易日，只错过涨得最多的 {g:10} 天：557 万变成 {r:348 万}。' }]);
cue(71.8, 75.8, 880, 56, [{ text: '而这 10 天，全都出现在市场{r:最恐慌}的时候。' }]);

const MISS = [['一直在场', 557.1], ['错过 10 天', 348.4], ['错过 20 天', 263.3], ['错过 30 天', 214.4]];
