<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="vignette"></div>
  <div class="layer" id="ui"></div>
</div>
<script src="common.js"></script>
<script src="data/ep03_ndx_dca.js"></script>
<script>
// =============== Episode 03 · 复利（指数增长偏差） ===============
window.DURATION = 48.4; // first ~48s of the script

LABELS.push(
  [4.3, 29.9, 'BACKTEST  ·  20 年回测'],
  [34.4, 48.0, 'BIAS  ·  偏差'],
);

// ---------- A. 20 years of 100 a day: Nasdaq-100 vs a 1.6% bank deposit (0–30) ----------
// Real data: NDX_DCA rows = [date, principal, value] (see data/ep03_sim.py)
cue(0.3, 4.0, 420, 76, [{ text: '如果 {g:20} 年前，你每天定投纳指 {g:100} 块，' }, { text: '现在会有多少钱？', delay: 1.0 }], { lineHeight: 1.5 });
cue(4.3, 7.0, 880, 54, [{ text: '另一个你，每天把 100 块存进银行，年化 1.6%。' }]);
cue(7.2, 11.5, 880, 54, [{ text: '2008 年，金融危机。你投进去 7.6 万，只剩 {r:4 万}。' }]);
cue(11.7, 14.5, 880, 54, [{ text: '前 3 年多，你一直在{r:亏钱}的边缘打转。' }]);
cue(14.7, 17.5, 880, 54, [{ text: '2017 年，第一个 {g:100 万}。用了 {g:11} 年。' }]);
cue(17.7, 20.5, 880, 54, [{ text: '第二个 100 万，只用了 {g:3} 年。' }]);
cue(20.7, 23.5, 880, 54, [{ text: '2022 年，7 个月里蒸发了 {r:82 万}。' }]);
cue(23.7, 27.0, 880, 54, [{ text: '今天：本金 73 万。银行 {g:86 万}，纳指 {g:557 万}。' }]);
cue(27.2, 30.0, 880, 54, [{ text: '前 11 年攒到 100 万，后 9 年，多出了 {g:457 万}。' }]);
src(4.3, 29.9, '纳斯达克 100 指数日收盘价（不含分红），按当日汇率换算人民币，未计手续费与税费；银行按年化 1.6% 复利  ·  2006.10.20–2026.10.19  ·  历史回测，不代表未来，不构成投资建议');
ALLTEXT.push('每天定投纳指 100 块', '每天存银行 100 块', '年化 1.6%', '本金', '万', '前 11 年', '后 9 年');

const DAY = 86400000, D0 = Date.parse(NDX_DCA[0][0]);
const ROWDAY = NDX_DCA.map(r => (Date.parse(r[0]) - D0) / DAY);
const END_DAY = ROWDAY[ROWDAY.length - 1];
const dayOf = s => (Date.parse(s) - D0) / DAY;
// the clock: holds while a caption reads, then runs to the next moment
const KEYS = [[4.6, '2006-10-20'], [7.0, '2008-11-20'], [11.7, '2008-11-20'], [13.0, '2010-07-06'], [14.7, '2010-07-06'],
  [16.2, '2017-10-30'], [17.7, '2017-10-30'], [19.0, '2020-08-03'], [20.7, '2020-08-03'], [22.2, '2022-06-16'], [23.7, '2022-06-16'], [25.8, '2026-10-19']].map(([t, d]) => [t, dayOf(d)]);
function clockDay(t) {
  if (t <= KEYS[0][0]) return 0;
  for (let i = 1; i < KEYS.length; i++) if (t <= KEYS[i][0]) return lerp(KEYS[i - 1][1], KEYS[i][1], easeInOut(seg(t, KEYS[i - 1][0], KEYS[i][0])));
  return END_DAY;
}
function ndxAt(day) { // value and principal on a (fractional) calendar day
  let lo = 0, hi = ROWDAY.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; ROWDAY[m] <= day ? lo = m : hi = m - 1; }
  const a = NDX_DCA[lo], b = NDX_DCA[Math.min(lo + 1, NDX_DCA.length - 1)], f = lo + 1 < NDX_DCA.length ? clamp((day - ROWDAY[lo]) / (ROWDAY[lo + 1] - ROWDAY[lo])) : 0;
  return { v: lerp(a[2], b[2], f), p: 100 * (day + 1) };
}
const BR = Math.pow(1.016, 1 / 365) - 1;
const bankAt = day => 100 * (Math.pow(1 + BR, day + 1) - 1) / BR;
const wan = x => (x / 1e4).toFixed(1);
const fmtDate = day => { const d = new Date(D0 + Math.round(day) * DAY); return `${d.getUTCFullYear()}.${String(d.getUTCMonth() + 1).padStart(2, '0')}.${String(d.getUTCDate()).padStart(2, '0')}`; };

function race(t) {
  const a = env(t, 4.1, 30.3, .6, .6); if (a <= 0) return;
  const day = clockDay(t), n = ndxAt(day), b = bankAt(day), loss = n.v < n.p;
  ctx.save(); ctx.globalAlpha = a;
  // date
  text(fmtDate(day), W / 2, 150, `400 52px ${MONO}`, '#d9cfae', 'center', 1, 10);
  // two counters
  const cols = [[600, '每天定投纳指 100 块', n.v, loss ? `rgb(${RED})` : `rgb(${GOLD})`], [1320, '每天存银行 100 块 · 年化 1.6%', b, '#efe9da']];
  for (const [x, name, v, col] of cols) {
    text(name, x, 270, `700 30px ${SANS}`, '#a8a08e', 'center');
    ctx.font = `900 120px ${SERIF}`; const nw = ctx.measureText(wan(v)).width; ctx.font = `900 44px ${SERIF}`; const uw = ctx.measureText('万').width;
    const left = x - (nw + 14 + uw) / 2;
    text(wan(v), left, 390, `900 120px ${SERIF}`, col, 'left', 1, col === '#efe9da' ? 8 : 22);
    text('万', left + nw + 14, 410, `900 44px ${SERIF}`, '#cfc8b8', 'left');
    text('本金 ' + wan(n.p) + ' 万', x, 480, `400 24px ${MONO}`, '#7a7262', 'center');
  }
  // sparkline of both, on a fixed scale so the early years look flat
  const sx0 = 360, sx1 = 1560, sy0 = 790, sy1 = 560, vmax = 5.8e6;
  const SX = d => lerp(sx0, sx1, d / END_DAY), SY = v => lerp(sy0, sy1, v / vmax);
  ctx.strokeStyle = 'rgba(255,240,210,.18)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.lineTo(sx1, sy0); ctx.stroke();
  for (const y of [2006, 2011, 2016, 2021, 2026]) text(String(y), SX(dayOf(y + '-10-20')), sy0 + 26, `400 18px ${MONO}`, '#5f5a51', 'center');
  // split shading at the first million
  const split = dayOf('2017-10-30'), sk = seg(t, 27.3, 27.9);
  if (sk > 0) {
    ctx.save(); ctx.globalAlpha *= sk; ctx.fillStyle = 'rgba(160,152,138,.08)'; ctx.fillRect(sx0, sy1 - 10, SX(split) - sx0, sy0 - sy1 + 10);
    ctx.fillStyle = `rgba(${GOLD},.07)`; ctx.fillRect(SX(split), sy1 - 10, sx1 - SX(split), sy0 - sy1 + 10); ctx.restore();
    text('前 11 年 · 100 万', (sx0 + SX(split)) / 2, sy1 + 4, `700 26px ${SANS}`, '#a8a08e', 'center', sk);
    text('后 9 年 · +457 万', (SX(split) + sx1) / 2, sy1 + 4, `700 26px ${SANS}`, `rgb(${GOLD})`, 'center', sk, 10);
  }
  // bank line
  ctx.save(); ctx.strokeStyle = '#d8d0bf'; ctx.lineWidth = 2.5; ctx.beginPath();
  for (let i = 0; i <= 200; i++) { const d = day * i / 200; i ? ctx.lineTo(SX(d), SY(bankAt(d))) : ctx.moveTo(SX(d), SY(bankAt(d))); } ctx.stroke(); ctx.restore();
  // nasdaq line (daily rows up to the clock)
  ctx.save(); ctx.strokeStyle = `rgb(${GOLD})`; ctx.lineWidth = 3; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 12; ctx.beginPath();
  for (let i = 0; i < NDX_DCA.length && ROWDAY[i] <= day; i += 3) { const x = SX(ROWDAY[i]), y = SY(NDX_DCA[i][2]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.lineTo(SX(day), SY(n.v)); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.fillStyle = loss ? `rgb(${RED})` : `rgb(${GOLD})`; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 16; ctx.beginPath(); ctx.arc(SX(day), SY(n.v), 7, 0, 7); ctx.fill(); ctx.restore();
  ctx.restore();
}

// ---------- B. title (16–20) ----------
const title = makeTitle('冷知识 · 03', '复利', 'EXPONENTIAL GROWTH BIAS', [[30.2, 34.2]]);

// ---------- C. straight line vs curve (20–34) ----------
cue(34.6, 38.1, 880, 60, [{ text: '我们的大脑，习惯用{g:直线}想象未来。' }]);
cue(38.3, 42.1, 880, 60, [{ text: '所以前期，总觉得"怎么还{g:没动静}"；' }]);
cue(42.3, 45.1, 880, 60, [{ text: '后期，又总被{r:吓一跳}。' }]);
cue(45.3, 48.2, 880, 60, [{ text: '心理学把这叫作：{g:指数增长偏差}。' }]);
ALLTEXT.push('你以为的', '实际的', '失望区', '震惊区', '怎么还没动静', '怎么突然这么多', '时间', '增长');

const K = 4.6;
const expY = x => (Math.exp(K * x) - 1) / (Math.exp(K) - 1);
const linY = x => 0.62 * x;
function lineVsCurve(t) {
  const a = env(t, 20.0, 34.2, .5, .5); if (a <= 0) return;
  const px0 = 380, px1 = 1540, py0 = 790, py1 = 190;
  const X = x => lerp(px0, px1, x), Y = y => lerp(py0, py1, y);
  ctx.save(); ctx.globalAlpha = a;
  // axes
  const ak = easeOut(seg(t, 20.2, 20.9));
  ctx.strokeStyle = 'rgba(255,240,210,.3)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px0, py0 - (py0 - py1) * ak); ctx.lineTo(px0, py0); ctx.lineTo(px0 + (px1 - px0) * ak, py0); ctx.stroke();
  text('时间 →', px1, py0 + 34, `400 22px ${MONO}`, '#6d685e', 'right', ak);
  text('增长', px0 - 20, py1, `400 22px ${MONO}`, '#6d685e', 'right', ak);
  // regions between the two lines
  const xc = (() => { let lo = .3, hi = 1; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; expY(m) < linY(m) ? lo = m : hi = m; } return lo; })();
  const p1 = easeInOut(seg(t, 24.2, 27.4)) * xc;                 // curve drawn up to here during "没动静"
  const p2 = p1 + easeInOut(seg(t, 28.1, 29.8)) * (1 - xc);      // then the jump
  const fillBetween = (xa, xb, col) => {
    if (xb <= xa) return; ctx.beginPath();
    for (let i = 0; i <= 60; i++) { const x = lerp(xa, xb, i / 60); i ? ctx.lineTo(X(x), Y(linY(x))) : ctx.moveTo(X(x), Y(linY(x))); }
    for (let i = 60; i >= 0; i--) { const x = lerp(xa, xb, i / 60); ctx.lineTo(X(x), Y(expY(x))); }
    ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  };
  fillBetween(0, Math.min(p1, xc), 'rgba(160,152,138,.16)');
  fillBetween(xc, p2, `rgba(${RED},.22)`);
  // the straight line you imagine
  const lk = easeInOut(seg(t, 20.8, 22.8));
  ctx.save(); ctx.setLineDash([12, 10]); ctx.strokeStyle = '#e9e2cf'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(lk), Y(linY(lk))); ctx.stroke(); ctx.restore();
  text('你以为的', X(1) + 16, Y(linY(1)), `700 26px ${SANS}`, '#e9e2cf', 'left', seg(t, 22.4, 22.9));
  // the real curve
  if (p2 > 0) {
    ctx.save(); ctx.strokeStyle = `rgb(${GOLD})`; ctx.lineWidth = 5; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 18; ctx.beginPath();
    for (let i = 0; i <= 120; i++) { const x = p2 * i / 120; i ? ctx.lineTo(X(x), Y(expY(x))) : ctx.moveTo(X(x), Y(expY(x))); }
    ctx.stroke(); ctx.restore();
    ctx.save(); ctx.fillStyle = `rgb(${GOLD})`; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 20; ctx.beginPath(); ctx.arc(X(p2), Y(expY(p2)), 9, 0, 7); ctx.fill(); ctx.restore();
    text('实际的', X(1) + 16, Y(1), `700 26px ${SANS}`, `rgb(${GOLD})`, 'left', seg(t, 29.6, 30.1));
  }
  // region labels
  const gl = seg(t, 25.6, 26.2), rl = seg(t, 29.2, 29.8);
  text('失望区', X(xc * .55), Y(linY(xc * .55)) - 60, `900 34px ${SERIF}`, '#b8b0a0', 'center', gl);
  text('"怎么还没动静"', X(xc * .55), Y(linY(xc * .55)) - 22, `500 20px ${SANS}`, '#8a857a', 'center', gl);
  text('震惊区', X(.955) - 70, Y(.82), `900 34px ${SERIF}`, `rgb(${RED})`, 'right', rl, 14);
  text('"怎么突然这么多"', X(.955) - 70, Y(.82) + 38, `500 20px ${SANS}`, '#c98a80', 'right', rl);
  // the crossing point
  const ck = seg(t, 28.1, 28.6);
  if (p2 >= xc && ck > 0) { ctx.save(); ctx.globalAlpha *= ck; ctx.strokeStyle = 'rgba(255,240,210,.35)'; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(X(xc), Y(linY(xc))); ctx.lineTo(X(xc), py0); ctx.stroke(); ctx.restore(); }
  ctx.restore();
}

// ---------- frame ----------
window.render = function (t) {
  clearFrame();
  dotGrid(env(t, 0, 30.2, .6, .5) * .6);
  race(t);
  floor(env(t, 30.1, 34.3, .5, .4), 700);
  dotGrid(env(t, 34.2, 48.4, .5, .5) * .5);
  lineVsCurve(t - 14.2); // section C is authored on a 20–34s clock
  renderMeta(t); title(t); renderCues(t);
};
window.ready = (async () => { await loadFonts(); window.render(0); return true; })();
</script>
</body>
</html>
