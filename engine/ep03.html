<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="vignette"></div>
  <div class="layer" id="ui"></div>
</div>
<script src="common.js"></script>
<script src="data/ep03_ndx_dca.js"></script>
<script>
// =============== Episode 03 · 复利（指数增长偏差） ===============
window.DURATION = 44.4; // first ~44s of the script

LABELS.push(
  [4.4, 25.9, 'BACKTEST  ·  20 年回测'],
  [30.4, 44.0, 'BIAS  ·  偏差'],
);

// ---------- A. 20 years of 100 a day: Nasdaq-100 vs a 1.6% bank deposit (0–26) ----------
// Real data: NDX_DCA rows = [date, principal, value] (see data/ep03_sim.py)
cue(0.3, 4.0, 420, 76, [{ text: '如果 {g:20} 年前，你每天定投纳指 {g:100} 块，' }, { text: '现在会有多少钱？', delay: 1.0 }], { lineHeight: 1.5 });
cue(4.4, 7.8, 900, 50, [{ text: '两个人，每天各拿出 100 块：一个定投{g:纳指}，一个存{g:银行}（年化 1.6%）。' }]);
cue(19.4, 22.4, 900, 56, [{ text: '同样投进去 {g:73 万}，20 年后——' }]);
cue(22.6, 26.0, 900, 56, [{ text: '差距：{g:471 万}。' }]);
src(4.4, 25.9, '纳斯达克 100 指数日收盘价（不含分红），按当日汇率换算人民币，未计手续费与税费；银行按年化 1.6% 复利  ·  2006.10.20–2026.10.19  ·  历史回测，不代表未来，不构成投资建议');
ALLTEXT.push('定投纳指', '存银行', '本金 73 万', '差距', '557 万', '86 万', '471 万');

const DAY = 86400000, D0 = Date.parse(NDX_DCA[0][0]);
const ROWDAY = NDX_DCA.map(r => (Date.parse(r[0]) - D0) / DAY);
const END_DAY = ROWDAY[ROWDAY.length - 1];
const BR = Math.pow(1.016, 1 / 365) - 1;
const bankAt = day => 100 * (Math.pow(1 + BR, day + 1) - 1) / BR;
const RUNMAX = []; NDX_DCA.reduce((m, r, i) => (RUNMAX[i] = Math.max(m, r[2]), RUNMAX[i]), 0);
function rowIndex(day) { let lo = 0, hi = ROWDAY.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; ROWDAY[m] <= day ? lo = m : hi = m - 1; } return lo; }
function ndxAt(day) { const i = rowIndex(day), j = Math.min(i + 1, NDX_DCA.length - 1); const f = j > i ? clamp((day - ROWDAY[i]) / (ROWDAY[j] - ROWDAY[i])) : 0; return lerp(NDX_DCA[i][2], NDX_DCA[j][2], f); }

const RUN0 = 5.0, RUN1 = 19.0; // the 20 years play out continuously in 14 seconds
const clockDay = t => END_DAY * Math.pow(seg(t, RUN0, RUN1), 1.0);
function race(t) {
  const a = env(t, 4.2, 26.3, .6, .6); if (a <= 0) return;
  const day = clockDay(t), i = rowIndex(day), vN = ndxAt(day), vB = bankAt(day);
  const px0 = 200, px1 = 1500, py0 = 800, py1 = 140;
  const yMax = Math.max(4e4, Math.max(RUNMAX[i], vN, vB) * 1.18);       // the axis keeps stretching to fit
  const span = Math.max(day, 420) / 0.97;                                 // the time axis zooms out too
  const X = d => lerp(px0, px1, d / span), Y = v => lerp(py0, py1, v / yMax);
  ctx.save(); ctx.globalAlpha = a;
  // grid: several "nice" step sizes cross-fade as the scale grows
  for (let e = 3; e <= 7; e++) for (const m of [1, 2, 5]) {
    const step = m * Math.pow(10, e), spacing = (py0 - py1) * step / yMax, al = clamp((spacing - 60) / 80) * clamp((260 - spacing) / 80);
    if (al <= 0.01) continue;
    for (let v = step; v < yMax; v += step) {
      ctx.strokeStyle = `rgba(255,240,210,${.07 * al})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(px0, Y(v)); ctx.lineTo(px1, Y(v)); ctx.stroke();
      text((v / 1e4 >= 1 ? Math.round(v / 1e4) : (v / 1e4).toFixed(1)) + ' 万', px0 - 18, Y(v), `400 18px ${MONO}`, `rgba(140,133,122,${al})`, 'right');
    }
  }
  ctx.strokeStyle = 'rgba(255,240,210,.3)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px0, py1); ctx.lineTo(px0, py0); ctx.lineTo(px1, py0); ctx.stroke();
  for (const ys of [1, 2, 5, 10]) {
    const spacing = (px1 - px0) * 365.25 * ys / span, al = clamp((spacing - 120) / 30) * clamp((300 - spacing) / 40);
    if (al <= 0.01) continue;
    for (let y = 2007; y <= 2026; y++) if ((y - 2006) % ys === 0) {
      const x = X((Date.parse(y + '-01-01') - D0) / DAY); if (x < px0 + 10 || x > px1 + 5) continue;
      ctx.strokeStyle = `rgba(255,240,210,${.05 * al})`; ctx.beginPath(); ctx.moveTo(x, py1); ctx.lineTo(x, py0); ctx.stroke();
      text(String(y), x, py0 + 30, `400 20px ${MONO}`, `rgba(120,114,104,${al})`, 'center');
    }
  }
  // paths
  const nPts = [], bPts = [];
  for (let k = 0; k <= i; k += (i > 1500 ? 2 : 1)) nPts.push([X(ROWDAY[k]), Y(NDX_DCA[k][2])]);
  nPts.push([X(day), Y(vN)]);
  for (let k = 0; k <= 160; k++) { const d = day * k / 160; bPts.push([X(d), Y(bankAt(d))]); }
  // the gap between them, filled
  ctx.beginPath(); nPts.forEach((p, k) => k ? ctx.lineTo(...p) : ctx.moveTo(...p)); for (let k = bPts.length - 1; k >= 0; k--) ctx.lineTo(...bPts[k]); ctx.closePath();
  const gg = ctx.createLinearGradient(0, py1, 0, py0); gg.addColorStop(0, `rgba(${GOLD},.28)`); gg.addColorStop(1, `rgba(${GOLD},.04)`); ctx.fillStyle = gg; ctx.fill();
  // bank line
  ctx.save(); ctx.strokeStyle = '#e4dccb'; ctx.lineWidth = 3.5; ctx.shadowColor = 'rgba(255,255,255,.5)'; ctx.shadowBlur = 8; ctx.beginPath();
  bPts.forEach((p, k) => k ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.stroke(); ctx.restore();
  // nasdaq line
  ctx.save(); ctx.strokeStyle = `rgb(${GOLD})`; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 16; ctx.beginPath();
  nPts.forEach((p, k) => k ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.stroke(); ctx.restore();
  // glowing heads + line names riding along
  const heads = [[X(day), Y(vB), '#e4dccb', '存银行'], [X(day), Y(vN), vN < vB ? `rgb(${RED})` : `rgb(${GOLD})`, '定投纳指']];
  const sep = Math.abs(heads[0][1] - heads[1][1]) < 40 ? 22 : 0; // keep the two names apart at the start
  heads.forEach(([x, y, c, name], k) => {
    ctx.save(); ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 22; ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fill(); ctx.restore();
    text(name, x + 18, y + (k ? -sep : sep), `700 24px ${SANS}`, c, 'left', seg(t, 4.6, 5.2) * (1 - seg(t, 19.0, 19.4)));
  });
  // the year at the head
  text(String(new Date(D0 + day * DAY).getUTCFullYear()), X(day), py0 - 24, `400 22px ${MONO}`, '#cfc5a6', 'center', seg(t, RUN0, RUN0 + .3) * (1 - seg(t, RUN1, RUN1 + .4)));
  // the end: values, principal, and the gap
  const ek = easeOut(seg(t, 19.3, 20.0));
  if (ek > 0) {
    const yP = Y(730500);
    ctx.save(); ctx.globalAlpha *= ek; ctx.setLineDash([10, 10]); ctx.strokeStyle = 'rgba(170,162,148,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px0, yP); ctx.lineTo(px1, yP); ctx.stroke(); ctx.restore();
    text('本金 73 万', px0 + 16, yP - 20, `500 24px ${SANS}`, '#a8a08e', 'left', ek);
    text('557 万', px1 - 20, Y(vN) - 6, `900 64px ${SERIF}`, `rgb(${GOLD})`, 'right', ek, 22);
    text('86 万', px1 - 20, Y(vB) - 40, `900 48px ${SERIF}`, '#efe9da', 'right', ek, 8);
  }
  const gk = easeInOut(seg(t, 22.6, 23.4));
  if (gk > 0) {
    const bx = px1 + 44, yb = Y(vB), yt = lerp(yb, Y(vN), gk);
    ctx.save(); ctx.strokeStyle = `rgb(${RED})`; ctx.lineWidth = 5; ctx.shadowColor = `rgb(${RED})`; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.moveTo(bx - 14, yb); ctx.lineTo(bx, yb); ctx.lineTo(bx, yt); ctx.lineTo(bx - 14, yt); ctx.stroke(); ctx.restore();
    text('差距', bx + 24, (yb + Y(vN)) / 2 - 34, `700 28px ${SANS}`, '#e8b0a6', 'left', seg(t, 23.2, 23.6));
    text('471 万', bx + 24, (yb + Y(vN)) / 2 + 14, `900 64px ${SERIF}`, `rgb(${RED})`, 'left', seg(t, 23.2, 23.6), 22);
  }
  ctx.restore();
}

// ---------- B. title (16–20) ----------
const title = makeTitle('冷知识 · 03', '复利', 'EXPONENTIAL GROWTH BIAS', [[26.2, 30.2]]);

// ---------- C. straight line vs curve (20–34) ----------
cue(30.6, 34.1, 880, 60, [{ text: '我们的大脑，习惯用{g:直线}想象未来。' }]);
cue(34.3, 38.1, 880, 60, [{ text: '所以前期，总觉得"怎么还{g:没动静}"；' }]);
cue(38.3, 41.1, 880, 60, [{ text: '后期，又总被{r:吓一跳}。' }]);
cue(41.3, 44.2, 880, 60, [{ text: '心理学把这叫作：{g:指数增长偏差}。' }]);
ALLTEXT.push('你以为的', '实际的', '失望区', '震惊区', '怎么还没动静', '怎么突然这么多', '时间', '增长');

const K = 4.6;
const expY = x => (Math.exp(K * x) - 1) / (Math.exp(K) - 1);
const linY = x => 0.62 * x;
function lineVsCurve(t) {
  const a = env(t, 20.0, 34.2, .5, .5); if (a <= 0) return;
  const px0 = 380, px1 = 1540, py0 = 790, py1 = 190;
  const X = x => lerp(px0, px1, x), Y = y => lerp(py0, py1, y);
  ctx.save(); ctx.globalAlpha = a;
  // axes
  const ak = easeOut(seg(t, 20.2, 20.9));
  ctx.strokeStyle = 'rgba(255,240,210,.3)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px0, py0 - (py0 - py1) * ak); ctx.lineTo(px0, py0); ctx.lineTo(px0 + (px1 - px0) * ak, py0); ctx.stroke();
  text('时间 →', px1, py0 + 34, `400 22px ${MONO}`, '#6d685e', 'right', ak);
  text('增长', px0 - 20, py1, `400 22px ${MONO}`, '#6d685e', 'right', ak);
  // regions between the two lines
  const xc = (() => { let lo = .3, hi = 1; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; expY(m) < linY(m) ? lo = m : hi = m; } return lo; })();
  const p1 = easeInOut(seg(t, 24.2, 27.4)) * xc;                 // curve drawn up to here during "没动静"
  const p2 = p1 + easeInOut(seg(t, 28.1, 29.8)) * (1 - xc);      // then the jump
  const fillBetween = (xa, xb, col) => {
    if (xb <= xa) return; ctx.beginPath();
    for (let i = 0; i <= 60; i++) { const x = lerp(xa, xb, i / 60); i ? ctx.lineTo(X(x), Y(linY(x))) : ctx.moveTo(X(x), Y(linY(x))); }
    for (let i = 60; i >= 0; i--) { const x = lerp(xa, xb, i / 60); ctx.lineTo(X(x), Y(expY(x))); }
    ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  };
  fillBetween(0, Math.min(p1, xc), 'rgba(160,152,138,.16)');
  fillBetween(xc, p2, `rgba(${RED},.22)`);
  // the straight line you imagine
  const lk = easeInOut(seg(t, 20.8, 22.8));
  ctx.save(); ctx.setLineDash([12, 10]); ctx.strokeStyle = '#e9e2cf'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(lk), Y(linY(lk))); ctx.stroke(); ctx.restore();
  text('你以为的', X(1) + 16, Y(linY(1)), `700 26px ${SANS}`, '#e9e2cf', 'left', seg(t, 22.4, 22.9));
  // the real curve
  if (p2 > 0) {
    ctx.save(); ctx.strokeStyle = `rgb(${GOLD})`; ctx.lineWidth = 5; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 18; ctx.beginPath();
    for (let i = 0; i <= 120; i++) { const x = p2 * i / 120; i ? ctx.lineTo(X(x), Y(expY(x))) : ctx.moveTo(X(x), Y(expY(x))); }
    ctx.stroke(); ctx.restore();
    ctx.save(); ctx.fillStyle = `rgb(${GOLD})`; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 20; ctx.beginPath(); ctx.arc(X(p2), Y(expY(p2)), 9, 0, 7); ctx.fill(); ctx.restore();
    text('实际的', X(1) + 16, Y(1), `700 26px ${SANS}`, `rgb(${GOLD})`, 'left', seg(t, 29.6, 30.1));
  }
  // region labels
  const gl = seg(t, 25.6, 26.2), rl = seg(t, 29.2, 29.8);
  text('失望区', X(xc * .55), Y(linY(xc * .55)) - 60, `900 34px ${SERIF}`, '#b8b0a0', 'center', gl);
  text('"怎么还没动静"', X(xc * .55), Y(linY(xc * .55)) - 22, `500 20px ${SANS}`, '#8a857a', 'center', gl);
  text('震惊区', X(.955) - 70, Y(.82), `900 34px ${SERIF}`, `rgb(${RED})`, 'right', rl, 14);
  text('"怎么突然这么多"', X(.955) - 70, Y(.82) + 38, `500 20px ${SANS}`, '#c98a80', 'right', rl);
  // the crossing point
  const ck = seg(t, 28.1, 28.6);
  if (p2 >= xc && ck > 0) { ctx.save(); ctx.globalAlpha *= ck; ctx.strokeStyle = 'rgba(255,240,210,.35)'; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(X(xc), Y(linY(xc))); ctx.lineTo(X(xc), py0); ctx.stroke(); ctx.restore(); }
  ctx.restore();
}

// ---------- frame ----------
window.render = function (t) {
  clearFrame();
  dotGrid(env(t, 0, 26.2, .6, .5) * .6);
  race(t);
  floor(env(t, 26.1, 30.3, .5, .4), 700);
  dotGrid(env(t, 30.2, 44.4, .5, .5) * .5);
  lineVsCurve(t - 10.2); // section C is authored on a 20–34s clock
  renderMeta(t); title(t); renderCues(t);
};
window.ready = (async () => { await loadFonts(); window.render(0); return true; })();
</script>
</body>
</html>
