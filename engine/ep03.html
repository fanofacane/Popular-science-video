<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="common.css">
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="vignette"></div>
  <div class="layer" id="ui"></div>
</div>
<script src="common.js"></script>
<script>
// =============== Episode 03 · 复利（指数增长偏差） ===============
window.DURATION = 36.5; // sample: first ~36s of the ~152s script

LABELS.push(
  [0.2, 18.0, 'QUESTION  ·  一个问题'],
  [22.5, 36.1, 'BIAS  ·  偏差'],
);

// ---------- A. the question, then 10万 over 30 years (0–18) ----------
cue(0.3, 3.4, 470, 84, [{ text: '10 万块，放 {g:30} 年，' }, { text: '会变成多少？', delay: .7 }], { lineHeight: 1.45 });
cue(3.7, 6.6, 880, 56, [{ text: '假设每年 6% 的收益，第 10 年：{g:17.9 万}。' }]);
cue(6.8, 9.6, 880, 56, [{ text: '第 20 年：{g:32.1 万}。' }]);
cue(9.8, 12.6, 880, 56, [{ text: '第 30 年：{g:57.4 万}。' }]);
cue(12.8, 15.6, 880, 56, [{ text: '三个 10 年，分别多赚了 7.9 万、14.2 万、{g:25.4 万}。' }]);
cue(15.8, 18.0, 880, 56, [{ text: '最后 10 年赚的，比前 20 年{r:加起来还多}。' }]);
src(3.8, 17.9, '假设一次性存入 10 万元，年化 6% 复利  ·  数学示意，不构成投资建议');
ALLTEXT.push('本金 10 万', '7.9 + 14.2 = 22.1  <  25.4', '+7.9 万', '+14.2 万', '+25.4 万', '17.9 万', '32.1 万', '57.4 万');

const val = y => 10 * Math.pow(1.06, y); // 万元
function lumpLine(t) {
  const a = env(t, 3.5, 18.3, .6, .6); if (a <= 0) return;
  const px0 = 420, px1 = 1500, py0 = 790, py1 = 190, vmax = 60;
  const X = y => lerp(px0, px1, y / 30), Y = v => lerp(py0, py1, v / vmax);
  ctx.save(); ctx.globalAlpha = a;
  // axes and grid appear only now
  const gk = easeOut(seg(t, 3.6, 4.3));
  for (const v of [0, 20, 40, 60]) {
    ctx.strokeStyle = `rgba(255,240,210,${v ? .07 : .3})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(px0, Y(v)); ctx.lineTo(lerp(px0, px1 + 30, gk), Y(v)); ctx.stroke();
    text(v + ' 万', px0 - 24, Y(v), `400 20px ${MONO}`, '#6d685e', 'right', gk);
  }
  for (const y of [0, 10, 20, 30]) text('第 ' + y + ' 年', X(y), py0 + 34, `400 20px ${MONO}`, '#8a857a', 'center', gk);
  // principal: flat dashed line
  ctx.save(); ctx.setLineDash([10, 10]); ctx.strokeStyle = 'rgba(170,162,148,.6)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(X(0), Y(10)); ctx.lineTo(lerp(X(0), X(30), gk), Y(10)); ctx.stroke(); ctx.restore();
  text('本金 10 万', X(30) + 16, Y(10), `500 22px ${SANS}`, '#8a857a', 'left', gk);
  // the gold line, drawn decade by decade in step with the captions
  const yr = 10 * easeInOut(seg(t, 3.9, 6.2)) + 10 * easeInOut(seg(t, 6.9, 9.2)) + 10 * easeInOut(seg(t, 9.9, 12.2));
  if (yr > 0) {
    // area
    ctx.beginPath(); ctx.moveTo(X(0), Y(0));
    for (let i = 0; i <= 90; i++) { const y = yr * i / 90; ctx.lineTo(X(y), Y(val(y))); }
    ctx.lineTo(X(yr), Y(0)); ctx.closePath();
    const ag = ctx.createLinearGradient(0, py1, 0, py0); ag.addColorStop(0, `rgba(${GOLD},.20)`); ag.addColorStop(1, `rgba(${GOLD},0)`); ctx.fillStyle = ag; ctx.fill();
    ctx.save(); ctx.strokeStyle = `rgb(${GOLD})`; ctx.lineWidth = 5; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 18; ctx.beginPath();
    for (let i = 0; i <= 90; i++) { const y = yr * i / 90; i ? ctx.lineTo(X(y), Y(val(y))) : ctx.moveTo(X(y), Y(val(y))); }
    ctx.stroke(); ctx.restore();
    ctx.save(); ctx.fillStyle = `rgb(${GOLD})`; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 22; ctx.beginPath(); ctx.arc(X(yr), Y(val(yr)), 9, 0, 7); ctx.fill(); ctx.restore();
  }
  // milestone dots and values
  [[10, '17.9 万', 6.0], [20, '32.1 万', 9.0], [30, '57.4 万', 12.0]].forEach(([y, lbl, at]) => {
    const k = easeOut(seg(t, at, at + .4)); if (k <= 0) return;
    ctx.save(); ctx.globalAlpha *= k; ctx.fillStyle = `rgb(${GOLD})`; ctx.beginPath(); ctx.arc(X(y), Y(val(y)), 7, 0, 7); ctx.fill(); ctx.restore();
    text(lbl, X(y) - 14, Y(val(y)) - 36, `900 34px ${SERIF}`, `rgb(${GOLD})`, 'right', k, 12);
  });
  // gain per decade: vertical brackets on the right of each decade
  const hi = easeInOut(seg(t, 15.8, 16.4));
  [[0, 10, '+7.9 万', 12.9], [10, 20, '+14.2 万', 13.5], [20, 30, '+25.4 万', 14.1]].forEach(([y0, y1, lbl, at], i) => {
    const k = easeOut(seg(t, at, at + .6)); if (k <= 0) return;
    const last = i === 2, x = X(y1) + 26, v0 = Y(val(y0)), v1 = lerp(v0, Y(val(y1)), k);
    const col = last ? (hi > .5 ? `rgb(${RED})` : `rgb(${GOLD})`) : `rgba(${GOLD},${1 - .5 * hi})`;
    ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = last ? 6 : 4; ctx.shadowColor = col; ctx.shadowBlur = last ? 10 + 16 * hi : 8;
    ctx.beginPath(); ctx.moveTo(x - 8, v0); ctx.lineTo(x, v0); ctx.lineTo(x, v1); ctx.lineTo(x - 8, v1); ctx.stroke(); ctx.restore();
    // dashed guide from the previous level
    ctx.save(); ctx.globalAlpha *= .4 * k; ctx.setLineDash([4, 6]); ctx.strokeStyle = 'rgba(255,240,210,.6)'; ctx.beginPath(); ctx.moveTo(X(y0), v0); ctx.lineTo(x, v0); ctx.stroke(); ctx.restore();
    text(lbl, x + 14, (v0 + v1) / 2, `900 ${last ? 34 : 28}px ${SERIF}`, last ? col : `rgba(239,230,204,${1 - .5 * hi})`, 'left', k, last ? 14 : 0);
  });
  text('7.9 + 14.2 = 22.1  <  25.4', W / 2, 140, `400 28px ${MONO}`, `rgb(${RED})`, 'center', seg(t, 16.2, 16.7), 10);
  ctx.restore();
}


// ---------- B. title (16–20) ----------
const title = makeTitle('冷知识 · 03', '复利', 'EXPONENTIAL GROWTH BIAS', [[18.3, 22.3]]);

// ---------- C. straight line vs curve (20–34) ----------
cue(22.7, 26.2, 880, 60, [{ text: '我们的大脑，习惯用{g:直线}想象未来。' }]);
cue(26.4, 30.2, 880, 60, [{ text: '所以前期，总觉得"怎么还{g:没动静}"；' }]);
cue(30.4, 33.2, 880, 60, [{ text: '后期，又总被{r:吓一跳}。' }]);
cue(33.4, 36.3, 880, 60, [{ text: '心理学把这叫作：{g:指数增长偏差}。' }]);
ALLTEXT.push('你以为的', '实际的', '失望区', '震惊区', '怎么还没动静', '怎么突然这么多', '时间', '增长');

const K = 4.6;
const expY = x => (Math.exp(K * x) - 1) / (Math.exp(K) - 1);
const linY = x => 0.62 * x;
function lineVsCurve(t) {
  const a = env(t, 20.0, 34.2, .5, .5); if (a <= 0) return;
  const px0 = 380, px1 = 1540, py0 = 790, py1 = 190;
  const X = x => lerp(px0, px1, x), Y = y => lerp(py0, py1, y);
  ctx.save(); ctx.globalAlpha = a;
  // axes
  const ak = easeOut(seg(t, 20.2, 20.9));
  ctx.strokeStyle = 'rgba(255,240,210,.3)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px0, py0 - (py0 - py1) * ak); ctx.lineTo(px0, py0); ctx.lineTo(px0 + (px1 - px0) * ak, py0); ctx.stroke();
  text('时间 →', px1, py0 + 34, `400 22px ${MONO}`, '#6d685e', 'right', ak);
  text('增长', px0 - 20, py1, `400 22px ${MONO}`, '#6d685e', 'right', ak);
  // regions between the two lines
  const xc = (() => { let lo = .3, hi = 1; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; expY(m) < linY(m) ? lo = m : hi = m; } return lo; })();
  const p1 = easeInOut(seg(t, 24.2, 27.4)) * xc;                 // curve drawn up to here during "没动静"
  const p2 = p1 + easeInOut(seg(t, 28.1, 29.8)) * (1 - xc);      // then the jump
  const fillBetween = (xa, xb, col) => {
    if (xb <= xa) return; ctx.beginPath();
    for (let i = 0; i <= 60; i++) { const x = lerp(xa, xb, i / 60); i ? ctx.lineTo(X(x), Y(linY(x))) : ctx.moveTo(X(x), Y(linY(x))); }
    for (let i = 60; i >= 0; i--) { const x = lerp(xa, xb, i / 60); ctx.lineTo(X(x), Y(expY(x))); }
    ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  };
  fillBetween(0, Math.min(p1, xc), 'rgba(160,152,138,.16)');
  fillBetween(xc, p2, `rgba(${RED},.22)`);
  // the straight line you imagine
  const lk = easeInOut(seg(t, 20.8, 22.8));
  ctx.save(); ctx.setLineDash([12, 10]); ctx.strokeStyle = '#e9e2cf'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(lk), Y(linY(lk))); ctx.stroke(); ctx.restore();
  text('你以为的', X(1) + 16, Y(linY(1)), `700 26px ${SANS}`, '#e9e2cf', 'left', seg(t, 22.4, 22.9));
  // the real curve
  if (p2 > 0) {
    ctx.save(); ctx.strokeStyle = `rgb(${GOLD})`; ctx.lineWidth = 5; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 18; ctx.beginPath();
    for (let i = 0; i <= 120; i++) { const x = p2 * i / 120; i ? ctx.lineTo(X(x), Y(expY(x))) : ctx.moveTo(X(x), Y(expY(x))); }
    ctx.stroke(); ctx.restore();
    ctx.save(); ctx.fillStyle = `rgb(${GOLD})`; ctx.shadowColor = `rgb(${GOLD})`; ctx.shadowBlur = 20; ctx.beginPath(); ctx.arc(X(p2), Y(expY(p2)), 9, 0, 7); ctx.fill(); ctx.restore();
    text('实际的', X(1) + 16, Y(1), `700 26px ${SANS}`, `rgb(${GOLD})`, 'left', seg(t, 29.6, 30.1));
  }
  // region labels
  const gl = seg(t, 25.6, 26.2), rl = seg(t, 29.2, 29.8);
  text('失望区', X(xc * .55), Y(linY(xc * .55)) - 60, `900 34px ${SERIF}`, '#b8b0a0', 'center', gl);
  text('"怎么还没动静"', X(xc * .55), Y(linY(xc * .55)) - 22, `500 20px ${SANS}`, '#8a857a', 'center', gl);
  text('震惊区', X(.955) - 70, Y(.82), `900 34px ${SERIF}`, `rgb(${RED})`, 'right', rl, 14);
  text('"怎么突然这么多"', X(.955) - 70, Y(.82) + 38, `500 20px ${SANS}`, '#c98a80', 'right', rl);
  // the crossing point
  const ck = seg(t, 28.1, 28.6);
  if (p2 >= xc && ck > 0) { ctx.save(); ctx.globalAlpha *= ck; ctx.strokeStyle = 'rgba(255,240,210,.35)'; ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(X(xc), Y(linY(xc))); ctx.lineTo(X(xc), py0); ctx.stroke(); ctx.restore(); }
  ctx.restore();
}

// ---------- frame ----------
window.render = function (t) {
  clearFrame();
  dotGrid(env(t, 0, 18.3, .6, .5) * .6);
  lumpLine(t);
  floor(env(t, 18.2, 22.4, .5, .4), 700);
  dotGrid(env(t, 22.3, 36.5, .5, .5) * .5);
  lineVsCurve(t - 2.3); // section C is authored on a 20–34s clock
  renderMeta(t); title(t); renderCues(t);
};
window.ready = (async () => { await loadFonts(); window.render(0); return true; })();
</script>
</body>
</html>
