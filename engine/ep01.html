<script>
// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
// fade in over [a, a+fi], out over [b-fo, b]
const env = (t, a, b, fi = .4, fo = .4) => Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b));
function hash(i, j) { let h = (i * 374761393 + j * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }

const ui = document.getElementById('ui');
const cv = document.getElementById('bg'); const ctx = cv.getContext('2d');
const W = 1920, H = 1080;

// ---------- captions ----------
// markup: {g:text} gold, {r:text} red ; lines: array of {text, delay}
const CUES = [];
function cue(start, end, top, size, lines, extra = {}) {
  const el = document.createElement('div'); el.className = 'cap'; el.style.top = top + 'px'; el.style.fontSize = size + 'px';
  if (extra.lineHeight) el.style.lineHeight = extra.lineHeight;
  const chars = [], strikes = [];
  lines.forEach((ln, li) => {
    const lineEl = document.createElement('span'); lineEl.className = 'ln';
    const delay = ln.delay || 0; let idx = 0;
    const re = /\{([grs]):([^}]*)\}|([^{]+)/g; let m;
    while ((m = re.exec(ln.text))) {
      let cls = m[1] || ''; const txt = m[2] ?? m[3]; let host = lineEl;
      if (cls === 's') { // red word that gets struck through
        cls = 'r'; host = document.createElement('span'); host.className = 'grp'; lineEl.appendChild(host);
        const bar = document.createElement('i'); bar.className = 'strike'; host.appendChild(bar); strikes.push(bar);
      }
      for (const ch of txt) {
        const s = document.createElement('span'); s.className = 'c' + (cls ? ' ' + cls : '');
        s.textContent = ch === ' ' ? '\u00a0' : ch; host.appendChild(s);
        chars.push({ el: s, t0: start + delay + idx * 0.045 }); idx++;
      }
    }
    el.appendChild(lineEl);
  });
  ui.appendChild(el);
  CUES.push({ start, end, el, chars, strikes, strikeAt: extra.strikeAt });
}
function renderCues(t) {
  for (const c of CUES) {
    const vis = t >= c.start - .01 && t <= c.end + .01;
    c.el.style.display = vis ? 'block' : 'none'; if (!vis) continue;
    const out = seg(t, c.end - .4, c.end);
    for (const ch of c.chars) {
      const k = easeOut(seg(t, ch.t0, ch.t0 + .45));
      const o = k * (1 - out);
      ch.el.style.opacity = o;
      ch.el.style.filter = `blur(${(1 - k) * 14 + out * 10}px)`;
      ch.el.style.transform = `translateY(${(1 - k) * 10}px)`;
    }
    for (const b of c.strikes) { const k = easeInOut(seg(t, c.strikeAt, c.strikeAt + .45)); b.style.width = (k * 108) + '%'; b.style.opacity = 1 - out; }
  }
}

// ---------- metas / labels ----------
const METAS = [];
function meta(start, end, top, text, color) {
  const el = document.createElement('div'); el.className = 'meta'; el.style.top = top + 'px'; el.style.color = color; el.textContent = text;
  ui.appendChild(el); METAS.push({ start, end, el });
}
const LABELS = [ // [start, end, text]
  [0.2, 9.8, 'UNREAD  ·  未读'],
  [14.2, 19.8, 'SYMPTOMS  ·  表现'],
  [20.2, 23.0, 'WHERE IT COMES FROM  ·  成因'],
  [23.2, 29.8, 'ABSENT HOME  ·  缺席的家'],
  [30.2, 35.8, 'VIOLENT HOME  ·  吵闹的家'],
  [36.2, 43.8, 'BROKEN PROMISES  ·  失约的家'],
  [44.2, 51.8, 'PUSHED AWAY  ·  被推开的家'],
  [52.2, 61.8, 'HOW IT WORKS  ·  原理'],
];
const labelEl = document.getElementById('label');

// ---------- timeline content ----------
// Scene A: hook (0–10)

cue(5.15, 7.55, 460, 76, [{ text: '你也问过自己：我是不是太{r:冷血}了？' }]);
cue(7.7, 9.8, 460, 76, [{ text: '不是。' }, { text: '你只是，{r:失望}过太多次。', delay: .55 }], { lineHeight: 1.45 });
// Scene C: symptoms (14–20)

// Scene D: doors (20–23)

// Door 1 (23–30)

cue(23.5, 26.7, 720, 64, [{ text: '有的家，父母常年不在身边。' }, { text: '一年只见{g:一次}。', delay: 1.3 }], { lineHeight: 1.55 });
cue(26.9, 29.7, 300, 56, [{ text: '{g:2010} 年，中国农村留守儿童' }]);
// Door 2 (30–36)

// Door 3 (36–44)

// Mechanism (52–62)

cue(55.8, 58.9, 440, 104, [{ text: '{g:不期待，就不会失望。}' }]);

cue(65.6, 68.5, 470, 76, [{ text: '这是一个人在那样的环境里，' }, { text: '{g:最正常的反应}。', delay: 1.0 }], { lineHeight: 1.5 });
cue(68.7, 71.7, 470, 76, [{ text: '你没有坏掉。' }, { text: '你只是，{g:学会了保护自己}。', delay: .9 }], { lineHeight: 1.5 });

// pills
const PILL_TEXT = ['不恋家', '不思念', '不想倾诉', '抗拒亲密'];
const pillsEl = document.getElementById('pills');
const pills = PILL_TEXT.map(s => { const p = document.createElement('div'); p.className = 'pill'; p.textContent = s; pillsEl.appendChild(p); return p; });

// ---------- canvas layers ----------
function pixelWall(t, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(W / 2, H / 2); ctx.rotate(-0.17); ctx.translate(-W / 2, -H / 2);
  const cell = 22, gap = 7, step = cell + gap; const scroll = t * 18;
  for (let r = -14; r < 52; r++) {
    if (((r % 4) + 4) % 4 === 3) continue; // dark band between groups
    const y = r * step - 200;
    const off = (r % 2 ? scroll : -scroll * .7);
    const c0 = Math.floor((-400 - off) / step) - 1;
    for (let c = c0; c < c0 + 100; c++) {
      const x = c * step + off;
      if (x < -400 || x > W + 400) continue;
      const h = hash(c, r), b = 0.55 + 0.45 * hash(r, c * 7);
      let col;
      if (h < 0.025) col = `rgba(245,215,110,${0.85 * b})`;
      else if (h < 0.13) col = `rgba(150,128,58,${0.75 * b})`;
      else col = `rgba(${Math.round(120 * b)},${Math.round(30 * b)},${Math.round(26 * b)},0.9)`;
      ctx.fillStyle = col; ctx.fillRect(x, y, cell, cell);
    }
  }
  ctx.restore();
  // darken behind text
  const g = ctx.createRadialGradient(W / 2, 500, 50, W / 2, 500, 900);
  g.addColorStop(0, `rgba(7,7,7,${0.72 * alpha})`); g.addColorStop(0.6, `rgba(7,7,7,${0.35 * alpha})`); g.addColorStop(1, 'rgba(7,7,7,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function floor(alpha, horizon = 640) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = 'rgba(255,214,150,0.10)'; ctx.lineWidth = 1.2;
  const vx = W / 2, vy = horizon - 140;
  for (let i = -24; i <= 24; i++) { const x = vx + i * 160; ctx.beginPath(); ctx.moveTo(vx + (x - vx) * 0.12, horizon); ctx.lineTo(x * 1 + (x - vx) * 2.2, H + 300); ctx.stroke(); }
  for (let k = 1; k < 16; k++) { const y = horizon + Math.pow(k / 15, 2.1) * (H - horizon + 80); ctx.globalAlpha = alpha * (0.3 + 0.7 * k / 15); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();
  // horizon glow
  const g = ctx.createRadialGradient(W / 2, horizon, 10, W / 2, horizon, 700);
  g.addColorStop(0, `rgba(255,200,120,${0.10 * alpha})`); g.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

const DOORS = [
  { col: [245, 215, 110] }, { col: [232, 72, 58] }, { col: [240, 138, 60] }, { col: [216, 208, 192] },
];
function doors(t) {
  const a = env(t, 20.0, 23.4, .6, .5); if (a <= 0) return;
  const dw = 190, dh = 330, gapX = 140, total = 4 * dw + 3 * gapX, x0 = (W - total) / 2, y0 = 420;
  const zoom = easeInOut(seg(t, 22.0, 22.6));
  DOORS.forEach((d, i) => {
    const appear = easeOut(seg(t, 20.2 + i * 0.22, 20.9 + i * 0.22));
    let alpha = a * appear * (i === 0 ? 1 : 1 - zoom);
    if (alpha <= 0) return;
    let x = x0 + i * (dw + gapX), y = y0, w = dw, h = dh;
    if (i === 0) { // slide to centre, then dissolve into a flash of light
      const mv = easeInOut(seg(t, 22.2, 22.9)); const s = 1 + 0.08 * mv;
      const cx = lerp(x + dw / 2, W / 2, mv); w = dw * s; h = dh * s; x = cx - w / 2; y = y0 + dh - h;
      alpha *= 1 - seg(t, 23.0, 23.4);
    }
    const [r, g, b] = d.col; const flick = i === 1 ? 0.7 + 0.3 * Math.abs(Math.sin(t * 11)) : 1;
    ctx.save(); ctx.globalAlpha = alpha;
    // light spilling under the door
    const lg = ctx.createRadialGradient(x + w / 2, y + h, 2, x + w / 2, y + h, w * 1.1);
    lg.addColorStop(0, `rgba(${r},${g},${b},${0.45 * flick})`); lg.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = lg; ctx.fillRect(x - w, y + h - w * .2, w * 3, w * 1.3);
    // door body
    ctx.fillStyle = '#0c0c0c'; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = `rgba(${r},${g},${b},0.55)`; ctx.lineWidth = 2; ctx.shadowColor = `rgba(${r},${g},${b},0.8)`; ctx.shadowBlur = 18; ctx.strokeRect(x, y, w, h);
    // slit of light at the bottom
    ctx.fillStyle = `rgba(${r},${g},${b},${0.95 * flick})`; ctx.shadowBlur = 24; ctx.fillRect(x + 3, y + h - 5, w - 6, 4);
    // knob
    ctx.beginPath(); ctx.arc(x + w * 0.82, y + h * 0.53, Math.max(3, w * 0.025), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });
}

function calendar(t) {
  const a = env(t, 23.1, 29.8, .5, .5); if (a <= 0) return;
  const dim = 1 - 0.75 * easeInOut(seg(t, 26.6, 27.3));
  const cols = 53, rows = 7, cell = 20, gap = 6, step = cell + gap;
  const total = cols * step - gap, x0 = (W - total) / 2, y0 = 360 + 40 * easeInOut(seg(t, 26.6, 27.3));
  const special = 5 * 7 + 3; // late Jan / early Feb: Spring Festival
  for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
    const i = c * 7 + r; if (i >= 365) continue;
    const appear = easeOut(seg(t, 23.3 + c * 0.018, 23.7 + c * 0.018));
    const x = x0 + c * step, y = y0 + r * step;
    ctx.save(); ctx.globalAlpha = a * appear * dim;
    if (i === special) {
      const lit = easeOut(seg(t, 25.2, 25.8));
      ctx.fillStyle = lit > 0 ? `rgba(245,215,110,${0.25 + 0.75 * lit})` : '#2b2a28';
      if (lit > 0) { ctx.shadowColor = 'rgba(245,215,110,.95)'; ctx.shadowBlur = 50 * lit; }
      ctx.fillRect(x, y, cell, cell);
      if (lit > 0) { ctx.shadowBlur = 0; ctx.globalAlpha = a * dim * lit * 0.9; ctx.font = '400 16px "JetBrains Mono"'; ctx.fillStyle = '#c9b071'; ctx.textAlign = 'center'; ctx.fillText('春节', x + cell / 2, y - 16); }
    } else {
      const v = 34 + Math.round(10 * hash(c, r)); ctx.fillStyle = `rgb(${v},${v - 1},${v - 3})`; ctx.fillRect(x, y, cell, cell);
    }
    ctx.restore();
  }
  // axis labels
  ctx.save(); ctx.globalAlpha = a * dim * seg(t, 23.6, 24.2); ctx.font = '400 15px "JetBrains Mono"'; ctx.fillStyle = '#4d4a44';
  ctx.textAlign = 'left'; ctx.fillText('JAN', x0, y0 + rows * step + 22); ctx.textAlign = 'right'; ctx.fillText('DEC', x0 + total, y0 + rows * step + 22);
  ctx.textAlign = 'center'; ctx.fillText('365 DAYS', W / 2, y0 + rows * step + 22);
  ctx.restore();
}

// ---------- DOM blocks ----------
const titleEl = document.getElementById('title');
const titleChars = [...titleEl.querySelectorAll('.main span')];
const kicker = titleEl.querySelector('.kicker'), sub = titleEl.querySelector('.sub'), dot = titleEl.querySelector('.dot');
const counterEl = document.getElementById('counter'), numEl = counterEl.querySelector('.num');
const sourceEl = document.getElementById('source');

function renderDOM(t) {
  // label
  let lt = '', la = 0;
  for (const [a, b, s] of LABELS) if (t >= a && t <= b) { lt = s; la = env(t, a, b, .5, .4); }
  labelEl.textContent = lt; labelEl.style.opacity = la;
  for (const m of METAS) m.el.style.opacity = env(t, m.start, m.end, .5, .4);

  // title (10–14)
  const T0 = t >= 71.5 ? 71.8 : 10.0, T1 = t >= 71.5 ? 75.0 : 14.0;
  const ta = env(t, T0, T1, .3, t >= 71.5 ? 1.0 : .45); t = t >= 71.5 ? t - 61.8 : t; // replay title animation
  titleEl.style.display = ta > 0 ? 'block' : 'none';
  if (ta > 0) {
    titleEl.style.opacity = ta;
    titleEl.style.transform = `scale(${1 + 0.035 * seg(t, 10, 14)})`;
    kicker.style.opacity = seg(t, 10.2, 10.8);
    titleChars.forEach((c, i) => { const k = easeOut(seg(t, 10.35 + i * 0.09, 10.95 + i * 0.09)); c.style.opacity = k; c.style.filter = `blur(${(1 - k) * 18}px)`; });
    dot.style.opacity = seg(t, 11.2, 11.5) * (0.75 + 0.25 * Math.sin(t * 6));
    const sk = easeOut(seg(t, 11.3, 12.1)); sub.style.opacity = sk; sub.style.letterSpacing = `${0.5 + 0.4 * sk}em`;
  }

  // pills (14–20)
  const pa = env(t, 14.0, 19.9, .2, .45);
  pillsEl.style.display = pa > 0 ? 'flex' : 'none';
  if (pa > 0) {
    pillsEl.style.opacity = pa;
    pills.forEach((p, i) => {
      const k = easeOut(seg(t, 14.4 + i * 0.55, 14.85 + i * 0.55));
      const off = easeInOut(seg(t, 16.5 + i * 0.2, 17.1 + i * 0.2));
      p.style.opacity = k; p.style.transform = `translateY(${(1 - k) * 14}px) scale(${0.92 + 0.08 * k})`; p.style.filter = `blur(${(1 - k) * 10}px)`;
      p.style.background = `rgba(${Math.round(lerp(245, 38, off))},${Math.round(lerp(215, 14, off))},${Math.round(lerp(110, 12, off))},1)`;
      p.style.color = off < .5 ? '#2a2108' : '#b9473a';
      p.style.borderColor = `rgba(150,45,35,${off})`;
      p.style.boxShadow = `0 0 ${36 * (1 - off)}px rgba(245,215,110,${0.6 * (1 - off)})`;
    });
  }

  // counter (27–30)
  const ca = env(t, 27.0, 29.8, .4, .45);
  counterEl.style.display = ca > 0 ? 'block' : 'none'; sourceEl.style.opacity = ca * seg(t, 28.2, 28.8);
  if (ca > 0) {
    counterEl.style.opacity = ca; const k = easeOut(seg(t, 27.1, 28.5));
    numEl.textContent = Math.round(6102 * k).toString();
    counterEl.style.filter = `blur(${(1 - seg(t, 27.0, 27.4)) * 12}px)`;
  }
}

// ---------- door 3: promise cards & rules ----------
const cardsEl = document.getElementById('cards');
const CARDS = ['周末带你去公园', '这次一定戒了', '下次不赌了'].map((txt, i) => {
  const c = document.createElement('div'); c.className = 'card'; c.style.left = (W / 2 - 660 + i * 460) + 'px'; c.textContent = txt;
  const b = document.createElement('i'); b.className = 'bar'; c.appendChild(b); cardsEl.appendChild(c); return { c, b };
});
const rulesEl = document.getElementById('rules');
const RULES = [['DON\'T TALK', '不说'], ['DON\'T TRUST', '不信'], ['DON\'T FEEL', '不感受']].map(([en, zh], i) => {
  const r = document.createElement('div'); r.className = 'rule'; r.style.top = (330 + i * 92) + 'px';
  r.innerHTML = `<span class="en">${en}</span><span class="zh">${zh}</span>`; rulesEl.appendChild(r); return r;
});
const ruleSrc = document.createElement('div'); ruleSrc.className = 'meta'; ruleSrc.style.top = '620px'; ruleSrc.style.color = '#6d685e';
ruleSrc.textContent = 'CLAUDIA BLACK  ·  1981  ·  酗酒家庭研究'; rulesEl.appendChild(ruleSrc);

// ---------- door 4: reaching out ----------
const talkEl = document.getElementById('talk');
const mk = (cls, html, x, y) => { const e = document.createElement('div'); e.className = cls; e.innerHTML = html; e.style.left = x + 'px'; e.style.top = y + 'px'; talkEl.appendChild(e); return e; };
const youNode = mk('node', '你', 620, 420), parNode = mk('node', '父母', 1300, 420);
const askB = mk('bubble gold', '我今天被老师批评了…', 0, 0);
const REPLIES = [['这点事也哭？', 45.7], ['你懂什么', 46.3], ['肯定是你自己的问题', 46.9]].map(([s, at], i) => ({ e: mk('bubble red', s, 0, 0), at, i }));
const expLabel = mk('meta', '', 0, 572); expLabel.style.color = '#8f8063';
const barBox = document.createElement('div'); barBox.style.cssText = 'position:absolute;left:660px;top:612px;width:600px;height:12px;border-radius:6px;background:#1e1c18;overflow:hidden';
const barFill = document.createElement('div'); barFill.style.cssText = 'height:100%;background:#F5D76E;box-shadow:0 0 16px rgba(245,215,110,.8)'; barBox.appendChild(barFill); talkEl.appendChild(barBox);

const toggleEl = document.getElementById('toggle'), knob = toggleEl.querySelector('.knob'), track = toggleEl.querySelector('.track'), stateEl = toggleEl.querySelector('.state');
const disclaimer = document.getElementById('disclaimer');

function renderLate(t) {
  // door 3 cards
  const ca = env(t, 36.2, 40.2, .3, .5); cardsEl.style.display = ca > 0 ? 'block' : 'none';
  if (ca > 0) CARDS.forEach(({ c, b }, i) => {
    const k = easeOut(seg(t, 36.4 + i * .4, 36.9 + i * .4)), x = easeInOut(seg(t, 37.9 + i * .45, 38.3 + i * .45));
    c.style.opacity = ca * k * (1 - .55 * x); c.style.transform = `translateY(${(1 - k) * 16}px)`; c.style.filter = `blur(${(1 - k) * 10}px)`;
    c.style.borderColor = `rgba(${Math.round(lerp(245, 232, x))},${Math.round(lerp(215, 72, x))},${Math.round(lerp(110, 58, x))},.55)`;
    c.style.color = x > .5 ? '#8a6a60' : '#e8dcb8'; b.style.width = (88 * x) + '%';
  });
  const ra = env(t, 40.1, 43.9, .3, .45); rulesEl.style.display = ra > 0 ? 'block' : 'none';
  if (ra > 0) { RULES.forEach((r, i) => { const k = easeOut(seg(t, 40.4 + i * .5, 40.9 + i * .5)); r.style.opacity = ra * k; r.style.filter = `blur(${(1 - k) * 12}px)`; }); ruleSrc.style.opacity = ra * seg(t, 42.0, 42.5); }

  // door 4 conversation
  const da = env(t, 44.1, 51.9, .4, .5); talkEl.style.display = da > 0 ? 'block' : 'none';
  if (da > 0) {
    talkEl.style.opacity = da;
    const g = easeInOut(seg(t, 49.6, 50.6)); youNode.style.borderColor = `rgb(${Math.round(lerp(238, 70, g))},${Math.round(lerp(238, 68, g))},${Math.round(lerp(238, 64, g))})`;
    youNode.style.color = g > .5 ? '#55524c' : '#f2efe8'; youNode.style.boxShadow = `0 0 ${24 * (1 - g)}px rgba(255,255,255,.18)`;
    const ak = easeOut(seg(t, 44.6, 45.3)), aout = seg(t, 47.4, 47.9);
    askB.style.opacity = ak * (1 - aout); askB.style.left = lerp(720, 800, ak) + 'px'; askB.style.top = '300px';
    askB.style.filter = `blur(${(1 - ak) * 8 + aout * 8}px)`;
    REPLIES.forEach(({ e, at, i }) => {
      const k = easeOut(seg(t, at, at + .35)), out = seg(t, 49.0, 49.6);
      e.style.opacity = k * (1 - out); e.style.left = '1420px'; e.style.top = (300 + i * 82) + 'px';
      e.style.transform = `scale(${0.6 + 0.4 * k}) translateX(${(1 - k) * -60}px)`; e.style.transformOrigin = 'left center';
    });
    // expectation drains, reach-out counter ticks
    let lvl = 1 - 0.18 * (seg(t, 45.7, 45.9) + seg(t, 46.3, 46.5) + seg(t, 46.9, 47.1));
    lvl *= 1 - easeInOut(seg(t, 47.9, 49.6)); barFill.style.width = (lvl * 100) + '%';
    const n = t < 45.7 ? 0 : t < 47.9 ? (t < 46.3 ? 1 : t < 46.9 ? 2 : 3) : Math.min(100, 3 + Math.round(97 * Math.pow(seg(t, 47.9, 49.6), 1.6)));
    expLabel.textContent = `期待值 EXPECTATION    ·    伸手 ×${n}`;
  }

  // mechanism toggle
  const ta2 = env(t, 59.0, 62.0, .4, .45); toggleEl.style.display = ta2 > 0 ? 'flex' : 'none';
  if (ta2 > 0) {
    toggleEl.style.opacity = ta2; const k = easeInOut(seg(t, 59.8, 60.4));
    knob.style.left = lerp(126, 10, k) + 'px';
    knob.style.background = k < .5 ? '#F5D76E' : '#4a4740'; knob.style.boxShadow = `0 0 ${30 * (1 - k)}px rgba(245,215,110,.9)`;
    track.style.borderColor = `rgba(${Math.round(lerp(245, 90, k))},${Math.round(lerp(215, 86, k))},${Math.round(lerp(110, 78, k))},.7)`;
    stateEl.textContent = k < .5 ? 'ON' : 'OFF'; stateEl.style.color = k < .5 ? '#F5D76E' : '#6d685e';
  }
  disclaimer.style.opacity = env(t, 62.6, 75, .8, .6);
}

// door 2: violent flashes
const HITS = [30.55, 31.15, 31.45, 32.3, 32.75];
function hitAt(t) { let v = 0; for (const h of HITS) v = Math.max(v, t >= h ? Math.exp(-(t - h) * 7) : 0); return v; }
function violentHome(t) {
  const a = env(t, 30.0, 36.1, .4, .5); if (a <= 0) return 0;
  const hit = hitAt(t), calm = seg(t, 33.4, 34.6);
  // red flash wash
  const g = ctx.createRadialGradient(W / 2 - 240, 520, 20, W / 2 - 240, 520, 1100);
  g.addColorStop(0, `rgba(232,72,58,${a * (0.08 + 0.35 * hit)})`); g.addColorStop(1, 'rgba(232,72,58,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // the closed door with red light leaking under it
  const dw = 210, dh = 360, x = W / 2 - 360, y = 300, flick = (0.55 + 0.45 * hit) * (1 - 0.6 * calm);
  ctx.save(); ctx.globalAlpha = a;
  const lg = ctx.createRadialGradient(x + dw / 2, y + dh, 2, x + dw / 2, y + dh, 260);
  lg.addColorStop(0, `rgba(232,72,58,${0.6 * flick})`); lg.addColorStop(1, 'rgba(232,72,58,0)'); ctx.fillStyle = lg; ctx.fillRect(x - 260, y + dh - 60, dw + 520, 320);
  ctx.fillStyle = '#0c0c0c'; ctx.fillRect(x, y, dw, dh);
  ctx.strokeStyle = `rgba(232,72,58,${0.4 + 0.5 * flick})`; ctx.lineWidth = 2; ctx.shadowColor = 'rgba(232,72,58,.9)'; ctx.shadowBlur = 20; ctx.strokeRect(x, y, dw, dh);
  ctx.fillStyle = `rgba(232,72,58,${flick})`; ctx.shadowBlur = 26; ctx.fillRect(x + 3, y + dh - 5, dw - 6, 4);
  ctx.restore();
  // the child: a small circle in the corner, shrinking and dimming
  const r = lerp(34, 22, calm), cx = W / 2 + 330, cy = y + dh - r;
  ctx.save(); ctx.globalAlpha = a * lerp(1, 0.55, calm); ctx.strokeStyle = '#eee'; ctx.lineWidth = 3; ctx.shadowColor = 'rgba(255,255,255,.4)'; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.arc(cx + (hit > .3 ? (Math.random() - .5) * 4 : 0), cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.shadowBlur = 0; ctx.font = '500 22px "Noto Sans SC"'; ctx.fillStyle = '#9a958b'; ctx.textAlign = 'center'; ctx.fillText('孩子', cx, cy + r + 36); ctx.restore();
  return hit * (1 - calm) * a;
}

// mechanism: four doors converge into one
function converge(t) {
  const a = env(t, 52.0, 55.8, .4, .5); if (a <= 0) return;
  const cols = [[245, 215, 110], [232, 72, 58], [240, 138, 60], [216, 208, 192]], names = ['缺席', '吵闹', '失约', '推开'];
  const k = easeInOut(seg(t, 53.4, 54.8)); const dw = 150, dh = 260, gap = 120, total = 4 * dw + 3 * gap, x0 = (W - total) / 2, y = 360;
  cols.forEach(([r, g, b], i) => {
    const x = lerp(x0 + i * (dw + gap), W / 2 - dw / 2, k);
    ctx.save(); ctx.globalAlpha = a * easeOut(seg(t, 52.2 + i * .15, 52.7 + i * .15));
    ctx.fillStyle = '#0c0c0c'; ctx.fillRect(x, y, dw, dh);
    ctx.strokeStyle = `rgba(${r},${g},${b},.6)`; ctx.lineWidth = 2; ctx.shadowColor = `rgba(${r},${g},${b},.8)`; ctx.shadowBlur = 16; ctx.strokeRect(x, y, dw, dh);
    ctx.fillStyle = `rgba(${r},${g},${b},${0.9 * (1 - k * .8)})`; ctx.fillRect(x + 3, y + dh - 5, dw - 6, 4);
    ctx.shadowBlur = 0; ctx.globalAlpha *= 1 - k; ctx.font = '500 24px "Noto Sans SC"'; ctx.fillStyle = `rgb(${r},${g},${b})`; ctx.textAlign = 'center'; ctx.fillText(names[i], x + dw / 2, y + dh + 44);
    ctx.restore();
  });
}

// ---------- frame ----------
window.render = function (t) {
  ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#070707'; ctx.fillRect(0, 0, W, H);
  pixelWall(t, env(t, 0, 10.0, .6, .5) * 0.85);
  floor(env(t, 9.9, 14.1, .5, .4), 700);
  floor(env(t, 19.9, 23.3, .5, .6) * 0.8, 780);
  doors(t);
  const fl = Math.min(seg(t, 22.85, 23.15), 1 - seg(t, 23.15, 23.8));
  if (fl > 0) { const g = ctx.createRadialGradient(W / 2, 640, 10, W / 2, 640, 1100); g.addColorStop(0, `rgba(255,226,150,${0.4 * fl})`); g.addColorStop(1, 'rgba(255,226,150,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  calendar(t);
  const shake = violentHome(t);
  floor(env(t, 51.9, 62.1, .5, .5) * 0.6, 760);
  converge(t);
  // door flashes at the start of doors 2, 3, 4
  for (const [at, col] of [[30.0, '232,72,58'], [36.0, '240,138,60'], [44.0, '216,208,192']]) {
    const f = Math.min(seg(t, at - .25, at), 1 - seg(t, at, at + .6));
    if (f > 0) { const g = ctx.createRadialGradient(W / 2, 600, 10, W / 2, 600, 1100); g.addColorStop(0, `rgba(${col},${0.35 * f})`); g.addColorStop(1, `rgba(${col},0)`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  }
  // ending: the wall returns, quieter, slowly pulling back
  const ea = env(t, 62.0, 75.0, 1.0, 1.2);
  if (ea > 0) { ctx.save(); const s = 1.12 - 0.12 * seg(t, 62, 75); ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2); pixelWall(t, ea * 0.55); ctx.restore(); }
  stage.style.transform = shake > 0.02 ? `translate(${(Math.sin(t * 97) * 9 * shake).toFixed(1)}px, ${(Math.cos(t * 83) * 6 * shake).toFixed(1)}px)` : 'none';
  renderDOM(t); renderLate(t); renderCues(t);
};
window.DURATION = 75;
const stage = document.getElementById('stage');

window.ready = (async () => {
  const text = [...document.querySelectorAll('.cap, #title, #pills, #counter, #source, .meta')].map(e => e.textContent).join('') + '春节0123456789万';
  await Promise.all([
    document.fonts.load('900 64px "Noto Serif SC"', text), document.fonts.load('700 64px "Noto Serif SC"', text),
    document.fonts.load('500 22px "Noto Sans SC"', text), document.fonts.load('700 44px "Noto Sans SC"', text),
    document.fonts.load('400 20px "JetBrains Mono"', 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789·/'),
  ]);
  await document.fonts.ready; window.render(0); return true;
})();
</script>
